/* =================== KPI ENGINE =================== */
const TARGET=[40,70,90,110,130,110,90,70,40];          // points per quarter by designation level (L0 Intern … L8 C-Level)
const QTR={label:'Q4 2026',start:'2026-10-01',end:'2026-12-31'};
const elapsed=()=>Math.min(1,(days(TODAY,QTR.start)+1)/(days(QTR.end,QTR.start)+1));
const KPI_PARTS=[['delivery','Delivery points','Points earned vs pro-rated target for the designation'],['ontime','On-time rate','Tasks finished by the (approved) due date'],['delay','Delay accountability','−12 per working day of delay caused to others'],['checkin','Check-in compliance','Check-ins made vs required'],['quality','Quality','−15 per task reopened for rework'],['rating','Superior rating','1–5 rating from superior / team lead'],['meeting','Meeting attendance','Present = 1, late = 0.5, absent = 0']];
DB.extScore={};
function kpiOf(id){
  const e=emp(id);if(!e)return null;
  const b=DB.kpiBase[id]||{pts:0,tasks:0,ontime:0,ce:0,cd:0,rw:0,rating:3,src:'Hajimi'};
  const ts=DB.tasks.filter(t=>t.who===id),done=ts.filter(t=>t.status==='Done'&&t.done>=QTR.start),ext=DB.ext.filter(x=>x.who===id);
  const pts=b.pts+done.reduce((a,t)=>a+tpts(t),0)+ext.reduce((a,x)=>a+x.pts,0);
  const ntask=b.tasks+done.length+ext.length,ontime=b.ontime+done.filter(t=>t.done<=t.due).length+ext.filter(x=>x.ontime).length;
  let ce=b.ce,cd=b.cd;
  ts.filter(t=>t.status!=='To do').forEach(t=>{const end=t.done||TODAY,exp=Math.max(1,Math.floor(wdays(t.start,end<t.start?t.start:end)/DB.settings.checkinEvery));ce+=exp;cd+=Math.min(exp,t.ci.length)});
  const delayDays=DB.delays.filter(d=>d.resp===id&&d.date>=QTR.start).reduce((a,d)=>a+d.days,0);
  const rw=b.rw+ts.reduce((a,t)=>a+(t.rework||0),0);
  const meets=DB.meetings.filter(m=>m.status==='Completed'&&mAtt(m).includes(id));
  const mInv=meets.length,mPres=meets.filter(m=>(m.att[id]||'present')==='present').length,mLate=meets.filter(m=>m.att[id]==='late').length;
  const target=Math.max(1,Math.round(TARGET[des(e.desig).level]*elapsed()));
  const parts={delivery:Math.min(100,pts/target*100),ontime:ntask?ontime/ntask*100:null,delay:Math.max(0,100-delayDays*12),checkin:ce?cd/ce*100:null,quality:Math.max(0,100-rw*15),rating:(b.rating||3)*20,meeting:mInv?(mPres+mLate*.5)/mInv*100:null};
  const W=DB.settings.weights;let ws=0,sum=0;for(const k in parts)if(parts[k]!==null){ws+=W[k];sum+=W[k]*parts[k]}
  let score=ws?sum/ws:0;
  const src=ext.length||((b.src==='ClickUp'||b.src==='Mixed')&&ts.length)?'Mixed':b.src;
  if(DB.settings.kpiMode==='external'&&DB.extScore[id]!=null)score=DB.extScore[id];
  return {id,pts,target,ntask,ontime,ce,cd,delayDays,rw,mInv,mPres,mLate,parts,score,grade:score>=85?'A':score>=70?'B':score>=55?'C':'D',src,ws,rating:b.rating||3,imported:ext.length+(b.src!=='Hajimi'?b.tasks:0)};
}
const GRADE_T={A:'ok',B:'info',C:'warn',D:'bad'};
const gradeBadge = k => `<span class="grade" style="background:color-mix(in srgb,var(--${GRADE_T[k.grade]}) 16%,transparent);color:var(--${GRADE_T[k.grade]})">${k.grade}</span>`;
const SRC_T={Hajimi:['Hajimi','acc'],ClickUp:['ClickUp import','hi'],Mixed:['Mixed','info']};
function kpiPeople(){
  const base=DB.employees.filter(e=>des(e.desig).level<9);
  if(isHR())return base;const ids=new Set([...scope(),S.user.eid]);return base.filter(e=>ids.has(e.id));
}
function pgKpi(){
  const list=kpiPeople().filter(e=>!S.kpiDept||e.dept===S.kpiDept).map(e=>({e,k:kpiOf(e.id)})).sort((a,b)=>b.k.score-a.k.score);
  const W=DB.settings.weights,wsum=Object.values(W).reduce((a,b)=>a+b,0),hr=['sysadmin','hr','exec'].includes(S.user.roleKey);
  const pc=v=>v==null?'<span class="muted" data-tip="No data from this source; weight redistributed">n/a</span>':`<span class="tnum" style="color:${v>=85?'var(--ok)':v>=60?'inherit':'var(--bad)'}">${v.toFixed(0)}</span>`;
  return `<div class="flex flex-wrap items-center gap-3 mb-4">
    ${chip(`${QTR.label} · ${Math.round(elapsed()*100)}% elapsed`,'acc','calendar-range')}${chip(DB.settings.kpiMode==='system'?'Calculated in system':'Final scores from external sheet',DB.settings.kpiMode==='system'?'ok':'hi','calculator')}
    <div class="flex-1"></div>${isHR()?sel('kpi-d',[['','All departments'],...deptNames()],S.kpiDept||'',`style="width:190px" onchange="S.kpiDept=this.value;rerender()"`):''}</div>
  ${hr?`<section class="card p-5 mb-4"><div class="flex flex-wrap items-start gap-4"><div class="flex-1 min-w-[260px]"><h3 class="card-title">${ic('sigma','w-4 h-4')}Formula</h3><p class="text-xs muted mt-1">Score = Σ(weight × component) ÷ Σ(weights of components that have data). Imported tasks have no check-ins, so that weight is redistributed instead of scoring zero.</p></div>
    <div class="flex gap-2 flex-wrap"><label class="check-row" style="padding:6px 10px"><input type="radio" name="kmode" ${DB.settings.kpiMode==='system'?'checked':''} onchange="DB.settings.kpiMode='system';rerender()">In system</label><label class="check-row" style="padding:6px 10px"><input type="radio" name="kmode" ${DB.settings.kpiMode==='external'?'checked':''} onchange="DB.settings.kpiMode='external';rerender()">External sheet</label></div></div>
    <div class="grid grid-cols-2 sm:grid-cols-4 xl:grid-cols-7 gap-3 mt-4">${KPI_PARTS.map(([k,l,d])=>`<label class="fld" data-tip="${esc(d)}"><span>${l}</span><div class="flex items-center gap-1"><input class="input tnum" type="number" min="0" max="100" value="${W[k]}" onchange="DB.settings.weights['${k}']=+this.value;rerender()" style="height:36px"><span class="muted text-sm">%</span></div></label>`).join('')}</div>
    <div class="text-xs mt-2 ${wsum===100?'muted':''}" style="${wsum===100?'':'color:var(--bad)'}">Total ${wsum}%${wsum===100?'':' (should be 100%)'}</div></section>`:''}
  <section class="card overflow-hidden"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Employee</th><th>Source</th><th>Points</th>${KPI_PARTS.slice(1).map(p=>`<th class="text-center" data-tip="${esc(p[2])}">${p[1].split(' ')[0]}</th>`).join('')}<th>Score</th><th class="text-right">Actions</th></tr></thead><tbody>
  ${list.map(({e,k})=>`<tr><td><div class="flex items-center gap-2">${av(e.name,30)}<div class="min-w-0"><div class="font-semibold">${esc(e.name)}</div><div class="text-xs muted">${des(e.desig).name} · ${esc(e.dept)}</div></div></div></td>
    <td>${chip(...SRC_T[k.src])}</td><td><div class="tnum text-sm"><b>${k.pts}</b> / ${k.target}</div><div class="pct mt-1" style="width:80px"><i style="width:${Math.min(100,k.pts/k.target*100)}%"></i></div></td>
    ${['ontime','delay','checkin','quality','rating','meeting'].map(p=>`<td class="text-center">${pc(k.parts[p])}</td>`).join('')}
    <td><div class="flex items-center gap-2">${gradeBadge(k)}<span class="score tnum">${k.score.toFixed(1)}</span></div></td>
    <td><div class="actions">${ib('chart-no-axes-column','Breakdown',`viewKpi('${e.id}')`)}${(isHR()||scope().includes(e.id))&&e.id!==S.user.eid?ib('star','Set superior rating',`rateEmp('${e.id}')`):''}</div></td></tr>`).join('')}
  </tbody></table></div></section>
  <p class="text-xs muted mt-3">Targets per quarter by level: ${DB.designations.filter(d=>d.level<9).map(d=>`${d.name} ${TARGET[d.level]}`).join(' · ')} points, pro-rated to today.</p>`;
}

function previewExt(){
  const rows=parseCSV($('#ix-in').value),h=rows[0].map(x=>x.toLowerCase()),find=(...ks)=>h.findIndex(c=>ks.some(k=>c.includes(k)));
  const ci={title:find('task name','name','item','task'),who:find('email','assignee','person'),due:find('due','timeline'),done:find('closed','completed','completion'),tag:find('tag'),hrs:find('estimate','hours')};
  const pm=val('ix-p');
  S.ixRows=rows.slice(1).map(r=>{const email=(r[ci.who]||'').trim().toLowerCase(),e=DB.employees.find(x=>x.email===email);
    let tg='F',lv=2;const m=(r[ci.tag]||'').match(/([A-Z])\s*-?\s*L?(\d)/i);
    if(pm==='tag'&&m&&tag(m[1].toUpperCase())){tg=m[1].toUpperCase();lv=Math.min(tag(m[1].toUpperCase()).levels.length,+m[2])}
    if(pm==='hours'){const hh=parseFloat(r[ci.hrs])||4;tg=hh<=8?'F':hh<=24?'E':hh<=40?'D':hh<=80?'C':'B';lv=3}
    const pts=pm==='fixed'?5:tagLevel({tag:tg,level:lv}).pts;
    return {title:r[ci.title],email,e,tg,lv,pts,due:r[ci.due],done:r[ci.done],ontime:(r[ci.done]||'9')<= (r[ci.due]||'0')}});
  $('#ix-prev').innerHTML=`<div class="text-xs mb-2 muted">Detected columns: ${Object.entries(ci).map(([k,i])=>`${k} → <b>${i>=0?esc(rows[0][i]):'?'}</b>`).join(' · ')}</div><div class="tbl-wrap"><table class="mini-tbl"><thead><tr><th>Task</th><th>Matched to</th><th>Tag</th><th>Pts</th><th>On time</th></tr></thead><tbody>${S.ixRows.map(r=>`<tr class="${r.e?'':'row-err'}"><td>${esc(r.title)}</td><td>${r.e?esc(r.e.name):`<span style="color:var(--bad)">No match: ${esc(r.email)}</span>`}</td><td>${r.tg}-L${r.lv}</td><td class="tnum">${r.pts}</td><td>${r.ontime?chip('Yes','ok'):chip('Late','bad')}</td></tr>`).join('')}</tbody></table></div>`;
  const n=S.ixRows.filter(r=>r.e).length,b=$('#ix-go');b.disabled=!n;b.style.opacity=n?1:.5;b.innerHTML=`${ic('cloud-download')}Import ${n} task${n===1?'':'s'}`;icons();
}
function commitExt(){
  const src=val('ix-s'),ok=S.ixRows.filter(r=>r.e);
  ok.forEach(r=>DB.ext.push({who:r.e.id,title:r.title,pts:r.pts,ontime:r.ontime,src}));
  const it=DB.integrations.find(i=>src.startsWith(i.name)||i.name.startsWith(src.split(' ')[0]));if(it){it.last=TODAY;it.rows+=ok.length;if(it.mode==='Off')it.mode='Import (CSV)'}
  closeModal();rerender();toast(`${ok.length} tasks imported from ${src}`,'cloud-download');
}
function exportKpi(){
  const W=DB.settings.weights,list=kpiPeople().map(e=>({e,k:kpiOf(e.id)}));
  const head=['employee_no','name','department','designation','source','points','target',...KPI_PARTS.map(p=>p[0]),'score','grade'];
  const rows=list.map(({e,k})=>[e.no,e.name,e.dept,des(e.desig).name,k.src,k.pts,k.target,...KPI_PARTS.map(p=>k.parts[p[0]]==null?'':k.parts[p[0]].toFixed(1)),k.score.toFixed(1),k.grade]);
  const wrow=['weights','','','','','','',...KPI_PARTS.map(p=>W[p[0]]),'',''];
  const csv=[head,wrow,...rows].map(r=>r.map(v=>/[,"]/.test(v)?`"${String(v).replace(/"/g,'""')}"`:v).join(',')).join('\n');
  S.kpiTsv=[head,wrow,...rows].map(r=>r.join('\t')).join('\n');
  const url='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  openModal({title:'Export KPI',icon:'sheet',size:'lg',body:`<p class="text-sm mb-3">${list.length} employees · ${QTR.label}. Row 2 holds the weights so the sheet can recalculate. Google Sheets formula for score (row 3):</p>
    <div class="code mb-3">=SUMPRODUCT(H3:N3,$H$2:$N$2)/SUMPRODUCT(--(H3:N3&lt;&gt;""),$H$2:$N$2)</div>
    <div class="code">${esc(csv.split('\n').slice(0,6).join('\n'))}${list.length>4?'\n…':''}</div>
    <p class="text-xs muted mt-2">To calculate outside the system, switch KPI to “External sheet”, then import final scores back as <span class="mono">employee_no,final_score</span>.</p>`,
    foot:`<button class="btn btn-ghost" onclick="importScores()">${ic('upload')}Import final scores</button><button class="btn btn-ghost" onclick="try{navigator.clipboard.writeText(S.kpiTsv).then(()=>toast('Copied. Paste into Google Sheets','copy')).catch(()=>toast('Clipboard blocked here','circle-alert'))}catch(e){toast('Clipboard blocked here','circle-alert')}">${ic('copy')}Copy for Google Sheets</button><a class="btn btn-primary" href="${url}" download="kpi-${QTR.label.replace(' ','-').toLowerCase()}.csv">${ic('download')}Download .csv (Excel)</a>`});
}
function importScores(){openModal({title:'Import final scores',icon:'upload',body:`${fld('Paste CSV (employee_no,final_score)',`<textarea id="fs-in" class="input mono" rows="6">employee_no,final_score\nLN-0026,92\nLN-0038,58</textarea>`)}`,

/* ---------- new campaign wizard (5 steps) ---------- */
const WIZ_STEPS=['Details','Brands','Features','Who gets what','Review'];
function newCampaign(){S.wiz={step:0,name:'',desc:'',start:TODAY,end:'',pms:S.user.eid?[S.user.eid]:[],pics:[],designers:isGuestUser()?[uid()]:[],markets:[],feats:[],pick:{},dates:{}};renderWiz()}
function wizSave(){const w=S.wiz;
  if(w.step===0){w.name=val('wz-n');w.desc=val('wz-d');w.start=val('wz-s');w.end=val('wz-e');Object.assign(w,readRoles('wz-'));w.pm=w.pms[0]}
  if(w.step===1)w.markets=picked('wz-m');
  if(w.step===2)w.feats=picked('wz-f');
  if(w.step===3){w.feats.forEach((f,i)=>{w.dates[f]=[val('wz-d'+i),val('wz-h'+i)];w.markets.forEach(m=>w.pick[f+'|'+m]=!!$(`#wz-c${i}-${m}`)?.checked)})}}
function wizCheck(){const w=S.wiz;
  if(w.step===0&&!w.name)return 'Give the campaign a name';
  if(w.step===0&&!w.pms.length)return 'Pick at least one project manager';
  if(w.step===1&&!w.markets.length)return 'Tick at least one brand';
  if(w.step===2&&!w.feats.length)return 'Pick at least one feature';
  if(w.step===3&&!w.feats.some(f=>w.markets.some(m=>w.pick[f+'|'+m])))return 'Tick at least one box';

function adjustProjTimeline(id){const p=proj(id),ts=DB.tasks.filter(t=>t.project===id&&t.status!=='Done').sort((a,b)=>a.start.localeCompare(b.start));

    ${ts.length?`<div class="sec-h">${ic('list-checks')}Open tasks</div><div class="tbl-wrap"><table class="mini-tbl mw-tl"><thead><tr><th>Task</th><th>Start</th><th>Due</th></tr></thead><tbody>

    <p class="text-xs muted mt-3">When a due date moves later, the original date is kept, so the Delivery overview can still tell if it finished late. Everyone affected is told.</p>`,
    foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveProjTimeline('${id}')">${ic('check')}Save timeline</button>`})}
function saveProjTimeline(id){const p=proj(id),ts=DB.tasks.filter(t=>t.project===id&&t.status!=='Done');
  const ph=p.phases.map((x,i)=>[x[0],val('tp-s'+i),val('tp-e'+i)]);
  for(let i=0;i<ph.length;i++){if(!ph[i][1]||!ph[i][2]||ph[i][2]<ph[i][1])return toast(`${ph[i][0]}: the end must be on or after the start`,'circle-alert');if(i&&ph[i][1]<ph[i-1][2])return toast(`${ph[i][0]} can't start before ${ph[i-1][0]} ends`,'circle-alert')}
  for(const t of ts){const s=val('tt-s-'+t.id),d=val('tt-d-'+t.id);if(!s||!d||d<s)return toast(`“${t.title}”: the due date must be on or after the start`,'circle-alert')}
  let moved=0;const people=new Set(leadsOf(p));
  ph.forEach((x,i)=>{if(x[1]!==p.phases[i][1]||x[2]!==p.phases[i][2])moved++});p.phases=ph;p.start=ph[0][1];p.end=ph[ph.length-1][2];
  ts.forEach(t=>{const s=val('tt-s-'+t.id),d=val('tt-d-'+t.id);if(s!==t.start||d!==t.due){moved++;people.add(t.who);if(d>t.due&&!t.origDue)t.origDue=t.due;t.start=s;t.due=d}});
  if(!moved){closeModal();return toast('Nothing changed','circle-alert')}

function adjustCampTimeline(id){const c=camp(id),rs=rollsOfCamp(id).filter(r=>!isLive(r)&&r.stage!=='On hold');

    foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveCampTimeline('${id}')">${ic('check')}Save timeline</button>`})}
function saveCampTimeline(id){const c=camp(id),rs=rollsOfCamp(id).filter(r=>!isLive(r)&&r.stage!=='On hold'),s=val('ct-s'),e=val('ct-e');
  if(!s||!e||e<s)return toast('The campaign must end on or after it starts','circle-alert');

  let k=0;Object.entries(per).forEach(([who,n])=>k+=notify([who],`${S.user.name} moved ${n} go-live date${n>1?'s':''} in ${c.name}. Open the campaign to see the new dates.`,'#project-'+id.toLowerCase()));

function saveSmtp(id){const from=val('sm-f').toLowerCase(),d='@'+DB.smtp.domain;

/* ---------- Import & Export ---------- */
// Data sets in the order they are imported. Each is matched by a natural key, never by internal ID.
const XFER=[
  ['settings','Company & global settings',()=>[{key:'settings',...DB.settings}],x=>x.key],
  ['roles','Access roles & permissions',()=>DB.perms.map(p=>({key:p[1],group:p[0],grants:p[2]})),x=>x.key],
  ['modules','Menu & modules',()=>DB.modules.map(m=>({key:m.id,on:m.on})),x=>x.key],
  ['departments','Departments',()=>DB.departments,x=>x.name],
  ['designations','Designations',()=>DB.designations,x=>x.name],
  ['empTypes','Employment types',()=>DB.empTypes,x=>x.name||x.id],
  ['tags','Task tags & points',()=>DB.tags,x=>x.code],
  ['employees','Employees & user accounts',()=>DB.employees.map(({salary,...e})=>e),x=>x.email],
  ['teams','Groups & reporting lines',()=>DB.teams,x=>x.name],
  ['clients','Clients, brands & PICs',()=>DB.clients.map(c=>({...c,pics:c.pics.map(({pin,tries,locked,...p})=>p),brands:DB.markets.filter(m=>m.client===c.id)})),x=>x.name],
  ['vendors','External partners & guests',()=>DB.vendors.map(v=>({...v,people:DB.guests.filter(g=>g.vendor===v.id)})),x=>x.name],
  ['projects','Projects',()=>DB.projects,x=>x.name],
  ['campaigns','Campaigns, features & brand tasks',()=>DB.campaigns.map(c=>({...c,features:featuresOf(c.id).map(f=>({...f,tasks:rollsOf(f.id)}))})),x=>x.name],
  ['smtp','Email accounts (no passwords)',()=>DB.smtp.accounts,x=>x.from],
  ['telegram','Telegram groups & schedules',()=>[...DB.telegram.chats,...DB.telegram.schedules],x=>x.name],
];
const XFER_RULES=['Never included: passwords, SMTP passwords, 2FA secrets, recovery codes, client PINs and uploaded files. Re-enter them after importing; clients get PIN 0000 and must change it.',
  'Records are matched by a name or code (email for people, brand + region for brands), never by internal ID, so the same data can move between servers.',
  'A full backup is taken automatically before anything changes. Undo restores it.',
  'Data is applied in the order shown, so everything a record depends on already exists when it arrives (e.g. departments before employees).',
  'A bundle from a newer version is refused; update this server first.',
  'Salaries are left out unless HR ticks "Include salaries" on export.'];
function bundle(sets,sal){const data={};sets.forEach(k=>{const s=XFER.find(x=>x[0]===k);data[k]=JSON.parse(JSON.stringify(s[2]()))});
  if(sal&&data.employees)data.employees.forEach(e=>e.salary=emp(e.id)?.salary);
  const body=JSON.stringify(data);let h=0;for(const ch of body)h=(h*31+ch.charCodeAt(0))>>>0;
  return {format:'meridian-bundle',version:DB.system.version,from:DB.system.env,exportedAt:nowStamp(),exportedBy:S.user?.email||'setup',checksum:h.toString(16),sets:Object.fromEntries(sets.map(k=>[k,data[k].length])),data}}
function pgTransfer(){const T=S.xfer||(S.xfer={step:0});
  return `<div class="mw-howto">${ic('info','w-4 h-4 flex-none')}<span>Move set-up data between servers: build everything in <b>development</b>, export a bundle, then import it on <b>staging</b> or <b>production</b>. This server: <b>${DB.system.env}</b> · version ${DB.system.version}.</span></div>
  <div class="grid gap-4 xl:grid-cols-[1fr_1.3fr]">
    <section class="card p-5"><h3 class="card-title mb-1">${ic('package','w-4 h-4')}Export</h3><p class="text-xs muted mb-3">Pick what to include. You get one file (a bundle) to import elsewhere.</p>
      <div class="flex flex-col gap-1.5">${XFER.map(([k,l,g])=>`<label class="check-row"><input type="checkbox" name="xp" value="${k}" checked><span class="flex-1 text-sm">${l}</span><span class="text-xs muted tnum">${g().length}</span></label>`).join('')}</div>
      ${isHR()||S.user.roleKey==='sysadmin'?`<label class="check-row mt-2"><input type="checkbox" id="xp-sal"><span class="text-sm">Include salaries</span></label>`:''}
      <button class="btn btn-primary mt-4" onclick="doExport()">${ic('download')}Create bundle</button></section>
    <section class="card p-5"><h3 class="card-title mb-1">${ic('upload','w-4 h-4')}Import</h3><p class="text-xs muted mb-3">Six steps. Nothing changes until step 5.</p>${importFlow('xfer')}</section></div>
  <section class="card p-5 mt-4"><h3 class="card-title mb-2">${ic('shield-alert','w-4 h-4')}Important when importing</h3><ol class="mw-rules">${XFER_RULES.map(r=>`<li>${r}</li>`).join('')}</ol>
    <div class="sec-h">${ic('list-ordered')}Import order</div><ol class="mw-order">${XFER.map(x=>`<li>${x[1]}</li>`).join('')}</ol></section>`}
function doExport(){const sets=picked('xp');if(!sets.length)return toast('Pick at least one data set','circle-alert');const b=bundle(sets,$('#xp-sal')?.checked);
  csvSaveJSON(b);}
function csvSaveJSON(b){const text=JSON.stringify(b,null,2);openModal({title:'Bundle created',icon:'package',size:'lg',body:`<p class="text-sm muted mb-2">${Object.entries(b.sets).map(([k,n])=>`${XFER.find(x=>x[0]===k)[1]}: ${n}`).join(' · ')}</p><p class="text-xs muted mb-3">Checksum ${b.checksum}. Keep it safe: it contains company data.</p><textarea id="xp-t" class="input mw-tg" rows="12" readonly>${esc(text)}</textarea>`,
  foot:`<button class="btn btn-ghost" onclick="copyText('xp-t')">${ic('copy')}Copy</button><button class="btn btn-primary" onclick="try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#xp-t').value],{type:'application/json'}));a.download='meridian-bundle-${TODAY}.json';a.click();toast('Downloaded','download')}catch(e){copyText('xp-t')}">${ic('download')}Download</button>`})}
const IMP_STEPS=['Choose file','Check','Preview','Backup','Apply','Report'];
function importFlow(key){const T=S[key]||(S[key]={step:0});const st=T.step;
  const head=`<ol class="mw-steps">${IMP_STEPS.map((s,i)=>`<li class="${i<st?'is-done':i===st?'is-now':''}"><span>${i<st?ic('check','w-3 h-3'):i+1}</span>${s}</li>`).join('')}</ol>`;
  let b='';
  if(st===0)b=`<p class="text-sm mb-3">Choose a bundle exported from another server.</p><label class="btn btn-ghost" style="cursor:pointer">${ic('file-json')}Choose bundle (.json)<input type="file" accept="application/json,.json" class="sr-only" onchange="impRead('${key}',this)"></label> <button class="btn btn-ghost" onclick="impSample('${key}')">${ic('flask-conical')}Use a sample from development (demo)</button>`;
  if(st===1){const c=T.check;b=`<div class="flex flex-col gap-2">${c.map(([ok,l])=>`<div class="flex items-center gap-2 text-sm">${chip(ok?'OK':'Problem',ok?'ok':'warn',ok?'check':'triangle-alert')}${l}</div>`).join('')}</div>
    ${c.every(x=>x[0])?`<button class="btn btn-primary mt-4" onclick="impPreview('${key}')">${ic('arrow-right')}Next: preview changes</button>`:`<p class="text-sm mt-3" style="color:var(--warn)">Fix the problems above and choose the file again.</p><button class="btn btn-ghost mt-2" onclick="S['${key}']={step:0};rerender();renderSetupIf()">${ic('arrow-left')}Choose another file</button>`}`}
  if(st===2){const p=T.preview;b=`<p class="text-sm mb-2">What would change. <b>Same</b> rows are skipped.</p><div class="tbl-wrap"><table class="mini-tbl"><thead><tr><th>#</th><th>Data</th><th>New</th><th>Changed</th><th>Same</th></tr></thead><tbody>${p.map((r,i)=>`<tr><td>${i+1}</td><td>${r.label}</td><td class="tnum">${r.add?`<b style="color:var(--ok)">${r.add}</b>`:0}</td><td class="tnum">${r.upd?`<b style="color:var(--warn)">${r.upd}</b>`:0}</td><td class="tnum muted">${r.same}</td></tr>`).join('')}</tbody></table></div>
    <div class="fld mt-3"><span>When a record already exists and is different</span>${sel('imp-pol',[['update','Update it with the imported version'],['skip','Keep this server\'s version']],T.pol||'update',`onchange="S['${key}'].pol=this.value"`)}</div>
    <div class="flex gap-2 mt-4"><button class="btn btn-ghost" onclick="S['${key}']={step:0};rerender();renderSetupIf()">${ic('x')}Cancel</button><button class="btn btn-primary" onclick="impBackup('${key}')">${ic('arrow-right')}Next: back up this server</button></div>`}
  if(st===3)b=`<div class="mw-alert mw-alert--info">${ic('database-backup','w-5 h-5 flex-none')}<div>Backup <b class="mono">${T.backupId}</b> created at ${fmtDT(nowStamp())}. Undo restores it.</div></div><button class="btn btn-primary" onclick="impApply('${key}')">${ic('play')}Apply import</button>`;
  if(st===4||st===5){const r=T.report;b=`<div class="flex flex-col gap-1.5">${r.map(x=>`<div class="flex items-center gap-2 text-sm">${ic('circle-check','w-4 h-4')}<span class="flex-1">${x.label}</span><span class="text-xs muted tnum">${x.add} added · ${x.upd} updated · ${x.skip} skipped</span></div>`).join('')}</div>
    <div class="mw-alert mw-alert--info mt-3">${ic('list-checks','w-5 h-5 flex-none')}<div><b>Next:</b> re-enter SMTP passwords and send test emails, then send invites so people set their passwords. Clients' PICs sign in with PIN 0000.</div></div>
    <div class="flex gap-2 mt-2"><button class="btn btn-ghost" onclick="impUndo('${key}')">${ic('undo-2')}Undo import</button>${key==='xfer'?`<button class="btn btn-ghost" onclick="S.xfer={step:0};rerender()">${ic('rotate-ccw')}Import another</button>`:''}</div>`}
  return head+b}
function impLoad(key,b){const T=S[key];T.bundle=b;const sets=Object.keys(b.data||{});
  const okFmt=b.format==='meridian-bundle',okVer=okFmt&&b.version<=DB.system.version;let h=0;const body=JSON.stringify(b.data||{});for(const ch of body)h=(h*31+ch.charCodeAt(0))>>>0;
  T.check=[[okFmt,'It is a Meridian bundle'],[okVer,`Made by version ${b.version||'?'} (this server: ${DB.system.version})`],[okFmt&&h.toString(16)===b.checksum,'File is complete and unchanged (checksum matches)'],[sets.length>0,`${sets.length} data set${sets.length===1?'':'s'} from ${b.from||'?'}, exported ${b.exportedAt||'?'} by ${b.exportedBy||'?'}`],[!sets.some(k=>!XFER.some(x=>x[0]===k)),'Every data set is known']];
  T.step=1;rerender();renderSetupIf()}
function impRead(key,input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{impLoad(key,JSON.parse(r.result))}catch(e){toast('That file is not a valid bundle','circle-alert')}};r.readAsText(f)}
function impSample(key){const b=bundle(XFER.map(x=>x[0]));
  b.data.departments.push({id:'DP99',name:'Creative Studio',color:'#7C5CC4',head:null,kind:'Delivery'});b.data.clients.push({id:'C9',name:'Golden Lotus Media',owner:'E003',note:'From development',status:'Active',pics:[],brands:[]});
  b.data.settings[0].session=60;b.data.tags[0]={...b.data.tags[0],name:b.data.tags[0].name+' (renamed)'};b.from='Development (sample)';
  let h=0;for(const ch of JSON.stringify(b.data))h=(h*31+ch.charCodeAt(0))>>>0;b.checksum=h.toString(16);impLoad(key,b)}
function impPreview(key){const T=S[key],d=T.bundle.data;
  T.preview=XFER.filter(x=>d[x[0]]).map(([k,label,get,keyOf])=>{const cur=new Map(get().map(x=>[keyOf(x),JSON.stringify(x)]));let add=0,upd=0,same=0;
    d[k].forEach(x=>{const c=cur.get(keyOf(x));if(c===undefined)add++;else if(c===JSON.stringify(x))same++;else upd++});return {k,label,add,upd,same}});
  T.step=2;rerender();renderSetupIf()}
function impBackup(key){const T=S[key];T.pol=$('#imp-pol')?.value||T.pol||'update';T.backup=JSON.stringify({departments:DB.departments,clients:DB.clients,settings:DB.settings,tags:DB.tags});T.backupId='B-'+TODAY.replaceAll('-','')+'-'+NOW_T.replace(':','');T.step=3;rerender();renderSetupIf()}
function impApply(key){const T=S[key],d=T.bundle.data,upd=T.pol!=='skip';
  T.report=T.preview.map(p=>{const res={label:p.label,add:p.add,upd:upd?p.upd:0,skip:p.same+(upd?0:p.upd)};
    if(p.k==='departments')d.departments.forEach(x=>{if(!DB.departments.some(y=>y.name===x.name))DB.departments.push(x)});
    if(p.k==='clients')d.clients.forEach(x=>{if(!DB.clients.some(y=>y.name===x.name))DB.clients.push({...x,pics:x.pics.map(q=>({...q,pin:'0000',mustChange:true,tries:0,locked:false}))})});
    if(p.k==='settings'&&upd)Object.assign(DB.settings,(({key,...s})=>s)(d.settings[0]));
    if(p.k==='tags'&&upd)d.tags.forEach(x=>{const y=DB.tags.find(t=>t.code===x.code);if(y)Object.assign(y,x)});
    return res});
  T.step=5;rerender();renderSetupIf();toast('Import finished','circle-check')}
function impUndo(key){const T=S[key],b=JSON.parse(T.backup);DB.departments=b.departments;DB.clients=b.clients;DB.settings=b.settings;DB.tags=b.tags;S[key]={step:0};rerender();renderSetupIf();toast(`Restored backup ${T.backupId}`,'undo-2')}

function renderSetupIf(){if(location.hash==='#setup')renderSetup()}
function renderSetup(){const W=S.setup||(S.setup={step:0,admin:{name:'',email:''},done:{}}),st=W.step,s=DB.settings,dot=i=>W.done[i]?'is-done':i===st?'is-now':'';
  const days=[['1','Mon'],['2','Tue'],['3','Wed'],['4','Thu'],['5','Fri'],['6','Sat'],['7','Sun']];
  const step=[

/* =================== ROUND 12: CREATED / UPDATED STAMPS · SORT & FILTER =================== */
// Every project, campaign, feature, brand task and task carries meta = {createdAt, createdBy, updatedAt, updatedBy}.
// Stamps are set automatically: before each screen is drawn, any item whose data changed since the last
// screen gets "updated now by whoever is signed in"; new items get "created". The real system does this
// in the API layer (created_at/updated_at + created_by/updated_by on every row).
const STAMP_SETS=[['Project',()=>DB.projects],['Campaign',()=>DB.campaigns],['Feature',()=>DB.features],['Brand task',()=>DB.rollouts],['Task',()=>DB.tasks]];
const hashN=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const seedT=(id,lo=9,hi=18)=>{const h=hashN(id);return String(lo+h%(hi-lo)).padStart(2,'0')+':'+String((h>>5)%60).padStart(2,'0')};
const latestS=(...a)=>a.filter(Boolean).sort().at(-1);
const capNow=s=>s>nowStamp()?TODAY+' 0'+(8+hashN(s)%2)+':'+String(hashN(s+'m')%60).padStart(2,'0'):s;
const stampLabel=(type,x)=>type==='Brand task'?`${x.title} · ${mLabel(x.market)}`:x.name||x.title;
function lastAudit(type,ref){return DB.audit.filter(a=>a.type===type&&a.ref===ref).sort((a,b)=>b.at.localeCompare(a.at))[0]}
function seedMeta(){
  const set=(x,cAt,cBy,uAt,uBy)=>{cAt=capNow(cAt);uAt=capNow(latestS(cAt,uAt));x.meta={createdAt:cAt,createdBy:cBy,updatedAt:uAt,updatedBy:uAt===cAt?cBy:(uBy||cBy)}};
  DB.projects.forEach(p=>{const a=DB.activity.filter(x=>x.p===p.id).map(x=>({at:x.d+' '+x.t,who:actorOf(x.who)})).sort((a,b)=>b.at.localeCompare(a.at))[0],au=lastAudit('Project',p.id);
    const u=[a,au&&{at:au.at,who:au.actor}].filter(Boolean).sort((a,b)=>b.at.localeCompare(a.at))[0];
    set(p,addD(p.start,-5)+' '+seedT(p.id),actorOf(p.pm),u?.at,u?.who)});
  DB.campaigns.forEach(c=>{const by=actorOf(c.createdBy||c.pm);set(c,addD(c.start,-7)+' '+seedT(c.id),by,addD(c.start,-2)+' '+seedT(c.id+'u'),actorOf(c.pm))});
  DB.features.forEach((f,i)=>{const c=camp(f.campaign);set(f,addD(c.start,-6+Math.min(i,5))+' '+seedT(f.id),actorOf(c.pm))});
  DB.rollouts.forEach(r=>{const f=feat(r.feature),c=camp(f.campaign),au=lastAudit('Brand task',r.id),lg=(r.log||[]).map(x=>x[0]).sort().at(-1);
    const auto=au&&au.actor.kind==='System';let uAt=lg,uBy=actorOf(r.who[0]);if(au&&(!lg||au.at>=lg)){uAt=au.at;uBy=au.actor}else if(auto&&au.at===lg)uBy=au.actor;
    set(r,(r.copiedFrom?addD(f.meta.createdAt.slice(0,10),1):f.meta.createdAt.slice(0,10))+' '+seedT(r.id),actorOf(c.pm),uAt,uBy)});
  DB.tasks.forEach(t=>{const p=proj(t.project),au=lastAudit('Task',t.id),ci=(t.ci||[]).at(-1);
    const cBy=actorOf(t.requester||p?.pm||t.who),cAt=addD(t.start,t.requester?0:-1)+' '+seedT(t.id,9,12);
    let uAt=ci?ci[0]+' '+seedT(t.id+ci[0],12,19):null,uBy=actorOf(t.who);if(au&&(!uAt||au.at>uAt)){uAt=au.at;uBy=au.actor}
    set(t,cAt,cBy,uAt,uBy)})}
S.snap={};
const snapOf=x=>{const {meta,...r}=x;return JSON.stringify(r)};
function stampAll(){const now=nowStamp();let who=null;
  STAMP_SETS.forEach(([type,get])=>get().forEach(x=>{const k=type+':'+x.id,s=snapOf(x);
    if(!x.meta){who=who||actor();x.meta={createdAt:now,createdBy:who,updatedAt:now,updatedBy:who};audit(type,x.id,stampLabel(type,x),'Created')}
    else if(S.snap[k]!==undefined&&S.snap[k]!==s){who=who||actor();x.meta.updatedAt=now;x.meta.updatedBy=who}
    S.snap[k]=s}))}
seedMeta();stampAll();

function ago(s){if(!s)return '—';const m=Math.round((new Date(nowStamp().replace(' ','T'))-new Date(s.replace(' ','T')))/60000);
  if(m<1)return 'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+' h ago';const d=Math.round(h/24);if(d===1)return 'yesterday';if(d<7)return d+' days ago';return fmtDT(s,true)+(s.slice(0,4)!==TODAY.slice(0,4)?' '+s.slice(0,4):'')}

function allUsernames(){return [...DB.employees.map(e=>[e.account?.username,'e:'+e.id]),...DB.guests.map(g=>[g.username,'g:'+g.id]),...ACCOUNTS.filter(a=>!a.eid&&!a.gid).map(a=>[a.username,'a:'+a.email]),...allPics().map(p=>[p.username,'p:'+p.id])]}
const userTaken=(u,self)=>allUsernames().some(([x,k])=>x===u&&k!==self);
function uniqU(base,self){let u=base,i=1;while(userTaken(u,self))u=base+(++i);return u}

      ${fld('Employment start date',inp('ee-join',e.joined,'date','',L),'',true)}${fld('Probation end',inp('ee-prob',e.probEnd||'','date','',L))}
      ${fld('Employment end date',inp('ee-end',e.endDate||'','date','',L))}${fld('End reason',sel('ee-endr',[['','—'],...OPT.endReason],e.endReason||'',L))}
      ${fld('Job description',txt('ee-jd',e.jobDesc||'','Main duties and responsibilities',3),'sm:col-span-2')}
    </div>${lead?`<p class="text-xs muted mt-3">${ic('info','w-3.5 h-3.5 inline')} As team lead you can edit work details and contact info. Designation, type, dates and salary go through HR.</p>`:''}</div>
    ${lead?'':`<div class="mw-eetab" data-t="personal" hidden>${grid(secF('personal'))}</div>`}
    <div class="mw-eetab" data-t="contact" hidden><div class="text-sm font-semibold mb-2">Contact</div>${grid(secF('contact'))}<div class="text-sm font-semibold mt-5 mb-2">${lead?'Emergency contact':'Family & emergency contact'}</div>${grid(lead?secF('family').filter(f=>f[0].startsWith('ec.')):secF('family'))}</div>
    ${lead?'':`<div class="mw-eetab" data-t="bank" hidden>${grid(secF('bank'))}<p class="text-xs muted mt-3">Used for payroll. Account numbers and statutory numbers are shown only to HR and the employee.</p></div>
    <div class="mw-eetab" data-t="edu" hidden>${grid(secF('edu'))}<div class="text-sm font-semibold mt-5 mb-2">Work experience</div>${expEditor(e.exp||[],true)}</div>
    <div class="mw-eetab" data-t="docs" hidden>${id?docList(e,{canAdd:true,canRemove:()=>true}):'<p class="text-sm muted">Save the employee first, then add documents.</p>'}</div>`}`,
    foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEmployee('${id||''}')">${ic('check')}Save</button>`});
}
function saveEmployee(id){
  const name=$('#ef-name')?val('ef-name'):emp(id)?.name;
  if(!name||!val('ee-pos')){toast('Full legal name and position are required','circle-alert');$('#ef-name')&&!name&&eeTab('personal');return}
  if(!id&&!val('ee-mail')){toast('Work email is required','circle-alert');return}
  if(val('ee-end')&&val('ee-end')<val('ee-join')){toast('Employment end must be after the start','circle-alert');return}
  const isNew=!id,e=id?emp(id):{id:'E'+String(30+DB.employees.length),events:[],infoUpdated:TODAY,idType:'NRIC',exp:[],docs:[]},before=JSON.parse(JSON.stringify(e));
  const o={no:val('ee-no'),email:val('ee-mail'),pos:val('ee-pos'),desig:val('ee-des'),dept:val('ee-dept'),reports:val('ee-rep')||null,type:val('ee-type'),status:val('ee-st'),joined:val('ee-join'),location:val('ee-loc'),probEnd:val('ee-prob')||null,endDate:val('ee-end')||null,endReason:val('ee-endr')||'',jobDesc:val('ee-jd')};
  if($('#ee-sal'))o.salary=+val('ee-sal');Object.assign(e,o);
  EMP_FIELDS.forEach(([k,,ty])=>{const el=$('#ef-'+kid(k));if(el&&!el.disabled)pset(e,k,ty==='number'&&el.value!==''?+el.value:el.value.trim())});
  if($('#exp-box'))e.exp=expClean();if(!e.display)e.display=e.name;
  if(S.tmpPhoto)e.photo=S.tmpPhoto;
  if(isNew){e.account={on:true,role:'staff',last:null,invited:false,username:uniqU(slugU(e.name),'e:'+e.id)};DB.employees.push(e);takeEmpNo(e.no);logEvent(e.id,'Joined',`${e.pos} · ${des(e.desig).name}`,'acc',e.joined);audit('Employee',e.id,e.name,'Employee added',{detail:`${e.no} · ${e.pos} · username ${e.account.username}`})}
  else{const lbl={no:'Employee no.',email:'Work email',pos:'Position',desig:'Designation',dept:'Department',reports:'Reports to',type:'Employment type',status:'Status',joined:'Employment start',location:'Work location',probEnd:'Probation end',endDate:'Employment end',endReason:'End reason',jobDesc:'Job description',salary:'Basic salary',exp:'Work experience',photo:'Official photo'};
    const ch=[...Object.keys(lbl).filter(k=>JSON.stringify(before[k]??'')!==JSON.stringify(e[k]??'')).map(k=>lbl[k]),...EMP_FIELDS.filter(([k])=>String(pget(before,k)??'')!==String(pget(e,k)??'')).map(f=>f[1])];
    if(ch.length){e.infoUpdated=TODAY;logEvent(id,'Record edited',`by ${S.user.name} · ${ch.join(', ')}`,'info');audit('Employee',id,e.name,'Employee record updated',{detail:ch.join(', ')})}}
  closeModal();rerender();toast(id?'Employee updated':'Employee added · username '+e.account.username,'user-check');
}

(function boot(){
  document.documentElement.lang=LANG==='zh'?'zh-CN':'en';
  let sb='open';try{sb=localStorage.getItem('mw_sidebar')==='rail'?'rail':'open'}catch(e){}
  document.documentElement.dataset.sb=sb;
  route();icons();
})();

</script>
