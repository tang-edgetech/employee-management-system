function exportKpi(){
  const W=DB.settings.weights,list=kpiPeople().map(e=>({e,k:kpiOf(e.id)}));
  const head=['employee_no','name','department','designation','source','points','target',...KPI_PARTS.map(p=>p[0]),'score','grade'];
  const rows=list.map(({e,k})=>[e.no,e.name,e.dept,des(e.desig).name,k.src,k.pts,k.target,...KPI_PARTS.map(p=>k.parts[p[0]]==null?'':k.parts[p[0]].toFixed(1)),k.score.toFixed(1),k.grade]);
  const wrow=['weights','','','','','','',...KPI_PARTS.map(p=>W[p[0]]),'',''];
  const csv=[head,wrow,...rows].map(r=>r.map(v=>/[,"]/.test(v)?`"${String(v).replace(/"/g,'""')}"`:v).join(',')).join('\n');
  S.kpiTsv=[head,wrow,...rows].map(r=>r.join('\t')).join('\n');
  const url='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  openModal({title:'Export KPI',icon:'sheet',size:'lg',body:`<p class="text-sm mb-3">${list.length} employees · ${QTR.label}. Row 2 holds the weights so the sheet can recalculate. Google Sheets formula for score (row 3):</p>
    <div class="code mb-3">=SUMPRODUCT(H3:N3,$H$2:$N$2)/SUMPRODUCT(--(H3:N3&lt;&gt;""),$H$2:$N$2)</div>
    <div class="code">${esc(csv.split('\n').slice(0,6).join('\n'))}${list.length>4?'\n…':''}</div>
    <p class="text-xs muted mt-2">To calculate outside the system, switch KPI to “External sheet”, then import final scores back as <span class="mono">employee_no,final_score</span>.</p>`,
    foot:`<button class="btn btn-ghost" onclick="importScores()">${ic('upload')}Import final scores</button><button class="btn btn-ghost" onclick="try{navigator.clipboard.writeText(S.kpiTsv).then(()=>toast('Copied. Paste into Google Sheets','copy')).catch(()=>toast('Clipboard blocked here','circle-alert'))}catch(e){toast('Clipboard blocked here','circle-alert')}">${ic('copy')}Copy for Google Sheets</button><a class="btn btn-primary" href="${url}" download="kpi-${QTR.label.replace(' ','-').toLowerCase()}.csv">${ic('download')}Download .csv (Excel)</a>`});
}
function importScores(){openModal({title:'Import final scores',icon:'upload',body:`${fld('Paste CSV (employee_no,final_score)',`<textarea id="fs-in" class="input mono" rows="6">employee_no,final_score\nHJ-0026,92\nHJ-0038,58</textarea>`)}`,
  foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="let n=0;parseCSV($('#fs-in').value).slice(1).forEach(([no,s])=>{const e=DB.employees.find(x=>x.no===no.trim());if(e){DB.extScore[e.id]=+s;n++}});DB.settings.kpiMode='external';closeModal();rerender();toast(n+' final scores imported','upload')">${ic('check')}Import</button>`})}

/* =================== INTEGRATIONS =================== */
function pgIntegrations(){
  return `<section class="card p-5 mb-4"><h3 class="card-title mb-2">${ic('route','w-4 h-4')}Migration path off third-party tools</h3>
    <div class="phases" style="grid-template-columns:repeat(4,minmax(0,1fr))">${[['1 · Import only','Weekly CSV from ClickUp / monday into KPI. Teams keep working there.'],['2 · Dual run','New projects start in Hajimi; old ones stay external until done.'],['3 · Cut-over','All new work in Hajimi; external set to read-only.'],['4 · Retire','Final export archived; connector switched off.']].map(([t,d],i)=>`<div class="ph ${i===0?'now':''}"><div class="font-bold text-sm">${t}</div><div class="n mt-1" style="line-height:1.4">${d}</div></div>`).join('')}</div></section>
  <div class="grid gap-4 md:grid-cols-2">${DB.integrations.map(it=>`<section class="card p-5 flex flex-col gap-4"><div class="flex items-center gap-3"><span class="chip acc" style="padding:8px">${ic(it.icon,'!w-5 !h-5')}</span><div class="flex-1"><h3 class="font-bold">${it.name}</h3><div class="text-xs muted">Last ${it.id==='gsheet'?'export':'import'}: ${it.last==='—'?'never':fmt(it.last)} · ${it.rows} rows</div></div>${chip(it.mode,it.mode==='Off'?'':'ok')}</div>
    <div class="grid sm:grid-cols-2 gap-3">${fld('Mode',sel('ig-m-'+it.id,['Off','Import (CSV)','Scheduled sync (API)','Export only'],it.mode,`onchange="DB.integrations.find(x=>x.id==='${it.id}').mode=this.value;rerender()"`))}${fld('Use for KPI until',inp('ig-u-'+it.id,it.until,'date','',`onchange="DB.integrations.find(x=>x.id==='${it.id}').until=this.value"`))}${fld('Teams using it',inp('ig-s-'+it.id,it.scope))}${it.mode.includes('API')?fld('API token',inp('ig-t-'+it.id,'','password','pk_••••••••')):'<div></div>'}</div>
    <div class="flex gap-2 flex-wrap">${it.id==='gsheet'?`<button class="btn btn-ghost h-9" onclick="exportKpi()">${ic('sheet')}Export KPI now</button>`:`<button class="btn btn-ghost h-9" onclick="importExternal('${it.id==='monday'?'monday.com':it.name}')">${ic('cloud-download')}Import CSV</button><button class="btn btn-ghost h-9" onclick="memberMap('${it.name}')">${ic('link')}Member mapping</button>`}</div></section>`).join('')}</div>`;
}
function memberMap(n){openModal({title:`${n} member mapping`,icon:'link',body:`<p class="text-sm muted mb-3">External users are matched to employees by work email. Fix mismatches here once; future imports reuse the mapping.</p><div class="tbl-wrap"><table class="mini-tbl"><thead><tr><th>External user</th><th>Employee</th></tr></thead><tbody>${DB.employees.filter(e=>['WordPress','Mobile'].includes(e.dept)).map(e=>`<tr><td class="mono">${e.email}</td><td>${chip(e.name,'ok','check')}</td></tr>`).join('')}<tr class="row-err"><td class="mono">someone@agency.com</td><td>${sel('mm-x',[['','— Ignore (freelancer) —'],...DB.employees.map(e=>[e.id,e.name])],'','style="height:30px;font-size:12px"')}</td></tr></tbody></table></div>`,foot:`<button class="btn btn-primary" onclick="closeModal();toast('Mapping saved','link')">${ic('check')}Save</button>`})}
