<!doctype html>
<html lang="en" data-layout="meridian" data-sb="open">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meridian Workforce</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Meridian Workforce mockup: one fixed design (option 6). Tokens below; structure from the original mockup. */
:root{
  /* Meridian Workforce, design option 6: Atlas layout + Straits colours (owner decision, 2026-11-05). */
  --font-head:'Plus Jakarta Sans',system-ui,sans-serif; --font-body:'Plus Jakarta Sans',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --bg:#EFF4F3; --surface:#fff; --surface-2:#F4F8F7; --ink:#12302F; --muted:#4F6E6C; --line:#D6E2E0; --line-strong:#9DB7B3;
  --accent:#0B5D5E; --accent-ink:#fff; --accent-soft:#E1EFEC; --hi:#D9583B;
  --cta:#B9452B; --cta-ink:#fff; --deep:#0B3B3B;
  --ok:#0F7A5C; --warn:#A8620A; --bad:#C2372D; --info:#1F6FB2;
  --sb-bg:#fff; --sb-ink:#12302F; --sb-muted:#4F6E6C; --sb-line:#E1EBE9; --sb-active-bg:#E1EFEC; --sb-active-ink:#0B5D5E; --sb-mark:#0B5D5E;
  --radius:16px; --bw:1px; --shadow:0 1px 2px rgba(11,59,59,.06),0 10px 28px -20px rgba(11,59,59,.28); --btn-shadow:none;
  --tip-bg:#0B3B3B; --tip-ink:#fff; --sb-w:264px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;-webkit-font-smoothing:antialiased}
h1,h2,h3,.head{font-family:var(--font-head);text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--font-mono)}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100%}
.sidebar{width:var(--sb-w);flex:none;background:var(--sb-bg);color:var(--sb-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;z-index:40;transition:transform .25s}
.sb-head{display:flex;align-items:center;gap:12px;padding:20px 18px 16px;border-bottom:1px solid var(--sb-line)}
.sb-logo{width:38px;height:38px;border-radius:calc(var(--radius)*.7);display:grid;place-items:center;background:var(--sb-mark);color:#1b1f5e;flex:none}
.sb-logo svg{width:20px;height:20px}
.sb-title{font-family:var(--font-head);font-size:17px;font-weight:800;line-height:1.1}
.sb-sub{font-size:11px;color:var(--sb-muted);letter-spacing:.08em;text-transform:uppercase}
.sb-body{flex:1;overflow-y:auto;padding:10px 12px 16px}
.sb-group{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sb-muted);padding:16px 10px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:calc(var(--radius)*.6);color:var(--sb-ink);opacity:.82;font-weight:500;position:relative;text-align:left}
.nav-item svg{width:18px;height:18px;flex:none}
.nav-item:hover{opacity:1;background:var(--sb-line)}
.nav-item.active{opacity:1;background:var(--sb-active-bg);color:var(--sb-active-ink);font-weight:600}
.sb-foot{border-top:1px solid var(--sb-line);padding:14px;display:flex;align-items:center;gap:10px}
.sb-foot .icon-btn{color:var(--sb-muted)}
.sb-foot .icon-btn:hover{background:var(--sb-line);color:var(--sb-ink)}
/* plum: icon rail */
html[data-layout="meridian"][data-sb="rail"] .sb-text,html[data-layout="meridian"][data-sb="rail"] .nav-label,html[data-layout="meridian"][data-sb="rail"] .sb-group span{display:none}
html[data-layout="meridian"][data-sb="rail"] .sb-group{padding:10px 0 4px;text-align:center}
html[data-layout="meridian"][data-sb="rail"] .sb-group::after{content:"";display:block;margin:0 auto;width:20px;border-top:1px solid var(--sb-line)}
html[data-layout="meridian"][data-sb="rail"] .sb-head{justify-content:center;padding:18px 0}
html[data-layout="meridian"][data-sb="rail"] .nav-item{justify-content:center;padding:11px 0;border-radius:14px}
html[data-layout="meridian"][data-sb="rail"] .sb-foot{flex-direction:column;padding:12px 0}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
@media(min-width:1024px){.topbar{padding-left:28px;padding-right:28px}}
.crumb{font-size:12px;color:var(--muted)}
.page-title{font-size:22px;font-weight:800;line-height:1.15}
.view{padding:8px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));width:100%}
@media(min-width:1024px){.view{padding:12px 28px 48px}}

/* ---------- components ---------- */
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-title{font-family:var(--font-head);font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:calc(var(--radius)*.6);font-weight:600;font-size:13px;border:var(--bw) solid transparent;white-space:nowrap;transition:transform .12s,background .15s;box-shadow:var(--btn-shadow)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--accent-soft)}
.btn-danger{background:var(--bad);color:#fff}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:calc(var(--radius)*.5);color:var(--muted);border:1px solid transparent;flex:none;transition:background .15s,color .15s}
.icon-btn svg{width:16px;height:16px}
.icon-btn:hover{background:var(--accent-soft);color:var(--ink)}
.icon-btn.ok:hover{color:var(--ok)} .icon-btn.bad:hover{color:var(--bad)} .icon-btn.acc{color:var(--accent)}
.icon-btn[disabled]{opacity:.3;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;--t:var(--muted);color:var(--t);background:color-mix(in srgb,var(--t) 13%,transparent)}
.chip svg{width:12px;height:12px}
.chip.ok{--t:var(--ok)}.chip.warn{--t:var(--warn)}.chip.bad{--t:var(--bad)}.chip.info{--t:var(--info)}.chip.acc{--t:var(--accent)}.chip.hi{--t:var(--hi)}
html[data-layout="meridian"] .chip.acc{--t:var(--accent)}
.input{width:100%;height:40px;padding:0 12px;border-radius:calc(var(--radius)*.55);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);font-size:14px}
textarea.input{height:auto;padding:10px 12px;min-height:84px;resize:vertical}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--muted)}
.fld>span b{color:var(--bad)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:12px 14px;border-bottom:var(--bw) solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.actions{display:flex;gap:2px;justify-content:flex-end}
.av{display:inline-grid;place-items:center;border-radius:999px;font-weight:700;flex:none;font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);border:var(--bw) solid var(--line);background:var(--surface);display:inline-flex;gap:6px;align-items:center}
.tab .n{font-size:11px;padding:0 6px;border-radius:999px;background:var(--surface-2)}
.tab.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tab.on .n{background:color-mix(in srgb,var(--surface) 20%,transparent)}
.kpi .num{font-family:var(--font-head);font-size:34px;font-weight:800;line-height:1}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line-strong);transition:.2s}
.switch span::after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:disabled+span{opacity:.5}

/* overlays */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(10,12,28,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:560px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--surface);border-radius:var(--radius);border:var(--bw) solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:pop .18s ease-out}
.modal.lg{max-width:820px}.modal.sm{max-width:420px}
.modal-h{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-b{padding:20px;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--radius) var(--radius)}
.drawer-wrap{position:fixed;inset:0;z-index:70;background:rgba(10,12,28,.35)}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:var(--bw) solid var(--line);display:flex;flex-direction:column;animation:slide .22s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--tip-bg);color:var(--tip-ink);font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:6px;white-space:nowrap;box-shadow:0 6px 16px -6px rgba(0,0,0,.4)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:110;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:pop .2s}
.toast svg{width:16px;height:16px}
.dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:13.5px}
.dl dt{color:var(--muted)}
.dl dd{min-width:0;overflow-wrap:anywhere}
.sec-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 10px;display:flex;gap:8px;align-items:center}
.sec-h svg{width:14px;height:14px}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl{position:relative;padding-bottom:14px}
.tl::before{content:"";position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--tl,var(--accent))}

/* org chart */
.org-scroll{overflow:auto;padding:24px;max-height:calc(100dvh - 220px)}
.tree{display:inline-block;min-width:100%;transform-origin:top center;padding:8px}
.tree ul{padding-top:26px;position:relative;display:flex;justify-content:center}
.tree>ul{padding-top:0}
.tree li{list-style:none;position:relative;padding:26px 7px 0;display:flex;flex-direction:column;align-items:center}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;border-top:2px solid var(--line-strong);width:50%;height:26px}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--line-strong)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree>ul>li{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:2px solid var(--line-strong);border-radius:0 8px 0 0}
.tree li:first-child::after{border-radius:8px 0 0 0}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;border-left:2px solid var(--line-strong);height:26px}
.org-node{width:176px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:calc(var(--radius)*.8);padding:12px 10px 10px;text-align:center;position:relative;box-shadow:var(--shadow);overflow:hidden}
.org-node .strip{position:absolute;left:0;right:0;top:0;height:4px}
.org-node .nm{font-weight:700;font-size:13px;line-height:1.2;margin-top:6px}
.org-node .ps{font-size:11.5px;color:var(--muted);margin-top:2px}
.org-node .crown{position:absolute;top:8px;right:8px;color:var(--hi)}
.org-node .crown svg{width:14px;height:14px}
/* Reporting lines: compact tree (managers branch out, people with no reports stack under them) */
.org-scroll{overflow:auto;padding:20px;max-height:calc(100dvh - 220px)}
.tree.compact{transform:none;display:block;width:max-content;min-width:100%;margin:0 auto}
.tree.compact ul{padding-top:18px}
.tree.compact>ul{padding-top:0}
.tree.compact li{padding:18px 4px 0}
.tree.compact li::before,.tree.compact li::after{height:18px}
.tree.compact ul ul::before{height:18px}
.org-node.sm{width:124px;padding:9px 6px 7px}
.org-node.sm .nm{font-size:12px;margin-top:4px}
.org-node.sm .ps{font-size:10.5px;line-height:1.2}
.org-node.sm .lv{font-size:10px;color:var(--accent);font-weight:600;margin-top:2px}
.org-node.sm .crown{top:6px;right:6px}
.org-node .st,.org-leaf .st{color:var(--warn,#B7791F)}
.org-team{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 35%,transparent);border-radius:999px;padding:1px 8px;margin-bottom:5px;white-space:nowrap;position:relative;z-index:1}
.mw-viewbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.mw-viewbar .input{height:36px;font-size:13px}
.mw-viewbar__search{position:relative;display:flex;align-items:center;flex:1 1 200px;max-width:280px}
.mw-viewbar__search svg{position:absolute;left:10px;color:var(--muted);pointer-events:none}
.mw-viewbar__search .input{padding-left:32px;width:100%}
.mw-viewbar__sel{width:auto;padding-right:28px}
.mw-viewbar__sel.is-on{border-color:var(--accent);color:var(--accent);font-weight:600}
.mw-viewbar__count{font-size:12px;color:var(--muted)}
.mw-viewbar__spacer{flex:1}
.mw-viewbar__sort{display:flex;align-items:center;gap:4px;color:var(--muted)}
.mw-seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--surface)}
.mw-seg button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.mw-seg button.is-on{background:var(--accent);color:#fff}
@media(max-width:640px){.mw-seg button span{display:none}}
.mw-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.mw-tile{display:flex;flex-direction:column;gap:8px;text-align:left;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);transition:transform .12s}
.mw-tile:hover{transform:translateY(-1px);border-color:var(--accent)}
.mw-tile__title{font-weight:700;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.mw-facts{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:12.5px}
.mw-facts dt{font-size:11px;color:var(--muted)}
.mw-facts dd{font-weight:600}
.mw-bad{color:var(--bad)}
.mw-date{display:inline-flex;align-items:baseline;gap:3px;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:2px 7px}
.mw-date b{font-size:15px}
.mw-levels{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;margin-top:16px}
.mw-levels__cell{text-align:center;border-radius:8px;padding:8px 4px}
.mw-levels__name{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw-add-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:180px;border-style:dashed;color:var(--accent);text-align:center;box-shadow:none}
.mw-add-card:hover{background:var(--accent-soft)}
.mw-add-card b{color:var(--ink)}
.mw-repeater{display:grid;gap:8px}
.mw-repeater__row{display:flex;align-items:center;gap:8px}
.mw-repeater__row .input{height:36px}
.mw-repeater__n{width:28px;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--muted)}
.mw-drag-row{cursor:grab}
.mw-drag-row.is-dragging{opacity:.4}
.mw-drag-row.is-moved td{background:color-mix(in srgb,var(--hi) 8%,transparent)}
.mw-drag-row.drop-before td{box-shadow:inset 0 2px 0 var(--accent)}
.mw-drag-row.drop-after td{box-shadow:inset 0 -2px 0 var(--accent)}
.mw-grip{color:var(--muted);cursor:grab}
.mw-unsaved{position:sticky;top:8px;z-index:5;align-items:center}
.mw-menu{position:relative}
.mw-menu>summary{list-style:none;cursor:pointer}.mw-menu>summary::-webkit-details-marker{display:none}
.mw-menu__list{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px}
.mw-menu__list button{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px}
.mw-menu__list button:hover{background:var(--surface-2)}
.mw-menu__list button span{font-size:11.5px;color:var(--muted)}
.org-stack{min-width:124px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 6px;box-shadow:var(--shadow)}
.org-leaf{display:flex;align-items:center;gap:5px;font-size:11px;line-height:22px;white-space:nowrap}
.org-leaf+.org-leaf{border-top:1px dashed var(--line)}
.org-leaf .dot{width:3px;height:14px;border-radius:2px;flex:none}
.org-leaf .nm{font-weight:600}
.org-leaf .lv{color:var(--muted);font-size:10px;margin-left:auto;padding-left:6px}
.org-leaf .st{font-size:9.5px}
.org-leaf .crown{color:var(--hi);display:inline-flex}.org-leaf .crown svg{width:11px;height:11px}

/* login */
.login{height:100dvh;min-height:100dvh;max-height:100dvh;overflow:hidden;display:grid;grid-template-columns:1fr}
@media(min-width:960px){.login{grid-template-columns:1.1fr 1fr}}
.login-art{background:var(--sb-bg);color:var(--sb-ink);padding:40px;display:none;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
@media(min-width:960px){.login-art{display:flex}}
.otp{width:46px;height:54px;text-align:center;font-size:22px;font-weight:700;padding:0}

/* sidebar: labelled by default, icon rail when collapsed (desktop) */
html[data-sb="rail"]{--sb-w:84px}
.sb-tog-wrap{padding:6px 12px;border-top:1px solid var(--sb-line)}

/* tooltip */
const tipEl = document.getElementById('tip');
document.addEventListener('mouseover',e=>{
  const t=e.target.closest('[data-tip]');
  if(!t){tipEl.hidden=true;return}
  if(t.closest('.sidebar')&&document.documentElement.dataset.sb!=='rail'&&innerWidth>=1024){tipEl.hidden=true;return}
  tipEl.textContent=t.dataset.tip;tipEl.hidden=false;
  const r=t.getBoundingClientRect(),tw=tipEl.offsetWidth,th=tipEl.offsetHeight;
  let x,y;
  if(t.closest('.sidebar') && document.documentElement.dataset.sb==='rail' && innerWidth>=1024){x=r.right+10;y=r.top+r.height/2-th/2}
  else{x=r.left+r.width/2-tw/2;y=r.top-th-8;if(y<8)y=r.bottom+8}
  tipEl.style.left=Math.max(8,Math.min(x,innerWidth-tw-8))+'px';tipEl.style.top=y+'px';
});
document.addEventListener('scroll',()=>tipEl.hidden=true,true);
document.addEventListener('click',()=>tipEl.hidden=true);

function filterPicker(n){

function readPhoto(inp){
  const f=inp.files[0];if(!f)return;if(f.size>3e6){toast('Image must be under 3 MB','circle-alert');return}
  const r=new FileReader();r.onload=()=>{
    const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),s=240,m=Math.min(img.width,img.height);c.width=c.height=s;

    img.src=r.result};r.readAsDataURL(f);
}

  const h=location.hash.slice(1);

  if(h.startsWith('apply-')){renderApply(h.slice(6).toUpperCase());return}

function pgDesignations(){
  const saved=[...DB.designations].sort((a,b)=>a.level-b.level);
  // Reordering works on a draft; nothing changes until the new order is confirmed.
  const ids=S.desDraft||saved.map(d=>d.id),list=ids.map(des),dirty=!!S.desDraft&&ids.some((id,i)=>id!==saved[i].id);
  const lvl=i=>i+saved[0].level;
  const tc={Entry:'#9aa3b5','Individual Contributor':'var(--accent)',Management:'var(--hi)',Executive:'#7c5cff'};
  return `${dirty?`<div class="mw-alert mw-alert--info mw-unsaved">${ic('arrow-up-down')}<div class="flex-1"><b>The ladder order has changed.</b> Save to apply the new levels.</div><button class="btn btn-ghost" onclick="S.desDraft=null;rerender()">Discard</button><button class="btn btn-primary" onclick="confirmDesOrder()">${ic('check')}Save order</button></div>`:''}
  <div class="grid gap-4 xl:grid-cols-[320px_1fr]">
    <section class="card p-5"><h3 class="card-title mb-1">${ic('trending-up','w-4 h-4')}Career ladder</h3><p class="text-xs muted mb-4">Each designation is one rung. Seniors can supervise lower rungs without being a team lead.</p>
      <div class="ladder">${list.map((d,i)=>`<div class="rung"><span class="lv mono">L${lvl(i)}</span><span class="blk" style="background:${tc[d.track]};width:${46+i*5.5}%">${d.name}</span></div>`).join('')}</div>
      <div class="flex flex-wrap gap-3 mt-5 text-xs">${Object.entries(tc).map(([k,c])=>`<span class="flex items-center gap-1.5"><i class="inline-block w-3 h-3 rounded-sm" style="background:${c}"></i>${k}</span>`).join('')}</div></section>
    <section class="card overflow-hidden"><div class="px-5 pt-4 text-xs muted flex items-center gap-1.5">${ic('grip-vertical','w-3.5 h-3.5')}Drag a row (or use the arrows) to change the order. Lowest level at the top.</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:28px"></th><th>Level</th><th>Designation</th><th>Track</th><th>Can lead a group</th><th>Salary band (monthly)</th><th>Employees</th><th>KPI target / qtr</th><th class="text-right">Actions</th></tr></thead><tbody id="des-body">
      ${list.map((d,i)=>{const moved=d.level!==lvl(i);return `<tr draggable="true" data-id="${d.id}" class="mw-drag-row${moved?' is-moved':''}" ondragstart="desDragStart(event)" ondragover="desDragOver(event)" ondrop="desDrop(event)" ondragend="desDragEnd(event)"><td class="mw-grip" aria-hidden="true">${ic('grip-vertical','w-4 h-4')}</td><td class="mono">L${lvl(i)}${moved?`<div class="text-[10px] muted">was L${d.level}</div>`:''}</td><td class="font-semibold">${d.name}</td><td>${chip(d.track,d.track==='Management'?'hi':d.track==='Executive'?'info':d.track==='Entry'?'':'acc')}</td><td>${d.canLead!==false?chip('Yes','ok','crown'):'<span class="text-xs muted">No</span>'}</td><td class="tnum">${RM(d.min)} – ${RM(d.max)}</td><td class="tnum">${DB.employees.filter(e=>e.desig===d.id).length}</td><td class="tnum">${TARGET[lvl(i)]??'—'} pts</td>
      <td><div class="actions">${ib('arrow-up','Move up',`moveDes('${d.id}',-1)`,'',i===0)}${ib('arrow-down','Move down',`moveDes('${d.id}',1)`,'',i===list.length-1)}${ib('pencil','Edit designation',`editDesignation('${d.id}')`)}${ib('trash-2','Delete designation',`delDesignation('${d.id}')`,'bad')}</div></td></tr>`}).join('')}
    </tbody></table></div></section></div>`;
}
function desIds(){return S.desDraft||[...DB.designations].sort((a,b)=>a.level-b.level).map(d=>d.id)}
function moveDes(id,dir){const l=[...desIds()],i=l.indexOf(id),j=i+dir;if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];S.desDraft=l;rerender()}
function desDragStart(ev){S.desDrag=ev.currentTarget.dataset.id;ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',S.desDrag);ev.currentTarget.classList.add('is-dragging')}
function desDragOver(ev){ev.preventDefault();const tr=ev.currentTarget,r=tr.getBoundingClientRect(),after=ev.clientY>r.top+r.height/2;$$('#des-body tr').forEach(x=>x.classList.remove('drop-before','drop-after'));tr.classList.add(after?'drop-after':'drop-before')}
function desDrop(ev){ev.preventDefault();const tr=ev.currentTarget,to=tr.dataset.id,from=S.desDrag;if(!from||from===to)return desDragEnd();const after=tr.classList.contains('drop-after');const l=desIds().filter(x=>x!==from);l.splice(l.indexOf(to)+(after?1:0),0,from);S.desDraft=l;S.desDrag=null;rerender()}
function desDragEnd(){S.desDrag=null;$$('#des-body tr').forEach(x=>x.classList.remove('is-dragging','drop-before','drop-after'))}
function confirmDesOrder(){
  const saved=[...DB.designations].sort((a,b)=>a.level-b.level),base=saved[0].level;
  const ch=S.desDraft.map((id,i)=>({d:des(id),to:base+i})).filter(x=>x.d.level!==x.to);
  const affected=ch.reduce((n,x)=>n+DB.employees.filter(e=>e.desig===x.d.id).length,0);
  openModal({title:'Save the new ladder order?',icon:'arrow-up-down',body:`<p class="text-sm">${ch.length} designation${ch.length===1?'':'s'} change level:</p><div class="tbl-wrap mt-2"><table class="mini-tbl"><thead><tr><th>Designation</th><th>From</th><th>To</th><th>Employees</th></tr></thead><tbody>${ch.map(x=>`<tr><td>${esc(x.d.name)}</td><td class="mono">L${x.d.level}</td><td class="mono"><b>L${x.to}</b></td><td class="tnum">${DB.employees.filter(e=>e.desig===x.d.id).length}</td></tr>`).join('')}</tbody></table></div>
    <div class="mw-alert mw-alert--warning mt-3" style="margin-bottom:0">${ic('triangle-alert')}<div class="text-sm">Affects ${affected} employee${affected===1?'':'s'}: KPI targets follow the new levels from the current period, and team-lead eligibility still follows each designation's "Can lead a group" setting. Employees keep their designation.</div></div>`,

function collectCand(vid,source){
  const req=['a-id','a-name','a-gender','a-dob','a-email','a-phone','a-sal','a-ecn','a-ecp'],miss=req.filter(r=>!val(r));
  req.forEach(r=>$('#'+r).style.borderColor=miss.includes(r)?'var(--bad)':'');
  if(miss.length){toast(`Fill in ${miss.length} required field(s)`,'circle-alert');$('#'+miss[0]).focus();return null}
  const idt=$('input[name=idt]:checked').value,idNo=val('a-id').toUpperCase();
  if(DB.candidates.find(c=>c.idNo===idNo&&c.vacancy===vid&&!['Hired','Disqualified'].includes(c.stage))){toast('An active application already exists for this ID and role','circle-alert');return null}
  const former=!!DB.alumni.find(a=>a.idNo===idNo)||DB.employees.some(e=>e.idNo===idNo);
  const c={id:'C'+String(DB.candidates.length+1).padStart(3,'0'),ref:'APP-2026-'+String(37+DB.candidates.length).padStart(4,'0'),name:val('a-name'),idType:idt,idNo,gender:val('a-gender'),dob:val('a-dob'),nationality:val('a-nat')||'—',email:val('a-email'),phone:val('a-phone'),address:val('a-addr')||'—',
    edu:{level:val('a-edu'),inst:val('a-inst')||'—',field:val('a-field')||'—',year:val('a-year')||'—'},exp:+val('a-exp')||0,expected:+val('a-sal'),notice:val('a-notice'),emergency:{name:val('a-ecn'),rel:val('a-ecr'),phone:val('a-ecp')},vacancy:vid||null,stage:'Applied',applied:TODAY,former,source,photo:S.tmpPhoto};
  DB.candidates.unshift(c);S.tmpPhoto=null;return c;
}

function idTypeChange(){
  const t=$('input[name=idt]:checked').value,i=$('#a-id');
  $('#idlbl').textContent=t==='NRIC'?'NRIC number':'Passport number';i.placeholder=t==='NRIC'?'900101-14-5678':'A12345678';i.value='';

function nricInput(el){
  if($('input[name=idt]:checked').value!=='NRIC')return;
  const d=el.value.replace(/\D/g,'').slice(0,12);
  el.value=d.length>8?`${d.slice(0,6)}-${d.slice(6,8)}-${d.slice(8)}`:d.length>6?`${d.slice(0,6)}-${d.slice(6)}`:d;
  if(d.length===12){const yy=+d.slice(0,2),yr=yy>+TODAY.slice(2,4)?1900+yy:2000+yy,mm=d.slice(2,4),dd=d.slice(4,6);
    if(+mm>=1&&+mm<=12&&+dd>=1&&+dd<=31){$('#a-dob').value=`${yr}-${mm}-${dd}`;$('#a-gender').value=(+d[11])%2?'Male':'Female';toast('Date of birth and gender filled from NRIC','sparkles')}}
}

function scheduleInterview(cid,iid,round){
  const it=iid?DB.interviews.find(x=>x.id===iid):null;
  const pool=DB.candidates.filter(c=>!['Hired','Disqualified'].includes(c.stage));
  const c0=cid?cand(cid):pool[0],v=cvac(c0);
  const prev=DB.interviews.filter(i=>i.cand===c0.id),r=it?.round||round||prev.length+1;
  const sugg=[v.manager,...DB.teams.filter(t=>t.dept===v.dept).flatMap(t=>t.leads||[])];
  const sel0=it?it.panel:(prev.at(-1)?.panel||sugg);
  openModal({title:it?'Reschedule interview':`Schedule interview · Round ${r}`,icon:'calendar-plus',size:'lg',body:`
    ${prev.length&&!it?`<div class="banner mb-4" style="padding:10px 14px"><span class="text-sm">${ic('history','w-4 h-4 inline')} ${prev.length} previous round(s): ${prev.map(p=>`R${p.round} ${p.kind} (${p.result})`).join(', ')}</span></div>`:''}
    <div class="grid sm:grid-cols-2 gap-4">
    ${fld('Candidate',sel('i-c',pool.map(c=>[c.id,`${c.name} — ${cvac(c).title}`]),c0.id),'sm:col-span-2',true)}
    ${fld('Round',inp('i-r',r,'number','','min="1"'))}${fld('Interview type',sel('i-k',['HR screening','Technical','Practical test','Culture fit','Management','Final / offer discussion'],it?.kind||(r===1?'HR screening':r===2?'Technical':'Management')))}
    ${fld('Date',inp('i-d',it?.date||addD(TODAY,2),'date'),'',true)}${fld('Time',inp('i-t',it?.time||'10:00','time'),'',true)}
    ${fld('Mode',sel('i-m',['Google Meet','Microsoft Teams','Onsite','Phone'],it?.mode||'Google Meet'))}${fld('Location / link',inp('i-w',it?.where||'','text','Auto-generate meeting link'))}
  </div>
  <div class="sec-h">${ic('users')}Invite panel</div>${picker('panel',{selected:sel0,pool:DB.employees.filter(e=>des(e.desig).level>=2).map(e=>e.id),quick:false})}
  <label class="check-row mt-3"><input type="checkbox" checked> Email calendar invite (.ics) to candidate and panel</label>`,
  foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveInterview('${iid||''}')">${ic('send')}${iid?'Update & notify':'Schedule & invite'}</button>`});

function saveInterview(iid){
  const panel=picked('panel');if(!panel.length){toast('Pick at least one panel member','circle-alert');return}
  const m=val('i-m'),o={cand:val('i-c'),round:+val('i-r')||1,kind:val('i-k'),date:val('i-d'),time:val('i-t'),mode:m,where:val('i-w')||(m==='Onsite'?'Level 8, Meeting Room Cendana':m==='Phone'?cand(val('i-c')).phone:'meet.google.com/new-'+Math.random().toString(36).slice(2,6)),panel,result:'Scheduled'};
  if(iid)Object.assign(DB.interviews.find(x=>x.id===iid),o);else DB.interviews.push({id:'I'+String(DB.interviews.length+1).padStart(3,'0'),...o});
  cand(o.cand).stage='Interview';closeModal();rerender();toast(`Round ${o.round} scheduled · invites sent to ${panel.length+1}`,'send');

function recordResult(iid){
  const i=DB.interviews.find(x=>x.id===iid),c=cand(i.cand),v=cvac(c);
  const opts=[['Qualified','circle-check','Proceed to offer'],['Next round','arrow-right-circle','Schedule another round'],['On hold','pause-circle','Keep in view'],['Disqualified','circle-x','Reject with remarks'],['No show','user-x','Candidate did not attend']];
  openModal({title:`Record result · Round ${i.round}`,icon:'clipboard-check',body:`<p class="mb-4"><b>${esc(c.name)}</b> · ${esc(v.title)} · ${i.kind} · ${fmt(i.date)}</p>
    <div class="grid sm:grid-cols-2 gap-2 mb-4">${opts.map(([o,icn,d],k)=>`<label class="check-row"><input type="radio" name="res" value="${o}" ${k===0?'checked':''}>${ic(icn,'w-4 h-4')}<span><b class="text-sm">${o}</b><span class="block text-xs muted">${d}</span></span></label>`).join('')}</div>

    ${v.pool?'':`<div class="mt-4">${fld('Recommended designation',sel('r-des',DB.designations.filter(d=>d.level>=des(v.dFrom).level&&d.level<=des(v.dTo).level).map(d=>[d.id,d.name])))}</div>`}
    <div class="mt-4">${fld('Remarks',txt('r-m','','Strengths, concerns, reason for decision'),'',true)}</div>`,
    foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveResult('${iid}')">${ic('check')}Save result</button>`});

function saveResult(iid){
  if(!val('r-m')){toast('Remarks are required','circle-alert');return}
  const i=DB.interviews.find(x=>x.id===iid),r=$('input[name=res]:checked').value;
  Object.assign(i,{result:r,rating:+$('input[name=rate]:checked').value,remarks:val('r-m')});
  const c=cand(i.cand);c.recDes=val('r-des')||c.recDes;
  c.stage={Qualified:'Qualified','Next round':'Interview','On hold':'On hold',Disqualified:'Disqualified','No show':'Interview'}[r];if(r==='Disqualified')c.remarks=val('r-m');
  closeModal();rerender();toast(`Round ${i.round}: ${r}`,'clipboard-check');
  if(r==='Next round')setTimeout(()=>scheduleInterview(c.id,null,i.round+1),250);
  if(r==='No show')setTimeout(()=>scheduleInterview(c.id,null,i.round),250);
}

      ${fld('Basic salary (RM)',inp('x-sal',c.expected,'number'))}${fld('Reports to (superior)',sel('x-rep',DB.employees.filter(e=>des(e.desig).level>=3).map(e=>[e.id,`${e.name} · ${des(e.desig).name}`]),v.manager))}
      ${fld('Team',sel('x-team',[['','— None —'],...DB.teams.map(t=>[t.id,`${t.name} (${t.dept})`])],DB.teams.find(t=>t.dept===v.dept)?.id||''),'sm:col-span-2')}

    foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="doConvert('${id}',${direct})">${ic('user-check')}Create employee</button>`});

function doConvert(id,direct){
  const c=cand(id),prob=+val('x-prob'),type=val('x-type'),start=val('x-start');
  if(!val('x-pos')){toast('Position title is required','circle-alert');return}
  const e={id:'E'+String(30+DB.employees.length),no:val('x-no'),name:c.name,email:val('x-mail'),pos:val('x-pos'),desig:val('x-des'),dept:val('x-dept'),type,status:type==='Permanent'?(prob?'Probation':'Permanent'):type,joined:start,reports:val('x-rep'),salary:+val('x-sal'),
    gender:c.gender,dob:c.dob,idType:c.idType,idNo:c.idNo,phone:c.phone,address:c.address,ec:{...c.emergency},photo:c.photo||null,infoUpdated:TODAY};
  if(prob)e.probEnd=addM(start,prob);if(type!=='Permanent')e.endDate=addM(start,type==='Internship'?6:12);
  DB.employees.push(e);takeEmpNo(e.no);const tm=DB.teams.find(t=>t.id===val('x-team'));if(tm)tm.members.push(e.id);
  c.stage='Hired';c.employee=e.id;
  logEvent(e.id,direct?'Re-hired (direct approval)':'Joined',`${e.pos} · ${des(e.desig).name} · ${type}${prob?` (probation ${prob} months)`:''}`,'acc',start);
  closeModal();closeDrawer();rerender();toast(`${c.name} is now ${e.no}`,'user-check');
}

function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}if(f||r.length){r.push(f);rows.push(r)}return rows.filter(x=>x.some(v=>v.trim()))}

function validateCSV(){
  const rows=parseCSV($('#csv-in').value);if(rows.length<2){toast('Paste at least one data row','circle-alert');return}
  const head=rows[0].map(h=>h.trim().toLowerCase()),miss=CSV_COLS.filter(c=>!head.includes(c));
  if(miss.length){$('#csv-prev').innerHTML=`<div class="banner">${ic('circle-alert')}<span class="text-sm">Missing columns: <b>${miss.join(', ')}</b></span></div>`;icons();return}
  const fileNos=rows.slice(1).map(r=>r[head.indexOf('employee_no')]);
  S.csv=rows.slice(1).map(r=>{const o=Object.fromEntries(head.map((h,i)=>[h,(r[i]||'').trim()]));const err=[];
    const ex=DB.employees.find(e=>e.no===o.employee_no)||DB.employees.find(e=>e.idNo&&e.idNo===o.id_no);
    if(!o.full_name)err.push('full_name empty');
    if(!DB.designations.find(d=>d.name.toLowerCase()===o.designation.toLowerCase()))err.push(`designation "${o.designation}" not found`);
    if(!deptNames().some(d=>d.toLowerCase()===o.department.toLowerCase()))err.push(`department "${o.department}" not found`);
    if(o.team&&!DB.teams.find(t=>t.name.toLowerCase()===o.team.toLowerCase()))err.push(`team "${o.team}" not found`);
    if(o.reports_to_no&&!DB.employees.find(e=>e.no===o.reports_to_no)&&!fileNos.includes(o.reports_to_no))err.push(`superior ${o.reports_to_no} not found`);
    if(!DB.empTypes.find(t=>t.id===o.employment_type))err.push('employment_type invalid');
    const diff=ex?[['position','pos'],['basic_salary','salary'],['mobile','phone'],['address','address']].filter(([c,k])=>o[c]&&String(ex[k])!==o[c]).map(([c])=>c):[];
    return {o,ex,err,diff};});
  const ok=S.csv.filter(r=>!r.err.length);
  $('#csv-prev').innerHTML=`<div class="flex flex-wrap gap-2 mb-2">${chip(S.csv.filter(r=>!r.err.length&&!r.ex).length+' new','ok','user-plus')}${chip(S.csv.filter(r=>!r.err.length&&r.ex).length+' update','info','refresh-cw')}${chip(S.csv.filter(r=>r.err.length).length+' error','bad','circle-alert')}</div>
    <div class="tbl-wrap"><table class="mini-tbl"><thead><tr><th>Action</th><th>Employee no.</th><th>Name</th><th>Designation</th><th>Department</th><th>Notes</th></tr></thead><tbody>${S.csv.map(r=>`<tr class="${r.err.length?'row-err':''}"><td>${r.err.length?chip('Skip','bad'):r.ex?chip('Update','info'):chip('Create','ok')}</td><td class="mono">${esc(r.o.employee_no)}</td><td>${esc(r.o.full_name)}</td><td>${esc(r.o.designation)}</td><td>${esc(r.o.department)}</td><td style="white-space:normal" class="text-xs">${r.err.length?esc(r.err.join('; ')):r.ex?'Changes: '+(r.diff.join(', ')||'none'):'New record'}</td></tr>`).join('')}</tbody></table></div>
    ${S.csv.some(r=>r.err.some(x=>x.includes('department')))?`<p class="text-xs mt-2">Unknown department? <a href="javascript:closeModal();location.hash='departments'" style="color:var(--accent)" class="font-semibold">Create it in Departments</a>, then re-import.</p>`:''}`;
  const b=$('#csv-go');b.disabled=!ok.length;b.style.opacity=ok.length?1:.5;b.innerHTML=`${ic('upload')}Import ${ok.length} row${ok.length===1?'':'s'}`;icons();
}
function commitCSV(){
  const ok=S.csv.filter(r=>!r.err.length);let n=0,u=0;
  ok.forEach(({o,ex})=>{const d=DB.designations.find(x=>x.name.toLowerCase()===o.designation.toLowerCase()),dept=deptNames().find(x=>x.toLowerCase()===o.department.toLowerCase());

  const e=emp(id),d=val('lc-d')||TODAY;let msg='Saved';
  if(kind==='extend'){const m=+val('lc-m');e.probEnd=addM(e.probEnd||TODAY,m);logEvent(id,'Probation extended',`+${m} month(s). ${val('lc-r')}`,'warn');msg='Probation extended to '+fmt(e.probEnd)}
  if(kind==='confirm'){const promo=e.status==='Promotion Probation';e.status='Permanent';e.type='Permanent';delete e.probEnd;logEvent(id,promo?'Promotion confirmed':'Confirmed permanent',`${val('lc-o')}. ${val('lc-r')}`,'ok',d);msg='Confirmed'}
  if(kind==='convert'){const t=val('lc-t');if(t.startsWith('End')){logEvent(id,t,val('lc-r'),'bad',d);msg=t}else if(t.startsWith('Renew')){e.endDate=addM(e.endDate||d,12);logEvent(id,'Contract renewed','12 months','info',d);msg='Contract renewed'}else{const m=+val('lc-m');Object.assign(e,{type:t,status:t==='Permanent'?(m?'Probation':'Permanent'):t,salary:+val('lc-s')});delete e.endDate;if(m)e.probEnd=addM(d,m);if(e.desig==='D0')e.desig='D1';logEvent(id,'Converted to '+t,`${RM(e.salary)}${m?`, probation ${m} months`:''}`,'acc',d);msg='Converted to '+t}}
  if(kind==='increment'){const s=+val('lc-s'),old=e.salary;e.salary=s;logEvent(id,'Increment',`${RM(old)} → ${RM(s)} (+${((s/old-1)*100).toFixed(1)}%) · ${val('lc-k')}`,'ok',d);msg='Increment recorded'}
  if(kind==='promote'){const to=val('lc-to'),m=+val('lc-m'),from=des(e.desig).name;Object.assign(e,{desig:to,pos:val('lc-pos'),salary:+val('lc-s')});if(m){e.status='Promotion Probation';e.probEnd=addM(d,m)}logEvent(id,'Promoted',`${from} → ${des(to).name}${m?` (promotion probation ${m} months)`:''}`,'info',d);msg='Promoted to '+des(to).name}
  if(kind==='pip'){if(!val('lc-g')){toast('Add at least one goal','circle-alert');return}const n=+val('lc-m');e.prevStatus=e.status;e.status='PIP';e.pipEnd=addD(d,n);logEvent(id,'PIP started',`${n} days · Reviewer: ${ename(val('lc-rv'))} · ${val('lc-ci')} check-ins`,'bad',d);msg='PIP started'}
  if(kind==='closepip'){const o=val('lc-o');if(o.startsWith('Successful')){e.status=e.prevStatus&&e.prevStatus!=='PIP'?e.prevStatus:'Permanent';delete e.pipEnd}else if(o.startsWith('Extend'))e.pipEnd=addD(e.pipEnd,30);logEvent(id,'PIP review',o,o.startsWith('Successful')?'ok':'bad',d);msg='PIP updated'}
  closeModal();rerender();toast(msg);
}

       ${av(e.display||e.name,32)}<div class="flex-1 min-w-0"><div class="text-sm font-semibold truncate flex items-center gap-1.5">${esc(e.display||e.name)}${lead?`<span style="color:var(--hi)" aria-hidden="true">${ic('crown','w-4 h-4')}</span>`:''}</div><div class="text-xs muted truncate">${esc(des(e.desig).name)} · ${t('Reports to')} ${esc(ename(e.reports))}</div></div>
       ${lead?chip(t('Team lead'),'hi'):''}${hr?`<span class="actions opacity-40 group-hover:opacity-100">${lead||canLead(m)?ib('crown',lead?'Remove as team lead':'Make team lead',`toggleLead('${g.id}','${m}')`):''}${ib('user-minus','Remove from group',`rmMember('${g.id}','${m}')`,'bad')}</span>`:''}</li>`}).join(''):'<li class="text-sm muted px-2 py-3">No members yet.</li>'}</ul>
   </section>`}).join('')}</div><p class="text-xs muted mt-3">Team leads are optional: a group can have none, one or several. Interns and juniors (Junior 1–2) can't be team leads by default; each designation's Can lead a group setting decides. Who reports to whom is set per person, so members can sit under any colleague, a team lead, the HOD or the GM.</p>`;
}
// Interns and juniors (Junior 1-2) can't be team leads.
// D17: each designation says whether its holders can lead a group (Intern and Junior 1–2 can't by default).
function canLead(id){const e=emp(id);return !!e&&des(e.desig).canLead!==false}
function toggleLead(gid,m){const g=DB.teams.find(x=>x.id===gid);g.leads=g.leads||[];if(!g.leads.includes(m)&&!canLead(m)){toast(`${ename(m)} is ${des(emp(m).desig).name}: interns and juniors can't be team leads`,'circle-alert');return}g.leads=g.leads.includes(m)?g.leads.filter(x=>x!==m):[...g.leads,m];rerender();toast(`${ename(m)}: ${g.leads.includes(m)?'now a team lead':'no longer a team lead'}`,'crown')}
// True if making "sup" the superior of "id" would put "id" above itself.
function wouldLoop(id,sup){for(let x=sup,i=0;x&&i<200;x=emp(x)?.reports,i++){if(x===id)return true}return false}
function groupRows(dept,g){
  const people=DB.employees.filter(e=>e.dept===dept);
  const supOpts=e=>[['','— None —'],...DB.employees.filter(x=>x.id!==e.id).sort((a,b)=>(a.dept===dept?0:1)-(b.dept===dept?0:1)||des(b.desig).level-des(a.desig).level).map(x=>[x.id,`${x.display||x.name} · ${x.dept===dept?des(x.desig).name:x.dept}`])];
  return `<div class="tbl-wrap mw-group-editor"><table class="tbl"><thead><tr><th>Employee</th><th class="text-center">${t('In group')}</th><th class="text-center">${t('Team lead')}</th><th>${t('Reports to (per person)')}</th></tr></thead><tbody>
    ${people.map(e=>`<tr><td><div class="flex items-center gap-2">${av(e.display||e.name,26)}<div><div class="font-semibold text-sm">${esc(e.display||e.name)}</div><div class="text-xs muted">${esc(des(e.desig).name)}</div></div></div></td>
      <td class="text-center"><input type="checkbox" class="ge-in" data-id="${e.id}" ${g.members.includes(e.id)?'checked':''} aria-label="${esc(e.name)} in group" style="width:18px;height:18px;accent-color:var(--accent)"></td>
      <td class="text-center"><input type="checkbox" class="ge-lead" data-id="${e.id}" ${(g.leads||[]).includes(e.id)?'checked':''} ${canLead(e.id)?'':'disabled title="Interns and juniors can\'t be team leads"'} aria-label="${esc(e.name)} team lead" style="width:18px;height:18px;accent-color:var(--accent)"></td>
      <td style="min-width:230px">${sel('ge-rep-'+e.id,supOpts(e),e.reports||'')}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function editTeam(id){
  const g=id?DB.teams.find(x=>x.id===id):{name:'',dept:deptNames()[1],leads:[],members:[]};
  S.editGroup=g;
  openModal({title:id?`Edit ${esc(g.name)}`:'New group',icon:'users-round',size:'lg',body:`<div class="grid sm:grid-cols-2 gap-4">${fld('Group name',inp('tm-n',g.name,'text','e.g. FE Developer'),'',true)}${fld('Department',sel('tm-d',deptNames(),g.dept,'onchange="$(\'#ge-rows\').innerHTML=groupRows(this.value,S.editGroup)"'))}</div>
  <div class="sec-h">${ic('users')}Members, team leads and reporting <span class="normal-case font-normal tracking-normal">· team leads are optional; tick as many as needed (Senior 1 and above)</span></div>
  <div id="ge-rows">${groupRows(g.dept,g)}</div>`,
    foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveTeam('${id||''}')">${ic('check')}Save group</button>`});
}
function saveTeam(id){
  const members=$$('.ge-in').filter(c=>c.checked).map(c=>c.dataset.id);
  const leads=$$('.ge-lead').filter(c=>c.checked).map(c=>c.dataset.id);
  if(!val('tm-n')){toast('Group name is required','circle-alert');return}
  if(leads.some(l=>!members.includes(l))){toast('A team lead must also be in the group','circle-alert');return}
  const young=leads.find(l=>!canLead(l));if(young){toast(`${ename(young)} can't be a team lead: interns and juniors don't qualify`,'circle-alert');return}
  const reps=$$('[id^="ge-rep-"]').map(s=>[s.id.slice(7),s.value]);
  const loop=reps.find(([e,s])=>s&&wouldLoop(e,s));
  if(loop){toast(`${ename(loop[0])} can't report to ${ename(loop[1])}: that would make a loop`,'circle-alert');return}
  reps.forEach(([e,s])=>{const x=emp(e);if(x)x.reports=s||null});
  const o={name:val('tm-n'),dept:val('tm-d'),members,leads};
  if(id)Object.assign(DB.teams.find(x=>x.id===id),o);else DB.teams.push({id:'T'+Date.now(),...o});
  closeModal();rerender();toast('Group saved','users-round');
}
function rmMember(t,m){const tm=DB.teams.find(x=>x.id===t);tm.members=tm.members.filter(x=>x!==m);tm.leads=(tm.leads||[]).filter(x=>x!==m);rerender();toast('Removed from group','user-minus')}
function delTeam(id){confirmBox('Delete group?','Members stay employed; only the grouping is removed.','Delete',`DB.teams=DB.teams.filter(t=>t.id!=='${id}');closeModal();rerender();toast('Group deleted','trash-2')`)}

function pgOrgChart(){

function orgBoard(){

  const depts=DB.departments.filter(d=>d.name!=='Management');
  const card=d=>{

    return `<section class="dept-card"><header><b>${esc(d.name)}</b><span class="text-xs muted">${staff.length} ${staff.length===1?'person':'people'}</span></header>

      ${groups.map(g=>(showLabel(g)?`<div class="grp-label">${esc(g.name)}</div>`:'')+g.members.map(mem).join('')).join('')}
    </section>`};
  return `<section class="card org-board">
    <div class="org-top">${person('E001','Chief Executive Officer')}<span class="stem"></span>${person('E002','General Manager')}</div>
    <div class="org-divider">${depts.length} departments</div>
    <div class="dept-cols">${depts.map(card).join('')}</div>
  </section><p class="text-xs muted mt-3">Each department shows its head (HOD), then its groups; a group may have no, one or several team leads. Built from departments and groups; switch to Reporting lines for the superior tree.</p>`;
}
function orgTree(){
  const kids=id=>DB.employees.filter(e=>e.reports===id);
  const isLead=id=>DB.teams.some(t=>(t.leads||[]).includes(id));
  const crown=id=>isLead(id)?'<span class="crown" data-tip="Team lead">'+ic('crown')+'</span>':'';
  const dOrder=d=>DB.departments.findIndex(x=>x.name===d);
  const teamOf=id=>DB.teams.find(t=>t.members.includes(id));
  // The label is the person's group; a head of department outside any group shows the department.
  const unitOf=e=>{const t=teamOf(e.id);return t?{name:t.name,dept:t.dept,ix:DB.teams.indexOf(t)}:{name:e.dept,dept:e.dept,ix:-1}};
  const label=u=>'<div class="org-team" style="--c:'+dcol(u.dept)+'">'+esc(u.name)+'</div>';
  const card=e=>'<div class="org-node sm"><span class="strip" style="background:'+dcol(e.dept)+'"></span>'+crown(e.id)+av(e.display||e.name,28,e.photo||null)+'<div class="nm">'+esc(e.display||e.name)+'</div><div class="ps">'+esc(e.pos)+'</div><div class="lv">'+esc(des(e.desig).name)+(e.status!=='Permanent'?' · <span class="st">'+esc(e.status)+'</span>':'')+'</div></div>';
  const leaf=e=>'<div class="org-leaf"><span class="dot" style="background:'+dcol(e.dept)+'"></span>'+av(e.display||e.name,18,e.photo||null)+'<span class="nm">'+esc(e.display||e.name)+'</span>'+crown(e.id)+'<span class="lv">'+esc(des(e.desig).name)+'</span>'+(e.status!=='Permanent'?'<span class="st">'+esc(e.status)+'</span>':'')+'</div>';
  const byLevel=(a,b)=>des(b.desig).level-des(a.desig).level||a.name.localeCompare(b.name);
  // Children become units: each superior is its own branch; people with no reports are boxed per group.
  // Units sort by department, then group, superiors before boxes. Labels show when the group changes
  // (always under the General Manager, so every branch is named).
  const node=(e,parent,always)=>{
    const u=unitOf(e),show=always||!parent||parent.name!==u.name;
    const units=[];
    kids(e.id).filter(k=>kids(k.id).length).forEach(k=>units.push({u:unitOf(k),m:1,html:()=>node(k,u,always&&false)}));
    const boxes={};kids(e.id).filter(k=>!kids(k.id).length).sort(byLevel).forEach(k=>{const ku=unitOf(k);(boxes[ku.name]=boxes[ku.name]||{u:ku,list:[]}).list.push(k)});
    Object.values(boxes).forEach(b=>units.push({u:b.u,m:0,html:()=>'<li class="leaves">'+((always||b.u.name!==u.name)?label(b.u):'')+'<div class="org-stack">'+b.list.map(leaf).join('')+'</div></li>'}));
    units.sort((a,b)=>dOrder(a.u.dept)-dOrder(b.u.dept)||a.u.ix-b.u.ix||b.m-a.m);
    return '<li>'+(show?label(u):'')+card(e)+(units.length?'<ul>'+units.map(x=>x.html()).join('')+'</ul>':'')+'</li>';
  };
  // CEO -> GM chain at the top; the GM's branches are all labelled.
  const roots=DB.employees.filter(e=>!e.reports);
  const gm=roots.length===1&&kids(roots[0].id).length===1?kids(roots[0].id)[0]:null;
  const tree=roots.map(r=>gm?'<li>'+label(unitOf(r))+card(r)+'<ul>'+node(gm,unitOf(gm),true).replace(/^<li>(<div class="org-team"[^>]*>[^<]*<\/div>)?/,'<li>')+'</ul></li>':node(r,null,false)).join('');
  setTimeout(fitOrg,0);
  return '<section class="card overflow-hidden">'+
    '<div class="p-4 flex flex-wrap items-center gap-3" style="border-bottom:1px solid var(--line)">'+
      '<div class="flex flex-wrap gap-3 flex-1 text-xs">'+DB.departments.map(d=>'<span class="flex items-center gap-1.5"><i class="inline-block w-3 h-3 rounded-sm" style="background:'+d.color+'"></i>'+esc(d.name)+'</span>').join('')+'<span class="flex items-center gap-1.5" style="color:var(--hi)">'+ic('crown','w-3.5 h-3.5')+'<span style="color:var(--ink)">Team lead</span></span></div>'+
      '<div class="flex items-center gap-1">'+ib('zoom-out','Zoom out','zoomOrg(-.1)')+'<span class="text-xs tnum w-12 text-center" id="zl">Fit</span>'+ib('zoom-in','Zoom in','zoomOrg(.1)')+ib('maximize','Fit to width','S.orgZoom=1;fitOrg()')+'</div>'+
      '<details class="mw-menu"><summary class="btn btn-primary">'+ic('image-down')+'Export'+ic('chevron-down','w-4 h-4')+'</summary><div class="mw-menu__list">'+
        [['png','PNG image','High resolution, transparent-free'],['jpg','JPG image','Smaller file for chat and email'],['pdf','PDF (A4 landscape)','Ready to print on one page']].map(([k,l,h])=>'<button onclick="this.closest(\'details\').open=false;exportOrg(\''+k+'\')"><b>'+l+'</b><span>'+h+'</span></button>').join('')+
      '</div></details>'+
    '</div>'+
    '<div class="org-scroll" id="org-scroll"><div class="tree compact" id="tree"><ul>'+tree+'</ul></div></div>'+
  '</section><p class="text-xs muted mt-3">Built from each employee\'s superior. Each branch is labelled with its group (or department for a head outside any group). People with no reports are boxed per group under their superior. Export as PNG or JPG at 3× pixel density, or as an A4 landscape PDF.</p>';
}
// Scales the tree to fit the screen width (times the user's zoom).
function fitOrg(){
  const el=$('#tree'),box=$('#org-scroll');if(!el||!box)return;
  el.style.zoom=1;const w=el.scrollWidth;
  const fit=box.clientWidth>200&&w>box.clientWidth-40?(box.clientWidth-40)/w:1;el.style.zoom=(fit*S.orgZoom).toFixed(3);
  const zl=$('#zl');if(zl)zl.textContent=S.orgZoom===1?'Fit':Math.round(S.orgZoom*100)+'%';
}
window.addEventListener('resize',()=>{if(S.page==='orgchart'&&S.orgView==='tree')fitOrg()});
function zoomOrg(d){S.orgZoom=Math.min(2.5,Math.max(.5,+(S.orgZoom+d).toFixed(2)));fitOrg()}
async function exportOrg(kind){
  kind=kind||'png';const el=$('#tree');if(!window.htmlToImage){toast('Export library not loaded','circle-alert');return}
  if(kind==='pdf'&&!window.jspdf){toast('PDF library not loaded','circle-alert');return}
  toast('Rendering '+kind.toUpperCase()+'…','loader');const prev=el.style.zoom;el.style.zoom=1;
  const w=el.scrollWidth,h=el.scrollHeight,bg=getComputedStyle(document.body).backgroundColor;
  const name='org-chart-'+TODAY;
  try{
    const opt={pixelRatio:3,backgroundColor:bg,skipFonts:true,width:w,height:h};
    const url=kind==='png'?await htmlToImage.toPng(el,opt):await htmlToImage.toJpeg(el,{...opt,quality:.92,backgroundColor:bg==='rgba(0, 0, 0, 0)'?'#ffffff':bg});
    el.style.zoom=prev;
    if(kind==='pdf'){
      // One A4 landscape page: title line, then the chart scaled to fit inside 10 mm margins.
      const pdf=new jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
      const pw=297,ph=210,m=10,top=18;
      pdf.setFontSize(12);pdf.text(DB.settings.company+' · Reporting lines',m,m+3);
      pdf.setFontSize(8);pdf.setTextColor(120);pdf.text('As of '+fmt(TODAY),pw-m,m+3,{align:'right'});
      const sc=Math.min((pw-2*m)/w,(ph-top-m)/h),iw=w*sc,ih=h*sc;
      pdf.addImage(url,'JPEG',(pw-iw)/2,top,iw,ih);
      const blob=pdf.output('bloburl');
      openModal({title:'Org chart exported',icon:'file-text',size:'lg',body:'<iframe src="'+blob+'" title="Organization chart PDF" class="w-full rounded-lg" style="height:60vh;border:1px solid var(--line)"></iframe><p class="text-xs muted mt-2">A4 landscape, one page. If the download is blocked in this preview, use the viewer\'s own download button.</p>',
        foot:'<button class="btn btn-ghost" onclick="closeModal()">Close</button><a class="btn btn-primary" href="'+blob+'" download="'+name+'.pdf">'+ic('download')+'Download PDF</a>'});
      return;
    }
    const ext=kind==='png'?'png':'jpg';
    openModal({title:'Org chart exported',icon:'image-down',size:'lg',body:'<img src="'+url+'" alt="Organization chart" class="w-full rounded-lg" style="border:1px solid var(--line)"><p class="text-xs muted mt-2">'+ext.toUpperCase()+' · '+w*3+' × '+h*3+'px. If the download is blocked in this preview, right-click the image and save it.</p>',
      foot:'<button class="btn btn-ghost" onclick="closeModal()">Close</button><a class="btn btn-primary" href="'+url+'" download="'+name+'.'+ext+'">'+ic('download')+'Download '+ext.toUpperCase()+'</a>'});
  }catch(err){el.style.zoom=prev;toast('Export failed: '+err.message,'circle-alert')}
}

// Format tokens: {seq} running number (zero-padded), {yyyy}/{yy} join year, {dept} department code.
const EMPNO_TOKENS=[['{seq}','Running number, padded to the digits below'],['{yyyy}','Join year, e.g. 2026'],['{yy}','Join year, 2 digits'],['{dept}','Department code, e.g. BE']];
const deptCode=d=>(d||'').split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,3)||'XX';
function fmtEmpNo(cfg,seq,e={}){const y=(e.joined||TODAY).slice(0,4);return cfg.pattern.replace(/\{seq\}/g,String(seq).padStart(cfg.digits,'0')).replace(/\{yyyy\}/g,y).replace(/\{yy\}/g,y.slice(2)).replace(/\{dept\}/g,deptCode(e.dept))}
function empNoCfg(){
  const s=DB.settings;if(!s.empNo){const max=Math.max(0,...DB.employees.map(e=>+(/(\d+)$/.exec(e.no)||[0,0])[1]));s.empNo={pattern:'LN-{seq}',digits:4,next:max+1}}
  return s.empNo;
}
const nextEmpNo=(e={})=>{const c=empNoCfg();return fmtEmpNo(c,c.next,e)};
function takeEmpNo(no){const c=empNoCfg();if(no===fmtEmpNo(c,c.next,{}))c.next++}
function empNoSection(){
  const c=empNoCfg(),ex=DB.employees[DB.employees.length-1];
  return `<section class="card p-5"><h3 class="card-title mb-1">${ic('hash','w-4 h-4')}Employee numbers</h3><p class="text-xs muted mb-3">How new employee numbers are made. Change the format any time; you choose whether existing numbers change too.</p>

    <div class="flex flex-wrap gap-1.5 mt-3">${EMPNO_TOKENS.map(([k,h])=>`<button type="button" class="chip" data-tip="${esc(h)}" onclick="const i=$('#en-pat');i.value+='${k}';empNoPreview()">${k}</button>`).join('')}</div>

}
function empNoRead(){return {pattern:val('en-pat').trim(),digits:+val('en-dig'),next:Math.max(1,parseInt(val('en-next'))||1)}}
function empNoPreview(){const c=empNoRead();$('#en-prev').textContent=c.pattern.includes('{seq}')?fmtEmpNo(c,c.next,DB.employees[DB.employees.length-1]):'Add {seq} to the format'}
function applyEmpNo(){
  const c=empNoRead();if(!c.pattern.includes('{seq}')){toast('The format needs {seq} so every number is unique','circle-alert');return}
  if(c.pattern.length>20){toast('Keep the format under 20 characters','circle-alert');return}
  const sorted=[...DB.employees].sort((a,b)=>a.joined.localeCompare(b.joined)||a.no.localeCompare(b.no));

    <label class="check-row"><input type="radio" name="en-mode" value="all"><span><b class="text-sm">Also renumber existing employees</b><span class="block text-xs muted">Everyone gets a new number in join-date order, starting from 1. Old numbers are kept in each person's history and still match on CSV import.</span></span></label></div>
    <div class="tbl-wrap mt-3"><table class="mini-tbl"><thead><tr><th>Employee</th><th>Now</th><th>If renumbered</th></tr></thead><tbody>${sample}</tbody></table></div>`,
    foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="doApplyEmpNo()">${ic('check')}Apply</button>`});
}
function doApplyEmpNo(){
  const c=S.empNoNew,all=$('input[name=en-mode]:checked').value==='all';
  if(all){const sorted=[...DB.employees].sort((a,b)=>a.joined.localeCompare(b.joined)||a.no.localeCompare(b.no));sorted.forEach((e,i)=>{const nn=fmtEmpNo(c,i+1,e);if(nn!==e.no){logEvent(e.id,'Employee no. changed',`${e.no} → ${nn}`,'info');e.no=nn}});c.next=Math.max(c.next,sorted.length+1)}

}

const effDue = t => t.due;
const myTasks = () => S.user.eid ? DB.tasks.filter(t=>t.who===S.user.eid) : S.user.gid ? DB.tasks.filter(t=>t.who===S.user.gid||t.requester===S.user.gid) : DB.tasks;
const superiorOf = t => isGuest(t.who) ? vendorOf(t.who)?.owner : emp(t.who)?.reports;
const pmOf = t => t.project ? proj(t.project).pm : superiorOf(t);
function needsCheckin(t){
  if(!['In progress','Blocked'].includes(t.status))return false;
  const last=t.ci.at(-1)?.[0]||t.start;if(last>=TODAY)return false;
  return wdays(addD(last,1),TODAY)>=DB.settings.checkinEvery;
}
const overdue = t => t.status!=='Done' && t.due<TODAY;
const hoursOf = t => t.ci.reduce((a,c)=>a+(+c[2]||0),0);
function pendingApprovals(){
  const u=S.user,out=[];if(!u)return out;
  DB.tasks.forEach(t=>(t.ext||[]).forEach(x=>{if(x.status!=='Pending')return;
    if([x.sup,x.pm].some(s=>s.st==='Pending'&&(s.who===u.eid||u.roleKey==='sysadmin')))out.push({t,x})}));
  return out;
}
function projHealth(p){
  const ts=DB.tasks.filter(t=>t.project===p.id);
  if(p.phase>=4&&ts.every(t=>t.status==='Done'))return ['Live','ok'];
  if(ts.some(overdue))return ['Delayed','bad'];
  if(ts.some(t=>t.status==='Blocked')||DB.delays.some(d=>d.project===p.id&&d.status==='Open'))return ['At risk','warn'];
  return ['On track','ok'];
}

function taskActions(t){
  const g=isGuestUser(),mine=t.who===uid()||S.user.roleKey==='sysadmin',p=proj(t.project),mgr=!g&&(p?canManageProj(p):isHR()||S.user.roleKey==='lead'),ext=isGuest(t.who);
  let h=ib('eye','Open task',`viewTask('${t.id}')`);
  if(t.status!=='Done'){
    if(mine)h+=ib('message-square-plus','Check in / update status',`checkin('${t.id}')`,needsCheckin(t)?'acc':'');

    if(!g)h+=ib('flag','Record delay / blocker',`recordDelay('${t.id}')`,'bad');

    if(ext){if(mine&&g&&t.status!=='Review')h+=ib('send','Submit for review',`submitReview('${t.id}')`,'ok');if(mgr&&t.status==='Review')h+=ib('message-square-diff','Request changes',`requestChanges('${t.id}')`)+ib('circle-check','Approve deliverable',`completeTask('${t.id}')`,'ok')}

}

const VIEW_MODES=[['list','List','list'],['grid','Grid','layout-grid'],['cards','Cards','gallery-vertical-end']];
S.views=S.views||{};
function vstate(key,def){return S.views[key]=S.views[key]||{mode:def.mode||'list',sort:def.sort,dir:def.dir||'asc',f:{},q:''}}
function setView(key,prop,v){const o=S.views[key];if(prop.startsWith('f.'))o.f[prop.slice(2)]=v;else o[prop]=v;rerender()}
function clearView(key){const o=S.views[key];o.f={};o.q='';rerender()}
// cfg: {sorts:{key:[label,compare]}, filters:[{id,label,opts:[[v,l]],test(item,v)}], text(item)}
function applyView(key,list,cfg){
  const o=vstate(key,cfg);const q=(o.q||'').trim().toLowerCase();
  let out=list.filter(x=>(!q||cfg.text(x).toLowerCase().includes(q))&&cfg.filters.every(f=>!o.f[f.id]||f.test(x,o.f[f.id])));
  const c=cfg.sorts[o.sort]?.[1];if(c){out=out.slice().sort(c);if(o.dir==='desc')out.reverse()}
  return out;
}
function viewBar(key,cfg,shown,total){

    (active?'<button class="btn btn-ghost" onclick="clearView(\''+key+'\')">'+ic('x')+'Clear</button>':'')+

    '<span class="mw-viewbar__sort">'+ic('arrow-down-up','w-4 h-4')+'<select class="input mw-viewbar__sel" aria-label="Sort by" onchange="setView(\''+key+'\',\'sort\',this.value)">'+Object.entries(cfg.sorts).map(([k,[l]])=>'<option value="'+k+'"'+(o.sort===k?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>'+
      ib(o.dir==='asc'?'arrow-up-narrow-wide':'arrow-down-wide-narrow',o.dir==='asc'?'Ascending':'Descending','setView(\''+key+'\',\'dir\',\''+(o.dir==='asc'?'desc':'asc')+'\')')+'</span>'+

  '</div>';
}

const ACT_IC={checkin:['message-square-text','info'],ext:['clock','hi'],delay:['flag','bad'],done:['circle-check','ok'],phase:['skip-forward','accent'],task:['plus','accent'],meeting:['presentation','info']};

function gantt(p,ts){

  const inR=TODAY>=p.start&&TODAY<=p.end,today=inR?`<span class="g-today" style="left:${pos(TODAY)}%"></span>`:'',todayL=inR?`<span class="g-today g-today-l" style="left:${pos(TODAY)}%"></span>`:'';
  const col={Done:'var(--ok)','In progress':'var(--accent)',Blocked:'var(--bad)','To do':'var(--line-strong)',Review:'var(--warn)'};
  const phaseRow=`<div class="g-row"><div class="g-label text-xs font-bold muted uppercase">Phases</div><div class="g-track">${grid}${lbl}${todayL}${p.phases.map((ph,i)=>`<span class="g-phase" style="left:${pos(ph[1])}%;width:${(days(ph[2],ph[1])+1)/total*100}%;background:color-mix(in srgb,var(--accent) ${i===p.phase?28:10}%,transparent);color:var(--ink)">${ph[0]}</span>`).join('')}</div></div>`;
  return `<div class="gantt">${phaseRow}${ts.sort((a,b)=>a.start.localeCompare(b.start)).map(t=>{
    const l=pos(t.start),w=(days(t.due,t.start)+1)/total*100,over=overdue(t)?`<span class="g-over" style="left:${l+w}%;width:${pos(TODAY)-l-w}%"></span>`:'';
    const late=t.status==='Done'&&t.done>(t.origDue||t.due)?`<span class="g-over" style="left:${l+(days(t.origDue||t.due,t.start)+1)/total*100}%;width:${days(t.done,t.origDue||t.due)/total*100}%" data-tip="Finished ${days(t.done,t.origDue||t.due)}d late"></span>`:'';
    const ext=t.origDue?`<span class="absolute" style="left:${l+(days(t.origDue,t.start)+1)/total*100}%;top:10px;bottom:10px;border-left:2px dashed var(--hi)" data-tip="Original due ${fmtS(t.origDue)} (extension approved)"></span>`:'';
    return `<div class="g-row"><div class="g-label">${tagc(t)}<button class="text-left min-w-0 flex-1" onclick="viewTask('${t.id}')"><div class="text-sm font-semibold truncate">${esc(t.title)}</div><div class="text-xs muted truncate">${esc(ename(t.who))}${t.deps.length?' · after '+t.deps.join(', '):''}</div></button></div>
      <div class="g-track">${grid}${today}<span class="g-bar" style="left:${l}%;width:${w}%;background:${col[t.status]}" onclick="viewTask('${t.id}')" data-tip="${esc(t.title)} · ${fmtS(t.start)}–${fmtS(t.due)} · ${t.pct}%"><span class="fill" style="width:${t.pct}%"></span><span>${t.pct}%</span></span>${over}${late}${ext}</div></div>`}).join('')}</div>`;
}

/* extension */
function requestExt(id){

    <p class="text-xs muted mt-2">An approved extension moves the due date and does not count as late. A rejected one keeps the original date.</p>`,
    foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveExt('${id}')">${ic('send')}Send request</button>`});
}
function saveExt(id){
  if(!val('ex-r')){toast('Details are required','circle-alert');return}
  const t=task(id),a=DB.settings.extApproval,same=superiorOf(t)===pmOf(t);
  const x={id:'X'+Date.now(),days:+val('ex-d'),reason:`${val('ex-c')}: ${val('ex-r')}`,by:t.who,on:TODAY,status:'Pending',sup:{who:superiorOf(t),st:a==='pm'?'N/A':'Pending'},pm:{who:pmOf(t),st:a==='sup'||same?'N/A':'Pending'}};
  (t.ext ||= []).push(x);act(t.project,'ext',`requested +${x.days} days on “${t.title}”.`,t.who);closeModal();rerender();toast('Extension request sent','send');
}
function approveExt(tid,xid,dec){
  const t=task(tid),x=t.ext.find(e=>e.id===xid),u=S.user;
  [x.sup,x.pm].filter(s=>s.st==='Pending'&&(s.who===u.eid||u.roleKey==='sysadmin')).slice(0,u.roleKey==='sysadmin'?1:2).forEach(s=>s.st=dec);
  if([x.sup,x.pm].some(s=>s.st==='Rejected'))x.status='Rejected';
  else if([x.sup,x.pm].every(s=>s.st!=='Pending')){x.status='Approved';t.origDue ||= t.due;t.due=addD(t.due,x.days)}
  act(t.project,'ext',`${dec.toLowerCase()} +${x.days} days on “${t.title}”${x.status==='Approved'?` (new due ${fmtS(t.due)})`:''}.`,u.eid);
  rerender();toast(x.status==='Pending'?`${dec}. Waiting for the other approver.`:`Extension ${x.status.toLowerCase()}`,dec==='Approved'?'check':'x');
}
/* delay */
const DELAY_CAUSES=['Late delivery','Incomplete material','Inaccurate material','Dependency not ready','Client / external','Scope change','Resource unavailable'];
function recordDelay(tid,pid){
  const t=tid?task(tid):null,p=proj(t?.project||pid),tasks=p?DB.tasks.filter(x=>x.project===p.id):[t];
  const ppl=p?p.members:[t.who,superiorOf(t)];
  openModal({title:'Record delay / blocker',icon:'flag',size:'lg',body:`<p class="text-sm muted mb-4">Use this when someone's late, incomplete or inaccurate work holds up others. It stays on the project trace and affects the responsible person's KPI (except external parties).</p>
  <div class="grid sm:grid-cols-2 gap-4">
    ${fld('Related task',sel('dl-t',tasks.map(x=>[x.id,`${x.title} (${ename(x.who)})`]),t?.id),'sm:col-span-2')}
    ${fld('Responsible (caused the delay)',sel('dl-r',[...ppl.concat(p?.guests||[]).map(m=>[m,ename(m)+(isGuest(m)?' (external)':'')]),['ext:Client','Client / external party']],t?(t.deps[0]?task(t.deps[0]).who:t.who):ppl[0]),'',true)}${fld('Cause',sel('dl-c',DELAY_CAUSES))}
    ${fld('Date it happened',inp('dl-d',TODAY,'date'))}${fld('Working days lost',inp('dl-n',1,'number','','min="0"'))}
    ${fld('What happened',txt('dl-x','','e.g. API delivered without refresh-token endpoint; frontend blocked 1 day.',3),'sm:col-span-2',true)}
    ${fld('Evidence (optional)',`<input type="file" class="input" style="padding-top:8px">`,'sm:col-span-2')}</div>
  <div class="sec-h">${ic('users')}Who was affected</div>${picker('dl-a',{selected:t&&t.who!==S.user.eid?[t.who]:t?[t.who]:[],pool:ppl,quick:false})}`,
  foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="saveDelay()">${ic('flag')}Record delay</button>`});
}
function saveDelay(){
  if(!val('dl-x')){toast('Describe what happened','circle-alert');return}
  const t=task(val('dl-t')),d={id:'DL'+(DB.delays.length+1),task:t.id,project:t.project,date:val('dl-d'),resp:val('dl-r'),affected:picked('dl-a'),cause:val('dl-c'),days:+val('dl-n')||0,note:val('dl-x'),by:S.user.eid||'E002',status:'Open'};
  DB.delays.push(d);act(t.project,'delay',`recorded a delay against ${ename(d.resp)}: ${d.cause}, ${d.days} day(s) lost.`);
  closeModal();rerender();toast(String(d.resp).startsWith('ext')||isGuest(d.resp)?'Recorded (external, no KPI impact)':`Recorded · affects ${ename(d.resp)}'s KPI`,'flag');
}
function resolveDelay(id){DB.delays.find(d=>d.id===id).status='Resolved';rerender();toast('Marked resolved')}
function completeTask(id){
  const t=task(id),late=TODAY>t.due;
  confirmBox('Mark task complete?',`${tagc(t)} <b>${esc(t.title)}</b><br><span class="text-sm muted">${late?`This is ${wdays(addD(t.due,1),TODAY)} working day(s) past the due date. A “Late delivery” delay will be recorded automatically.`:'Delivered on time.'}</span>`,`${ic('circle-check')}Complete`,`doComplete('${id}')`,false);
}
function doComplete(id){
  const t=task(id);t.status='Done';t.pct=100;t.done=TODAY;t.ci.push([TODAY,100,0,'Completed','Done']);
  if(TODAY>t.due){const n=wdays(addD(t.due,1),TODAY);DB.delays.push({id:'DL'+(DB.delays.length+1),task:id,project:t.project,date:TODAY,resp:t.who,affected:DB.tasks.filter(x=>x.deps.includes(id)).map(x=>x.who),cause:'Late delivery',days:n,note:'Auto-recorded: completed after due date.',by:'system',status:'Resolved'})}
  act(t.project,'done',`completed “${t.title}” (+${tpts(t)} pts).`,t.who);closeModal();rerender();toast(isGuest(t.who)?'Deliverable approved':`Done · +${tpts(t)} points`,'circle-check');

function editTag(c){

    <div class="flex items-center justify-between mt-5 mb-2"><div><div class="font-semibold text-sm">Levels and points</div><div class="text-xs muted">Level 1 is the easiest. One level is fine for a tag with a fixed value.</div></div><button type="button" class="btn btn-ghost" onclick="tagLevelAdd()">${ic('plus')}Add level</button></div>

function tagLevelsRead(){S.tagDraft.levels=S.tagDraft.levels.map((l,i)=>({name:$('#tgl-n'+i)?.value??l.name,pts:+($('#tgl-p'+i)?.value??l.pts)}))}
function tagLevelsRender(){
  const L=S.tagDraft.levels;
  $('#tg-levels').innerHTML=`<div class="mw-repeater">${L.map((l,i)=>`<div class="mw-repeater__row"><span class="mw-repeater__n">L${i+1}</span><input id="tgl-n${i}" class="input" value="${esc(l.name)}" placeholder="Level name" aria-label="Level ${i+1} name"><input id="tgl-p${i}" class="input tnum" type="number" min="0" value="${l.pts}" aria-label="Level ${i+1} points" style="width:96px"><span class="text-xs muted">pts</span>${ib('arrow-up','Move up',`tagLevelMove(${i},-1)`,'',i===0)}${ib('arrow-down','Move down',`tagLevelMove(${i},1)`,'',i===L.length-1)}${ib('trash-2','Remove level',`tagLevelDel(${i})`,'bad',L.length===1)}</div>`).join('')}</div>`;icons();
}
function tagLevelAdd(){tagLevelsRead();const L=S.tagDraft.levels,last=L[L.length-1];L.push({name:'',pts:last?last.pts+1:1});tagLevelsRender();$('#tgl-n'+(L.length-1))?.focus()}
function tagLevelDel(i){tagLevelsRead();if(S.tagDraft.levels.length>1){S.tagDraft.levels.splice(i,1);tagLevelsRender()}}
function tagLevelMove(i,d){tagLevelsRead();const L=S.tagDraft.levels,j=i+d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];tagLevelsRender()}
function saveTag(){
  tagLevelsRead();const D=S.tagDraft,code=(D.orig||val('tg-code')).trim().toUpperCase();
  if(!/^[A-Z][A-Z0-9]{0,2}$/.test(code)){toast('Code is 1–3 letters or digits, starting with a letter','circle-alert');return}
  if(!D.orig&&tag(code)){toast(`Tag ${code} already exists`,'circle-alert');return}
  if(!val('tg-n')){toast('Name is required','circle-alert');return}
  if(D.levels.some(l=>!l.name.trim()||!(l.pts>=0))){toast('Every level needs a name and points of 0 or more','circle-alert');return}
  const o={name:val('tg-n'),range:val('tg-r'),color:val('tg-c'),desc:val('tg-d'),levels:D.levels.map(l=>({name:l.name.trim(),pts:+l.pts}))};
  if(D.orig){Object.assign(tag(code),o);DB.tasks.filter(x=>x.tag===code&&x.level>o.levels.length).forEach(x=>x.level=o.levels.length)}else DB.tags.push({code,...o});
  closeModal();rerender();toast(D.orig?'Tag updated':`Tag ${code} added`,'tags');
}
// Delete: if tasks use the tag, move them to another tag first (level kept where it exists).
function delTag(c){
  const t=tag(c),n=DB.tasks.filter(x=>x.tag===c).length,others=DB.tags.filter(x=>x.code!==c);
  if(!others.length){toast('Keep at least one tag','circle-alert');return}
  openModal({title:`Delete ${c} · ${t.name}?`,icon:'trash-2',size:'sm',body:n?`<p class="text-sm"><b>${n} task${n===1?'':'s'}</b> use this tag. Move them to another tag, then delete.</p><div class="mt-3">${fld('Move tasks to',sel('tg-move',others.map(x=>[x.code,x.code+' · '+x.name])))}</div><p class="text-xs muted mt-2">Tasks keep their level where the new tag has it, otherwise they take its highest level. Points already counted in closed KPI periods don't change.</p>`:`<p class="text-sm">Delete tag <b>${esc(c)}</b>? No tasks use it.</p>`,
    foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="doDelTag('${c}')">${ic('trash-2')}${n?'Move and delete':'Delete'}</button>`});

function doDelTag(c){
  const to=$('#tg-move')?.value;if(to){const tt=tag(to);DB.tasks.filter(x=>x.tag===c).forEach(x=>{x.tag=to;x.level=Math.min(x.level,tt.levels.length)})}
