<!doctype html>
<html lang="en" data-layout="meridian" data-sb="open">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meridian Workforce</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
/* Meridian Workforce mockup: one fixed design (option 6). Tokens below; structure from the original mockup. */
:root{
  /* Meridian Workforce, design option 6: Atlas layout + Straits colours (owner decision, 2026-11-05). */
  --font-head:'Plus Jakarta Sans',system-ui,sans-serif; --font-body:'Plus Jakarta Sans',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --bg:#EFF4F3; --surface:#fff; --surface-2:#F4F8F7; --ink:#12302F; --muted:#4F6E6C; --line:#D6E2E0; --line-strong:#9DB7B3;
  --accent:#0B5D5E; --accent-ink:#fff; --accent-soft:#E1EFEC; --hi:#D9583B;
  --cta:#B9452B; --cta-ink:#fff; --deep:#0B3B3B;
  --ok:#0F7A5C; --warn:#A8620A; --bad:#C2372D; --info:#1F6FB2;
  --sb-bg:#fff; --sb-ink:#12302F; --sb-muted:#4F6E6C; --sb-line:#E1EBE9; --sb-active-bg:#E1EFEC; --sb-active-ink:#0B5D5E; --sb-mark:#0B5D5E;
  --radius:16px; --bw:1px; --shadow:0 1px 2px rgba(11,59,59,.06),0 10px 28px -20px rgba(11,59,59,.28); --btn-shadow:none;
  --tip-bg:#0B3B3B; --tip-ink:#fff; --sb-w:264px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;-webkit-font-smoothing:antialiased}
h1,h2,h3,.head{font-family:var(--font-head);text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--font-mono)}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100%}
.sidebar{width:var(--sb-w);flex:none;background:var(--sb-bg);color:var(--sb-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;z-index:40;transition:transform .25s}
.sb-head{display:flex;align-items:center;gap:12px;padding:20px 18px 16px;border-bottom:1px solid var(--sb-line)}
.sb-logo{width:38px;height:38px;border-radius:calc(var(--radius)*.7);display:grid;place-items:center;background:var(--sb-mark);color:#1b1f5e;flex:none}
.sb-logo svg{width:20px;height:20px}
.sb-title{font-family:var(--font-head);font-size:17px;font-weight:800;line-height:1.1}
.sb-sub{font-size:11px;color:var(--sb-muted);letter-spacing:.08em;text-transform:uppercase}
.sb-body{flex:1;overflow-y:auto;padding:10px 12px 16px}
.sb-group{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sb-muted);padding:16px 10px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:calc(var(--radius)*.6);color:var(--sb-ink);opacity:.82;font-weight:500;position:relative;text-align:left}
.nav-item svg{width:18px;height:18px;flex:none}
.nav-item:hover{opacity:1;background:var(--sb-line)}
.nav-item.active{opacity:1;background:var(--sb-active-bg);color:var(--sb-active-ink);font-weight:600}
.sb-foot{border-top:1px solid var(--sb-line);padding:14px;display:flex;align-items:center;gap:10px}
.sb-foot .icon-btn{color:var(--sb-muted)}
.sb-foot .icon-btn:hover{background:var(--sb-line);color:var(--sb-ink)}
/* plum: icon rail */
html[data-layout="meridian"][data-sb="rail"] .sb-text,html[data-layout="meridian"][data-sb="rail"] .nav-label,html[data-layout="meridian"][data-sb="rail"] .sb-group span{display:none}
html[data-layout="meridian"][data-sb="rail"] .sb-group{padding:10px 0 4px;text-align:center}
html[data-layout="meridian"][data-sb="rail"] .sb-group::after{content:"";display:block;margin:0 auto;width:20px;border-top:1px solid var(--sb-line)}
html[data-layout="meridian"][data-sb="rail"] .sb-head{justify-content:center;padding:18px 0}
html[data-layout="meridian"][data-sb="rail"] .nav-item{justify-content:center;padding:11px 0;border-radius:14px}
html[data-layout="meridian"][data-sb="rail"] .sb-foot{flex-direction:column;padding:12px 0}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
@media(min-width:1024px){.topbar{padding-left:28px;padding-right:28px}}
.crumb{font-size:12px;color:var(--muted)}
.page-title{font-size:22px;font-weight:800;line-height:1.15}
.view{padding:8px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));width:100%}
@media(min-width:1024px){.view{padding:12px 28px 48px}}

/* ---------- components ---------- */
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-title{font-family:var(--font-head);font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:calc(var(--radius)*.6);font-weight:600;font-size:13px;border:var(--bw) solid transparent;white-space:nowrap;transition:transform .12s,background .15s;box-shadow:var(--btn-shadow)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--accent-soft)}
.btn-danger{background:var(--bad);color:#fff}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:calc(var(--radius)*.5);color:var(--muted);border:1px solid transparent;flex:none;transition:background .15s,color .15s}
.icon-btn svg{width:16px;height:16px}
.icon-btn:hover{background:var(--accent-soft);color:var(--ink)}
.icon-btn.ok:hover{color:var(--ok)} .icon-btn.bad:hover{color:var(--bad)} .icon-btn.acc{color:var(--accent)}
.icon-btn[disabled]{opacity:.3;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;--t:var(--muted);color:var(--t);background:color-mix(in srgb,var(--t) 13%,transparent)}
.chip svg{width:12px;height:12px}
.chip.ok{--t:var(--ok)}.chip.warn{--t:var(--warn)}.chip.bad{--t:var(--bad)}.chip.info{--t:var(--info)}.chip.acc{--t:var(--accent)}.chip.hi{--t:var(--hi)}
html[data-layout="meridian"] .chip.acc{--t:var(--accent)}
.input{width:100%;height:40px;padding:0 12px;border-radius:calc(var(--radius)*.55);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);font-size:14px}
textarea.input{height:auto;padding:10px 12px;min-height:84px;resize:vertical}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--muted)}
.fld>span b{color:var(--bad)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:12px 14px;border-bottom:var(--bw) solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.actions{display:flex;gap:2px;justify-content:flex-end}
.av{display:inline-grid;place-items:center;border-radius:999px;font-weight:700;flex:none;font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);border:var(--bw) solid var(--line);background:var(--surface);display:inline-flex;gap:6px;align-items:center}
.tab .n{font-size:11px;padding:0 6px;border-radius:999px;background:var(--surface-2)}
.tab.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tab.on .n{background:color-mix(in srgb,var(--surface) 20%,transparent)}
.kpi .num{font-family:var(--font-head);font-size:34px;font-weight:800;line-height:1}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line-strong);transition:.2s}
.switch span::after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:disabled+span{opacity:.5}

/* overlays */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(10,12,28,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:560px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--surface);border-radius:var(--radius);border:var(--bw) solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:pop .18s ease-out}
.modal.lg{max-width:820px}.modal.sm{max-width:420px}
.modal-h{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-b{padding:20px;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--radius) var(--radius)}
.drawer-wrap{position:fixed;inset:0;z-index:70;background:rgba(10,12,28,.35)}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:var(--bw) solid var(--line);display:flex;flex-direction:column;animation:slide .22s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--tip-bg);color:var(--tip-ink);font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:6px;white-space:nowrap;box-shadow:0 6px 16px -6px rgba(0,0,0,.4)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:110;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:pop .2s}
.toast svg{width:16px;height:16px}
.dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:13.5px}
.dl dt{color:var(--muted)}
.dl dd{min-width:0;overflow-wrap:anywhere}
.sec-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 10px;display:flex;gap:8px;align-items:center}
.sec-h svg{width:14px;height:14px}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl{position:relative;padding-bottom:14px}
.tl::before{content:"";position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--tl,var(--accent))}

/* org chart */
.org-scroll{overflow:auto;padding:24px;max-height:calc(100dvh - 220px)}
.tree{display:inline-block;min-width:100%;transform-origin:top center;padding:8px}
.tree ul{padding-top:26px;position:relative;display:flex;justify-content:center}
.tree>ul{padding-top:0}
.tree li{list-style:none;position:relative;padding:26px 7px 0;display:flex;flex-direction:column;align-items:center}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;border-top:2px solid var(--line-strong);width:50%;height:26px}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--line-strong)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree>ul>li{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:2px solid var(--line-strong);border-radius:0 8px 0 0}
.tree li:first-child::after{border-radius:8px 0 0 0}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;border-left:2px solid var(--line-strong);height:26px}
.org-node{width:176px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:calc(var(--radius)*.8);padding:12px 10px 10px;text-align:center;position:relative;box-shadow:var(--shadow);overflow:hidden}
.org-node .strip{position:absolute;left:0;right:0;top:0;height:4px}
.org-node .nm{font-weight:700;font-size:13px;line-height:1.2;margin-top:6px}
.org-node .ps{font-size:11.5px;color:var(--muted);margin-top:2px}
.org-node .crown{position:absolute;top:8px;right:8px;color:var(--hi)}
.org-node .crown svg{width:14px;height:14px}

/* login */
.login{height:100dvh;min-height:100dvh;max-height:100dvh;overflow:hidden;display:grid;grid-template-columns:1fr}
@media(min-width:960px){.login{grid-template-columns:1.1fr 1fr}}
.login-art{background:var(--sb-bg);color:var(--sb-ink);padding:40px;display:none;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
@media(min-width:960px){.login-art{display:flex}}
.otp{width:46px;height:54px;text-align:center;font-size:22px;font-weight:700;padding:0}

/* sidebar: labelled by default, icon rail when collapsed (desktop) */
html[data-sb="rail"]{--sb-w:84px}
.sb-tog-wrap{padding:6px 12px;border-top:1px solid var(--sb-line)}
.sb-toggle{color:var(--sb-muted)}
.sb-toggle .when-rail{display:none}
html[data-sb="rail"] .sb-toggle .when-open{display:none}
html[data-sb="rail"] .sb-toggle .when-rail{display:inline-flex}
html[data-sb="rail"] .sb-tog-wrap{padding:6px 0;display:flex;justify-content:center}
@media(max-width:1023px){.sb-tog-wrap{display:none}}
/* login: fixed to the window; the demo account list scrolls */
.acct-list{max-height:clamp(150px,calc(100dvh - 560px),440px);overflow-y:auto;padding-right:4px}
/* scrollbars: themed and visible (thumb at least 3:1 against the background) */
*{scrollbar-width:thin;scrollbar-color:#6F8E8A #E1EBE9}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#E1EBE9;border-radius:10px}
::-webkit-scrollbar-thumb{background:#6F8E8A;border-radius:10px;border:2px solid #E1EBE9}
::-webkit-scrollbar-thumb:hover{background:#4F6E6C}
::-webkit-scrollbar-corner{background:transparent}
.sidebar ::-webkit-scrollbar-track,.sidebar ::-webkit-scrollbar-thumb{border-color:var(--sb-bg)}
.login-art ::-webkit-scrollbar-thumb{background:#7FA8A2}
/* org chart: department board */
.org-board{padding:20px 20px 28px}
.org-top{display:flex;flex-direction:column;align-items:center}
.org-top .stem{width:1px;height:22px;background:var(--line-strong)}
.org-person{display:flex;align-items:center;gap:12px;padding:12px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);text-align:left}
.org-person .t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.org-divider{display:flex;align-items:center;gap:14px;margin:22px 0 18px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.org-divider::before,.org-divider::after{content:"";flex:1;border-top:1px solid var(--line)}
.dept-cols{columns:5 250px;column-gap:16px}
.dept-card{break-inside:avoid;margin-bottom:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.dept-card>header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.dept-card>header b{font-family:var(--font-head);font-size:15px}
.dept-hod{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.dept-hod .t{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.grp-label{display:flex;align-items:center;gap:10px;padding:10px 16px 2px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.grp-label::after{content:"";flex:1;border-top:1px solid var(--line)}
.mem{display:flex;align-items:center;gap:10px;padding:6px 16px;font-size:13px}
.mem .lv{margin-left:auto;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.mem:last-child{padding-bottom:12px}
.pic{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:#8A2F17;background:#FBE3DB;border-radius:6px;padding:1px 6px}
/* ================= mw- component classes =================
   Every shell element and component has a stable, Bootstrap-style class: mw-<block>,
   mw-<block>__<element>, mw-<block>--<modifier>. Utility classes are only for small
   layout tweaks. The full list is in docs/design/components.md. */
.mw-profile-card{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:6px;margin:-6px;border-radius:12px;color:inherit;text-decoration:none}
.mw-profile-card:hover{background:var(--sb-active-bg)}
.mw-profile-card.is-active{background:var(--sb-active-bg);box-shadow:inset 0 0 0 1px var(--accent)}
.mw-profile-card__name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw-profile-card__role{font-size:12px;color:var(--sb-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-sb="rail"] .mw-profile-card{flex:none;justify-content:center;margin:0}
.mw-sidebar__version{font-size:10.5px;color:var(--sb-muted);padding:0 16px 10px;letter-spacing:.04em}
html[data-sb="rail"] .mw-sidebar__version{padding:0 0 10px;text-align:center}
.mw-lang-switch{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.mw-lang-switch__opt{height:30px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}
.mw-lang-switch__opt.is-active{background:var(--accent);color:#fff}
.mw-lang-switch--floating{position:absolute;top:16px;right:16px;z-index:5}
.mw-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.mw-tabs__item{height:38px;padding:0 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:8px}
.mw-tabs__item.is-active{background:var(--deep);color:#fff;border-color:var(--deep)}
.mw-tabs__item .mw-dot{width:8px;height:8px;border-radius:50%;background:var(--hi)}
.mw-section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.mw-section__title{font-family:var(--font-head);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.mw-section__hint{font-size:12.5px;color:var(--muted);margin-top:2px}
.mw-form-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:16px}
.mw-field__readonly{height:38px;display:flex;align-items:center;padding:0 12px;border-radius:10px;background:var(--surface-2);border:1px dashed var(--line);color:var(--muted);font-size:13px}
.mw-avatar-editor{display:flex;align-items:center;gap:16px;margin-top:14px}
.mw-official-photo{display:flex;gap:14px;align-items:center;padding:14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);margin-top:14px}

.qsel button:hover{border-style:solid;color:var(--ink);background:var(--accent-soft)}
.phases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ph{padding:10px 12px;border-radius:calc(var(--radius)*.6);background:var(--surface-2);border:var(--bw) solid var(--line);min-width:0}
.ph .n{font-size:11px;color:var(--muted)}
.ph.done{background:color-mix(in srgb,var(--ok) 12%,var(--surface));border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.ph.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ph.now .n{color:inherit;opacity:.8}
@media(max-width:640px){.phases{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gantt{min-width:860px;position:relative}
.g-row{display:grid;grid-template-columns:260px 1fr;align-items:stretch;border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-label{padding:8px 14px;min-width:0;display:flex;align-items:center;gap:8px}
.g-track{position:relative;min-height:46px}
.g-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.g-bar{position:absolute;top:13px;height:20px;border-radius:6px;display:flex;align-items:center;padding:0 6px;font-size:10.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;cursor:pointer;min-width:6px}
.g-bar .fill{position:absolute;inset:0;right:auto;background:rgba(255,255,255,.28)}
.g-bar span{position:relative}
.g-over{position:absolute;top:13px;height:20px;border-radius:0 6px 6px 0;background:repeating-linear-gradient(45deg,var(--bad),var(--bad) 4px,color-mix(in srgb,var(--bad) 55%,transparent) 4px,color-mix(in srgb,var(--bad) 55%,transparent) 8px)}

.g-dep{position:absolute;top:0;width:8px;height:8px;border-radius:50%;background:var(--warn);border:2px solid var(--surface);z-index:2}

  : `<span class="av" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.36)}px;background:hsl(${hue(name)} 62% 86%);color:hsl(${hue(name)} 50% 26%)">${initials(name)}</span>`; };

const fld = (label,inner,cls='',req=false) => `<label class="fld ${cls}"><span>${label}${req?' <b>*</b>':''}</span>${inner}</label>`;
const inp = (id,val='',type='text',ph='',extra='') => `<input id="${id}" class="input" type="${type}" value="${esc(val)}" placeholder="${esc(ph)}" ${extra}>`;
const sel = (id,opts,val,extra='') => `<select id="${id}" class="input" ${extra}>${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v==val?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;
const txt = (id,val='',ph='',rows=3) => `<textarea id="${id}" class="input" rows="${rows}" placeholder="${esc(ph)}">${esc(val)}</textarea>`;

const nextId = (arr,p) => p+String(Math.max(0,...arr.map(x=>+String(x.id).replace(/\D/g,'')||0))+1).padStart(2,'0');
const icons = () => window.lucide && lucide.createIcons();
const me = () => S.user?.eid ? emp(S.user.eid) : null;
const isHR = () => ['sysadmin','hr','exec'].includes(S.user?.roleKey);
const reportsOf = id => DB.employees.filter(e=>e.reports===id).flatMap(e=>[e.id,...reportsOf(e.id)]);
function scope(){ // employees the current user manages
  const r=S.user.roleKey;
  if(['sysadmin','hr','exec'].includes(r)) return DB.employees.map(e=>e.id);
  const ids=new Set(reportsOf(S.user.eid));
  if(r==='lead') DB.teams.filter(t=>t.lead===S.user.eid).forEach(t=>t.members.forEach(m=>{ids.add(m);reportsOf(m).forEach(x=>ids.add(x))}));
  DB.departments.filter(d=>d.head&&d.head===S.user.eid).forEach(d=>DB.employees.filter(e=>e.dept===d.name).forEach(e=>ids.add(e.id)));
  ids.delete(S.user.eid);return [...ids];
}
const canEdit = id => isHR() || scope().includes(id);
const can = r => { if(!S.user)return false; const a=ACCESS[S.user.roleKey]; if(a!=='*'&&!a.includes(r))return false;
  if(r==='employees'&&S.user.roleKey==='staff') return reportsOf(S.user.eid).length>0; return true; };

function toast(msg,icon='circle-check'){

/* tooltip */
const tipEl = document.getElementById('tip');
document.addEventListener('mouseover',e=>{
  const t=e.target.closest('[data-tip]');
  if(!t){tipEl.hidden=true;return}
  if(t.closest('.sidebar')&&document.documentElement.dataset.sb!=='rail'&&innerWidth>=1024){tipEl.hidden=true;return}
  tipEl.textContent=t.dataset.tip;tipEl.hidden=false;
  const r=t.getBoundingClientRect(),tw=tipEl.offsetWidth,th=tipEl.offsetHeight;
  let x,y;
  if(t.closest('.sidebar') && document.documentElement.dataset.sb==='rail' && innerWidth>=1024){x=r.right+10;y=r.top+r.height/2-th/2}
  else{x=r.left+r.width/2-tw/2;y=r.top-th-8;if(y<8)y=r.bottom+8}
  tipEl.style.left=Math.max(8,Math.min(x,innerWidth-tw-8))+'px';tipEl.style.top=y+'px';
});
document.addEventListener('scroll',()=>tipEl.hidden=true,true);
document.addEventListener('click',()=>tipEl.hidden=true);

function picker(name,{selected=[],pool=DB.employees.map(e=>e.id),lead=null,quick=true,single=false}={}){
  const rows=pool.map(id=>{const e=emp(id);if(!e)return'';const k=`${e.name} ${e.pos} ${e.dept} ${des(e.desig).name} ${e.no}`.toLowerCase();
    return `<div class="check-row pk-row" data-k="${esc(k)}" data-d="${esc(e.dept)}">
      <label><input type="${single?'radio':'checkbox'}" name="${name}" value="${e.id}" ${selected.includes(e.id)?'checked':''} onchange="pickCount('${name}')">${av(e.name,26)}
      <span class="min-w-0 flex-1"><span class="block text-sm font-semibold truncate">${esc(e.name)}</span><span class="block text-xs muted truncate">${esc(e.pos)} · ${des(e.desig).name} · ${esc(e.dept)}</span></span></label>
      ${lead!==null?`<label class="!flex-none" data-tip="Set as lead" style="color:var(--hi)"><input type="radio" name="${name}-lead" value="${e.id}" ${lead===e.id?'checked':''}>${ic('crown','w-4 h-4')}</label>`:''}
      ${DB.teams.some(t=>t.lead===e.id)&&lead===null?`<span data-tip="Group PIC" style="color:var(--hi)">${ic('crown','w-4 h-4')}</span>`:''}
    </div>`}).join('');
  const depts=[...new Set(pool.map(id=>emp(id)?.dept).filter(Boolean))];
  return `<div class="picker" id="pk-${name}">
    <div class="flex gap-2 mb-2 flex-wrap"><div class="input flex items-center gap-2 flex-1" style="min-width:200px"><span class="muted">${ic('search','w-4 h-4')}</span><input class="flex-1 bg-transparent outline-none min-w-0" placeholder="Search name, position, department, staff no…" oninput="filterPicker('${name}')" id="pk-${name}-q" autocomplete="off"></div>
    ${sel(`pk-${name}-d`,[['','All departments'],...depts],'',`onchange="filterPicker('${name}')" style="width:180px"`)}</div>
    ${quick&&!single?`<div class="qsel"><button type="button" onclick="pickAll('${name}',true,'*')">+ Everyone</button>${depts.map(d=>`<button type="button" onclick="pickAll('${name}',true,'${esc(d)}')">+ ${esc(d)}</button>`).join('')}</div>`:''}
    <div class="flex justify-between text-xs mb-2"><span class="muted"><b id="pk-${name}-n" style="color:var(--ink)">${selected.length}</b> selected</span>${single?'':`<span class="flex gap-3 font-semibold" style="color:var(--accent)"><a href="javascript:pickAll('${name}',true)">Select visible</a><a href="javascript:pickAll('${name}',false)">Clear</a></span>`}</div>
    <div class="grid sm:grid-cols-2 gap-2 max-h-72 overflow-y-auto pr-1">${rows}</div><p class="muted text-sm py-4 text-center" id="pk-${name}-empty" hidden>No one matches that search.</p></div>`;
}
function filterPicker(n){
  const q=val(`pk-${n}-q`).toLowerCase(),d=val(`pk-${n}-d`);let shown=0;
  $$(`#pk-${n} .pk-row`).forEach(r=>{const ok=(!q||q.split(/\s+/).every(w=>r.dataset.k.includes(w)))&&(!d||r.dataset.d===d);r.hidden=!ok;if(ok)shown++});
  $(`#pk-${n}-empty`).hidden=shown>0;
}
function pickAll(n,on,dept){
  $$(`#pk-${n} .pk-row`).forEach(r=>{const cb=r.querySelector(`input[name="${n}"]`);
    if(!on){cb.checked=false;return}
    if(dept==='*'||(dept?r.dataset.d===dept:!r.hidden))cb.checked=true;});
  pickCount(n);
}
const pickCount = n => {const el=$(`#pk-${n}-n`);if(el)el.textContent=$$(`input[name="${n}"]:checked`).length};
const picked = n => $$(`input[name="${n}"]:checked`).map(x=>x.value);
const pickedLead = n => $(`input[name="${n}-lead"]:checked`)?.value;

/* photo upload */
const photoField = (cur,name='') => `<div class="photo-up"><div class="ph-prev" id="ph-prev">${cur?`<img src="${cur}" alt="">`:name?av(name,68):ic('camera','w-6 h-6 muted')}</div>
  <div class="flex flex-col gap-1"><label class="btn btn-ghost h-9 cursor-pointer">${ic('upload')}Upload photo<input type="file" accept="image/*" class="sr-only" onchange="readPhoto(this)"></label><span class="text-xs muted">JPG/PNG, square works best. Use the same photo as in the resume.</span></div></div>`;
function readPhoto(inp){
  const f=inp.files[0];if(!f)return;if(f.size>3e6){toast('Image must be under 3 MB','circle-alert');return}
  const r=new FileReader();r.onload=()=>{
    const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),s=240,m=Math.min(img.width,img.height);c.width=c.height=s;
      c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);S.tmpPhoto=c.toDataURL('image/jpeg',.85);$('#ph-prev').innerHTML=`<img src="${S.tmpPhoto}" alt="">`};
    img.src=r.result};r.readAsDataURL(f);
}

function navBadge(id){
  if(id==='mytasks'){const n=myTasks().filter(t=>t.status!=='Done'&&needsCheckin(t)).length;return n?[n,'warn']:null}
  if(id==='projects'){const n=pendingApprovals().length;return n?[n,'bad']:null}
  if(id==='review'){const n=Object.values(DB.review.items).filter(x=>x.st==='Submitted').length;return n?[n,'hi']:null}
  return null;
}

function globalSearch(q){
  q=q.toLowerCase().trim();if(!q)return;
  const e=DB.employees.find(x=>(x.name+x.no).toLowerCase().includes(q));
  if(e&&(isHR()||scope().includes(e.id))){viewEmployee(e.id);return}
  const c=DB.candidates.find(x=>(x.name+x.idNo).toLowerCase().includes(q));
  if(c&&can('candidates')){viewCandidate(c.id);return}
  const t=DB.tasks.find(x=>x.title.toLowerCase().includes(q));
  if(t){viewTask(t.id);return}
  toast('Nothing matched "'+q+'"','search-x');
}
function showNotifs(){
  const items=[];
  pendingApprovals().forEach(({t,x})=>items.push(['clock-alert','bad',`${ename(x.by)} requests +${x.days} days on “${t.title}”`,`viewTask('${t.id}')`]));
  myTasks().filter(t=>t.status!=='Done'&&needsCheckin(t)).forEach(t=>items.push(['message-square-warning','warn',`Check-in due: ${t.title}`,`checkin('${t.id}')`]));
  DB.employees.filter(e=>e.probEnd&&days(e.probEnd)<=14&&isHR()).forEach(e=>items.push(['hourglass','warn',`${e.name}: probation ends ${fmtS(e.probEnd)}`,`viewEmployee('${e.id}')`]));
  if(me()&&DB.review.items[me().id]?.st!=='Approved'&&DB.review.items[me().id]?.st!=='Submitted')items.push(['clipboard-pen','hi',`Confirm your personal details for ${DB.review.year}`,`location.hash='profile'`]);

}

/* =================== MY PROFILE (self-service + annual review) =================== */
function submitProfile(){
  const m=me();if(!$('#p-ok').checked){toast('Tick the confirmation box first','circle-alert');return}
  const ch=[];const cmp=(l,o,n)=>{if((o||'')!==(n||''))ch.push([l,o||'—',n])};
  cmp('Mobile',m.phone,val('p-phone'));cmp('Home address',m.address,val('p-addr'));cmp('Emergency contact name',m.ec.name,val('p-ecn'));cmp('Emergency relationship',m.ec.rel,val('p-ecr'));cmp('Emergency contact phone',m.ec.phone,val('p-ecp'));cmp('Personal email',m.pmail,val('p-pmail'));cmp('Marital status',m.marital||'Single',val('p-mar'));
  if(S.tmpPhoto){m.photo=S.tmpPhoto;S.tmpPhoto=null;ch.push(['Profile photo','old','updated'])}
  const real=ch.filter(c=>c[0]!=='Profile photo');
  DB.review.items[m.id]=real.length?{st:'Submitted',on:TODAY,changes:real}:{st:'Approved',on:TODAY};
  if(!real.length)m.infoUpdated=TODAY;
  rerender();toast(real.length?`${real.length} change(s) sent to HR`:'Confirmed, no changes','send');
}

function editDept(id){
  const d=id?DB.departments.find(x=>x.id===id):{name:'',color:'#0ea5e9',head:'',kind:'Delivery'};
  openModal({title:id?'Edit department':'Add department',icon:'building-2',body:`<div class="grid sm:grid-cols-2 gap-4">${fld('Name',inp('dp-n',d.name,'text','e.g. QA Team'),'sm:col-span-2',true)}${fld('Type',sel('dp-k',['Delivery','Support'],d.kind))}${fld('Colour',inp('dp-c',d.color,'color','','style="padding:4px"'))}${fld('Head of department',sel('dp-h',[['','— None —'],...DB.employees.map(e=>[e.id,e.name])],d.head),'sm:col-span-2')}</div>`,
    foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveDept('${id||''}')">${ic('check')}Save</button>`});

function saveDept(id){
  const o={name:val('dp-n'),kind:val('dp-k'),color:val('dp-c'),head:val('dp-h')};if(!o.name){toast('Name is required','circle-alert');return}
  if(id){const d=DB.departments.find(x=>x.id===id),old=d.name;Object.assign(d,o);if(old!==o.name){[...DB.employees,...DB.teams,...DB.vacancies].forEach(x=>{if(x.dept===old)x.dept=o.name})}}
  else DB.departments.push({id:'DP'+Date.now(),...o});
  closeModal();rerender();toast('Department saved','building-2');
}
function delDept(id){const d=DB.departments.find(x=>x.id===id),n=DB.employees.filter(e=>e.dept===d.name).length;
  if(n){openModal({title:'Cannot delete yet',icon:'building-2',size:'sm',body:`<p><b>${esc(d.name)}</b> still has ${n} employee(s). Move them to another department first.</p>`,foot:`<button class="btn btn-primary" onclick="closeModal()">OK</button>`});return}
  confirmBox('Delete department?',`Delete <b>${esc(d.name)}</b>?`,'Delete',`DB.departments=DB.departments.filter(x=>x.id!=='${id}');closeModal();rerender();toast('Deleted','trash-2')`)}

function collectCand(vid,source){
  const req=['a-id','a-name','a-gender','a-dob','a-email','a-phone','a-sal','a-ecn','a-ecp'],miss=req.filter(r=>!val(r));
  req.forEach(r=>$('#'+r).style.borderColor=miss.includes(r)?'var(--bad)':'');
  if(miss.length){toast(`Fill in ${miss.length} required field(s)`,'circle-alert');$('#'+miss[0]).focus();return null}
  const idt=$('input[name=idt]:checked').value,idNo=val('a-id').toUpperCase();
  if(DB.candidates.find(c=>c.idNo===idNo&&c.vacancy===vid&&!['Hired','Disqualified'].includes(c.stage))){toast('An active application already exists for this ID and role','circle-alert');return null}
  const former=!!DB.alumni.find(a=>a.idNo===idNo)||DB.employees.some(e=>e.idNo===idNo);
  const c={id:'C'+String(DB.candidates.length+1).padStart(3,'0'),ref:'APP-2026-'+String(37+DB.candidates.length).padStart(4,'0'),name:val('a-name'),idType:idt,idNo,gender:val('a-gender'),dob:val('a-dob'),nationality:val('a-nat')||'—',email:val('a-email'),phone:val('a-phone'),address:val('a-addr')||'—',
    edu:{level:val('a-edu'),inst:val('a-inst')||'—',field:val('a-field')||'—',year:val('a-year')||'—'},exp:+val('a-exp')||0,expected:+val('a-sal'),notice:val('a-notice'),emergency:{name:val('a-ecn'),rel:val('a-ecr'),phone:val('a-ecp')},vacancy:vid||null,stage:'Applied',applied:TODAY,former,source,photo:S.tmpPhoto};
  DB.candidates.unshift(c);S.tmpPhoto=null;return c;
}

function scheduleInterview(cid,iid,round){
  const it=iid?DB.interviews.find(x=>x.id===iid):null;
  const pool=DB.candidates.filter(c=>!['Hired','Disqualified'].includes(c.stage));
  const c0=cid?cand(cid):pool[0],v=cvac(c0);
  const prev=DB.interviews.filter(i=>i.cand===c0.id),r=it?.round||round||prev.length+1;
  const sugg=[v.manager,...DB.teams.filter(t=>t.dept===v.dept).map(t=>t.lead)];
  const sel0=it?it.panel:(prev.at(-1)?.panel||sugg);
  openModal({title:it?'Reschedule interview':`Schedule interview · Round ${r}`,icon:'calendar-plus',size:'lg',body:`
    ${prev.length&&!it?`<div class="banner mb-4" style="padding:10px 14px"><span class="text-sm">${ic('history','w-4 h-4 inline')} ${prev.length} previous round(s): ${prev.map(p=>`R${p.round} ${p.kind} (${p.result})`).join(', ')}</span></div>`:''}
    <div class="grid sm:grid-cols-2 gap-4">
    ${fld('Candidate',sel('i-c',pool.map(c=>[c.id,`${c.name} — ${cvac(c).title}`]),c0.id),'sm:col-span-2',true)}
    ${fld('Round',inp('i-r',r,'number','','min="1"'))}${fld('Interview type',sel('i-k',['HR screening','Technical','Practical test','Culture fit','Management','Final / offer discussion'],it?.kind||(r===1?'HR screening':r===2?'Technical':'Management')))}
    ${fld('Date',inp('i-d',it?.date||addD(TODAY,2),'date'),'',true)}${fld('Time',inp('i-t',it?.time||'10:00','time'),'',true)}
    ${fld('Mode',sel('i-m',['Google Meet','Microsoft Teams','Onsite','Phone'],it?.mode||'Google Meet'))}${fld('Location / link',inp('i-w',it?.where||'','text','Auto-generate meeting link'))}
  </div>
  <div class="sec-h">${ic('users')}Invite panel</div>${picker('panel',{selected:sel0,pool:DB.employees.filter(e=>des(e.desig).level>=2).map(e=>e.id),quick:false})}
  <label class="check-row mt-3"><input type="checkbox" checked> Email calendar invite (.ics) to candidate and panel</label>`,
  foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveInterview('${iid||''}')">${ic('send')}${iid?'Update & notify':'Schedule & invite'}</button>`});
}
function saveInterview(iid){
  const panel=picked('panel');if(!panel.length){toast('Pick at least one panel member','circle-alert');return}
  const m=val('i-m'),o={cand:val('i-c'),round:+val('i-r')||1,kind:val('i-k'),date:val('i-d'),time:val('i-t'),mode:m,where:val('i-w')||(m==='Onsite'?'Level 8, Meeting Room Cendana':m==='Phone'?cand(val('i-c')).phone:'meet.google.com/new-'+Math.random().toString(36).slice(2,6)),panel,result:'Scheduled'};
  if(iid)Object.assign(DB.interviews.find(x=>x.id===iid),o);else DB.interviews.push({id:'I'+String(DB.interviews.length+1).padStart(3,'0'),...o});
  cand(o.cand).stage='Interview';closeModal();rerender();toast(`Round ${o.round} scheduled · invites sent to ${panel.length+1}`,'send');
}
function recordResult(iid){
  const i=DB.interviews.find(x=>x.id===iid),c=cand(i.cand),v=cvac(c);
  const opts=[['Qualified','circle-check','Proceed to offer'],['Next round','arrow-right-circle','Schedule another round'],['On hold','pause-circle','Keep in view'],['Disqualified','circle-x','Reject with remarks'],['No show','user-x','Candidate did not attend']];
  openModal({title:`Record result · Round ${i.round}`,icon:'clipboard-check',body:`<p class="mb-4"><b>${esc(c.name)}</b> · ${esc(v.title)} · ${i.kind} · ${fmt(i.date)}</p>
    <div class="grid sm:grid-cols-2 gap-2 mb-4">${opts.map(([o,icn,d],k)=>`<label class="check-row"><input type="radio" name="res" value="${o}" ${k===0?'checked':''}>${ic(icn,'w-4 h-4')}<span><b class="text-sm">${o}</b><span class="block text-xs muted">${d}</span></span></label>`).join('')}</div>
    ${fld('Overall rating',`<div class="flex gap-2 flex-wrap">${[1,2,3,4,5].map(n=>`<label class="check-row" style="padding:6px 10px"><input type="radio" name="rate" value="${n}" ${n===4?'checked':''}>${n}★</label>`).join('')}</div>`)}
    ${v.pool?'':`<div class="mt-4">${fld('Recommended designation',sel('r-des',DB.designations.filter(d=>d.level>=des(v.dFrom).level&&d.level<=des(v.dTo).level).map(d=>[d.id,d.name])))}</div>`}
    <div class="mt-4">${fld('Remarks',txt('r-m','','Strengths, concerns, reason for decision'),'',true)}</div>`,
    foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveResult('${iid}')">${ic('check')}Save result</button>`});
}
function saveResult(iid){
  if(!val('r-m')){toast('Remarks are required','circle-alert');return}
  const i=DB.interviews.find(x=>x.id===iid),r=$('input[name=res]:checked').value;
  Object.assign(i,{result:r,rating:+$('input[name=rate]:checked').value,remarks:val('r-m')});
  const c=cand(i.cand);c.recDes=val('r-des')||c.recDes;
  c.stage={Qualified:'Qualified','Next round':'Interview','On hold':'On hold',Disqualified:'Disqualified','No show':'Interview'}[r];if(r==='Disqualified')c.remarks=val('r-m');
  closeModal();rerender();toast(`Round ${i.round}: ${r}`,'clipboard-check');
  if(r==='Next round')setTimeout(()=>scheduleInterview(c.id,null,i.round+1),250);
  if(r==='No show')setTimeout(()=>scheduleInterview(c.id,null,i.round),250);
}

  const c=cand(id),v=cvac(c),al=DB.alumni.find(a=>a.idNo===c.idNo),t=DB.empTypes.find(x=>x.id===v.type);
  const dOpts=DB.designations.filter(d=>d.level>=des(v.dFrom).level&&d.level<=des(v.dTo).level).map(d=>[d.id,`${d.name} (${RM(d.min)}–${RM(d.max)})`]);
  openModal({title:direct?'Direct re-hire':'Convert to employee',icon:direct?'zap':'user-plus',size:'lg',body:`
    ${direct?`<div class="banner mb-4"><p class="text-sm">Re-hiring former employee <b>${al?.no||''}</b> without interview. This is logged on the employee record.</p></div>`:''}
    <div class="grid sm:grid-cols-2 gap-4">
      ${fld('Employee no.',inp('x-no','HJ-'+String(50+DB.employees.length).padStart(4,'0')),'',true)}${fld('Work email',inp('x-mail',c.name.split(' ')[0].toLowerCase()+'@hajimi.my','email'),'',true)}
      ${fld('Position title',inp('x-pos',v.pool?'':v.title),'',true)}${fld('Designation',sel('x-des',dOpts,c.recDes||v.dFrom))}
      ${fld('Department',sel('x-dept',deptNames(),v.dept||deptNames()[2]))}${fld('Employment type',sel('x-type',DB.empTypes.map(t=>t.id),v.type,`onchange="$('#x-prob').value=DB.empTypes.find(t=>t.id===this.value).probation"`))}
      ${fld('Start date',inp('x-start',addD(TODAY,14),'date'))}${fld('Probation (months)',inp('x-prob',direct?Math.min(1,t.probation):t.probation,'number','','min="0" max="6"'))}
      ${fld('Basic salary (RM)',inp('x-sal',c.expected,'number'))}${fld('Reports to (superior)',sel('x-rep',DB.employees.filter(e=>des(e.desig).level>=3).map(e=>[e.id,`${e.name} · ${des(e.desig).name}`]),v.manager))}
      ${fld('Team',sel('x-team',[['','— None —'],...DB.teams.map(t=>[t.id,`${t.name} (${t.dept})`])],DB.teams.find(t=>t.dept===v.dept)?.id||''),'sm:col-span-2')}
    </div>
    <div class="grid sm:grid-cols-2 gap-2 mt-4"><label class="check-row"><input type="checkbox" checked> Create system login & send invite</label><label class="check-row"><input type="checkbox" checked> Carry over resume photo as profile picture</label></div>`,
    foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="doConvert('${id}',${direct})">${ic('user-check')}Create employee</button>`});
}
function doConvert(id,direct){
  const c=cand(id),prob=+val('x-prob'),type=val('x-type'),start=val('x-start');
  if(!val('x-pos')){toast('Position title is required','circle-alert');return}
  const e={id:'E'+String(30+DB.employees.length),no:val('x-no'),name:c.name,email:val('x-mail'),pos:val('x-pos'),desig:val('x-des'),dept:val('x-dept'),type,status:type==='Permanent'?(prob?'Probation':'Permanent'):type,joined:start,reports:val('x-rep'),salary:+val('x-sal'),
    gender:c.gender,dob:c.dob,idType:c.idType,idNo:c.idNo,phone:c.phone,address:c.address,ec:{...c.emergency},photo:c.photo||null,infoUpdated:TODAY};
  if(prob)e.probEnd=addM(start,prob);if(type!=='Permanent')e.endDate=addM(start,type==='Internship'?6:12);
  DB.employees.push(e);const tm=DB.teams.find(t=>t.id===val('x-team'));if(tm)tm.members.push(e.id);
  c.stage='Hired';c.employee=e.id;
  logEvent(e.id,direct?'Re-hired (direct approval)':'Joined',`${e.pos} · ${des(e.desig).name} · ${type}${prob?` (probation ${prob} months)`:''}`,'acc',start);
  closeModal();closeDrawer();rerender();toast(`${c.name} is now ${e.no}`,'user-check');
}

function empActions(e){
  const hr=isHR();let h=ib('eye','View profile & history',`viewEmployee('${e.id}')`);
  if(canEdit(e.id))h+=ib('pencil','Edit employee',`editEmployee('${e.id}')`);
  if(!hr)return h+(S.user.roleKey==='lead'&&e.status!=='PIP'?ib('triangle-alert','Start PIP',`lcAction('pip','${e.id}')`,'bad'):'');
  if(e.status.includes('Probation'))h+=ib('badge-check','Confirm (pass probation)',`lcAction('confirm','${e.id}')`,'ok')+ib('timer','Extend probation',`lcAction('extend','${e.id}')`);
  if(['Contract','Internship'].includes(e.status))h+=ib('arrow-right-left','Convert / renew',`lcAction('convert','${e.id}')`,'ok');
  h+=ib('trending-up','Salary increment',`lcAction('increment','${e.id}')`)+ib('award','Promote',`lcAction('promote','${e.id}')`,'',des(e.desig).level>=Math.max(...DB.designations.map(x=>x.level)));
  h+=e.status==='PIP'?ib('flag','Close PIP',`lcAction('closepip','${e.id}')`):ib('triangle-alert','Start PIP',`lcAction('pip','${e.id}')`,'bad');
  return h;
}

function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}if(f||r.length){r.push(f);rows.push(r)}return rows.filter(x=>x.some(v=>v.trim()))}
function importEmployees(){
  openModal({title:'Import employees (CSV)',icon:'file-spreadsheet',size:'lg',body:`
    <div class="grid sm:grid-cols-[1fr_auto] gap-3 items-end"><div class="text-sm">Standard format: <b>${CSV_COLS.length} columns</b>, UTF-8, first row is the header. Rows are matched to existing staff by <b>employee_no</b>, then by <b>id_no</b>. Matches are updated, others are created.</div>
    <div class="flex gap-2"><button class="btn btn-ghost" onclick="$('#csv-in').value=CSV_COLS.join(',');toast('Header row loaded','file')">${ic('file')}Blank template</button><label class="btn btn-ghost cursor-pointer">${ic('upload')}Upload .csv<input type="file" accept=".csv,text/csv" class="sr-only" onchange="const r=new FileReader();r.onload=()=>{$('#csv-in').value=r.result};r.readAsText(this.files[0])"></label></div></div>
    <details class="mt-3"><summary class="text-sm font-semibold cursor-pointer" style="color:var(--accent)">Column reference</summary><div class="tbl-wrap mt-2"><table class="mini-tbl"><thead><tr><th>Column</th><th>Rule</th></tr></thead><tbody>${[['employee_no','Unique, e.g. HJ-0050'],['id_type','NRIC or Passport'],['date_of_birth / join_date / probation_end','YYYY-MM-DD'],['designation','Must match a designation name: '+DB.designations.map(d=>d.name).join(', ')],['department','Must match a department: '+deptNames().join(', ')],['team','Optional, must match a team name'],['employment_type','Internship, Contract, Permanent'],['status','Permanent, Probation, Promotion Probation, PIP, Contract, Internship'],['reports_to_no','Superior employee_no (can be in the same file)'],['basic_salary','Number, RM per month']].map(r=>`<tr><td class="mono">${r[0]}</td><td style="white-space:normal">${esc(r[1])}</td></tr>`).join('')}</tbody></table></div></details>
    <div class="mt-3">${fld('CSV data (sample pre-filled: 1 update, 2 new, 1 with errors)',`<textarea id="csv-in" class="input mono" rows="7" style="font-size:11.5px;white-space:pre">${esc(csvSample())}</textarea>`)}</div>
    <div id="csv-prev" class="mt-4"></div>`,
    foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-ghost" onclick="validateCSV()">${ic('scan-search')}Validate</button><button class="btn btn-primary" id="csv-go" onclick="commitCSV()" disabled style="opacity:.5">${ic('upload')}Import</button>`});
}
function validateCSV(){
  const rows=parseCSV($('#csv-in').value);if(rows.length<2){toast('Paste at least one data row','circle-alert');return}
  const head=rows[0].map(h=>h.trim().toLowerCase()),miss=CSV_COLS.filter(c=>!head.includes(c));
  if(miss.length){$('#csv-prev').innerHTML=`<div class="banner">${ic('circle-alert')}<span class="text-sm">Missing columns: <b>${miss.join(', ')}</b></span></div>`;icons();return}
  const fileNos=rows.slice(1).map(r=>r[head.indexOf('employee_no')]);
  S.csv=rows.slice(1).map(r=>{const o=Object.fromEntries(head.map((h,i)=>[h,(r[i]||'').trim()]));const err=[];
    const ex=DB.employees.find(e=>e.no===o.employee_no)||DB.employees.find(e=>e.idNo&&e.idNo===o.id_no);
    if(!o.full_name)err.push('full_name empty');
    if(!DB.designations.find(d=>d.name.toLowerCase()===o.designation.toLowerCase()))err.push(`designation "${o.designation}" not found`);
    if(!deptNames().some(d=>d.toLowerCase()===o.department.toLowerCase()))err.push(`department "${o.department}" not found`);
    if(o.team&&!DB.teams.find(t=>t.name.toLowerCase()===o.team.toLowerCase()))err.push(`team "${o.team}" not found`);
    if(o.reports_to_no&&!DB.employees.find(e=>e.no===o.reports_to_no)&&!fileNos.includes(o.reports_to_no))err.push(`superior ${o.reports_to_no} not found`);
    if(!DB.empTypes.find(t=>t.id===o.employment_type))err.push('employment_type invalid');
    const diff=ex?[['position','pos'],['basic_salary','salary'],['mobile','phone'],['address','address']].filter(([c,k])=>o[c]&&String(ex[k])!==o[c]).map(([c])=>c):[];
    return {o,ex,err,diff};});
  const ok=S.csv.filter(r=>!r.err.length);
  $('#csv-prev').innerHTML=`<div class="flex flex-wrap gap-2 mb-2">${chip(S.csv.filter(r=>!r.err.length&&!r.ex).length+' new','ok','user-plus')}${chip(S.csv.filter(r=>!r.err.length&&r.ex).length+' update','info','refresh-cw')}${chip(S.csv.filter(r=>r.err.length).length+' error','bad','circle-alert')}</div>
    <div class="tbl-wrap"><table class="mini-tbl"><thead><tr><th>Action</th><th>Employee no.</th><th>Name</th><th>Designation</th><th>Department</th><th>Notes</th></tr></thead><tbody>${S.csv.map(r=>`<tr class="${r.err.length?'row-err':''}"><td>${r.err.length?chip('Skip','bad'):r.ex?chip('Update','info'):chip('Create','ok')}</td><td class="mono">${esc(r.o.employee_no)}</td><td>${esc(r.o.full_name)}</td><td>${esc(r.o.designation)}</td><td>${esc(r.o.department)}</td><td style="white-space:normal" class="text-xs">${r.err.length?esc(r.err.join('; ')):r.ex?'Changes: '+(r.diff.join(', ')||'none'):'New record'}</td></tr>`).join('')}</tbody></table></div>
    ${S.csv.some(r=>r.err.some(x=>x.includes('department')))?`<p class="text-xs mt-2">Unknown department? <a href="javascript:closeModal();location.hash='departments'" style="color:var(--accent)" class="font-semibold">Create it in Departments</a>, then re-import.</p>`:''}`;
  const b=$('#csv-go');b.disabled=!ok.length;b.style.opacity=ok.length?1:.5;b.innerHTML=`${ic('upload')}Import ${ok.length} row${ok.length===1?'':'s'}`;icons();
}
function commitCSV(){
  const ok=S.csv.filter(r=>!r.err.length);let n=0,u=0;
  ok.forEach(({o,ex})=>{const d=DB.designations.find(x=>x.name.toLowerCase()===o.designation.toLowerCase()),dept=deptNames().find(x=>x.toLowerCase()===o.department.toLowerCase());
    const rec={no:o.employee_no,name:o.full_name,idType:o.id_type||'NRIC',idNo:o.id_no,gender:o.gender,dob:o.date_of_birth,email:o.work_email,phone:o.mobile,pos:o.position,desig:d.id,dept,type:o.employment_type,status:o.status||o.employment_type,joined:o.join_date,salary:+o.basic_salary||0,address:o.address,ec:{name:o.emergency_name,rel:o.emergency_relation,phone:o.emergency_phone}};
    if(o.probation_end)rec.probEnd=o.probation_end;
    if(ex){Object.assign(ex,rec);logEvent(ex.id,'Updated by CSV import','','info');u++}else{const e={id:'E'+String(30+DB.employees.length),photo:null,infoUpdated:TODAY,...rec};DB.employees.push(e);logEvent(e.id,'Joined (CSV import)',`${e.pos} · ${d.name}`,'acc',e.joined);n++}
    const tm=o.team&&DB.teams.find(t=>t.name.toLowerCase()===o.team.toLowerCase()),e=DB.employees.find(x=>x.no===o.employee_no);if(tm&&!tm.members.includes(e.id))tm.members.push(e.id);
  });
  ok.forEach(({o})=>{const e=DB.employees.find(x=>x.no===o.employee_no),s=DB.employees.find(x=>x.no===o.reports_to_no);if(s)e.reports=s.id});
  closeModal();rerender();toast(`Imported: ${n} created, ${u} updated`,'file-spreadsheet');
}

  if(kind==='extend'){title='Extend probation';icon='timer';body=`${fld('Extend by',sel('lc-m',[[1,'1 month'],[2,'2 months'],[3,'3 months']],1))}${fld('Current end',inp('lc-x',fmt(e.probEnd),'text','','disabled'))}${rem('Reason for extension, improvement areas')}`}
  if(kind==='confirm'){title=e.status==='Promotion Probation'?'Confirm promotion':'Confirm permanent';icon='badge-check';body=`${eff}${fld('Probation outcome',sel('lc-o',['Passed','Passed with conditions']))}${rem('Reviewer comments')}`}
  if(kind==='convert'){title=`Convert ${e.type.toLowerCase()}`;icon='arrow-right-left';body=`${fld('Convert to',sel('lc-t',e.type==='Internship'?['Permanent','Contract','End internship']:['Permanent','Renew contract (12 months)','End contract']))}${fld('Probation (months)',inp('lc-m',3,'number'))}${eff}${fld('New salary (RM)',inp('lc-s',Math.max(e.salary,des('D1').min),'number'))}${rem()}`}
  if(kind==='increment'){title='Salary increment';icon='trending-up';body=`${fld('Current salary',inp('lc-c',RM(e.salary),'text','','disabled'))}${fld('Increment %',inp('lc-p',5,'number','',`oninput="$('#lc-s').value=Math.round(${e.salary}*(1+this.value/100))"`))}${fld('New salary (RM)',inp('lc-s',Math.round(e.salary*1.05),'number'))}${eff}${fld('Type',sel('lc-k',['Annual review','Merit (KPI based)','Market adjustment','Promotion']))}<div class="text-xs muted self-end pb-2">Band ${RM(d.min)} – ${RM(d.max)} · KPI ${kpiOf(id).score.toFixed(0)} (${kpiOf(id).grade})</div>${rem()}`}
  if(kind==='promote'){title='Promote';icon='award';const next=DB.designations.filter(x=>x.level>d.level).sort((a,b)=>a.level-b.level);body=`${fld('From',inp('lc-f',d.name,'text','','disabled'))}${fld('To designation',sel('lc-to',next.map(x=>[x.id,x.name]),next[0]?.id))}${fld('New position title',inp('lc-pos',e.pos))}${fld('New salary (RM)',inp('lc-s',Math.max(next[0]?.min||e.salary,Math.round(e.salary*1.1)),'number'))}${fld('Promotion probation',sel('lc-m',[[0,'None'],[3,'3 months'],[6,'6 months']],3))}${eff}${rem()}`}
  if(kind==='pip'){title='Start Performance Improvement Plan';icon='triangle-alert';body=`${fld('Duration',sel('lc-m',[[30,'30 days'],[60,'60 days'],[90,'90 days']],DB.settings.pipDays))}${fld('Reviewer',sel('lc-rv',DB.employees.filter(x=>des(x.desig).level>d.level).map(x=>[x.id,x.name]),e.reports))}${fld('Improvement goals',txt('lc-g','','Measurable goals, one per line'),'sm:col-span-2',true)}${fld('Check-in cadence',sel('lc-ci',['Weekly','Bi-weekly']))}${eff}`}
  if(kind==='closepip'){title='Close PIP';icon='flag';body=`${fld('Outcome',sel('lc-o',['Successful — return to Permanent','Extend PIP 30 days','Unsuccessful — begin separation']))}${eff}${rem('Summary of progress against goals')}`}
  openModal({title:`${title} · ${esc(e.name)}`,icon,body:`<div class="grid sm:grid-cols-2 gap-4">${body}</div>`,foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveLc('${kind}','${id}')">${ic('check')}Confirm</button>`});
}
function saveLc(kind,id){
  const e=emp(id),d=val('lc-d')||TODAY;let msg='Saved';
  if(kind==='extend'){const m=+val('lc-m');e.probEnd=addM(e.probEnd||TODAY,m);logEvent(id,'Probation extended',`+${m} month(s). ${val('lc-r')}`,'warn');msg='Probation extended to '+fmt(e.probEnd)}
  if(kind==='confirm'){const promo=e.status==='Promotion Probation';e.status='Permanent';e.type='Permanent';delete e.probEnd;logEvent(id,promo?'Promotion confirmed':'Confirmed permanent',`${val('lc-o')}. ${val('lc-r')}`,'ok',d);msg='Confirmed'}
  if(kind==='convert'){const t=val('lc-t');if(t.startsWith('End')){logEvent(id,t,val('lc-r'),'bad',d);msg=t}else if(t.startsWith('Renew')){e.endDate=addM(e.endDate||d,12);logEvent(id,'Contract renewed','12 months','info',d);msg='Contract renewed'}else{const m=+val('lc-m');Object.assign(e,{type:t,status:t==='Permanent'?(m?'Probation':'Permanent'):t,salary:+val('lc-s')});delete e.endDate;if(m)e.probEnd=addM(d,m);if(e.desig==='D0')e.desig='D1';logEvent(id,'Converted to '+t,`${RM(e.salary)}${m?`, probation ${m} months`:''}`,'acc',d);msg='Converted to '+t}}
  if(kind==='increment'){const s=+val('lc-s'),old=e.salary;e.salary=s;logEvent(id,'Increment',`${RM(old)} → ${RM(s)} (+${((s/old-1)*100).toFixed(1)}%) · ${val('lc-k')}`,'ok',d);msg='Increment recorded'}
  if(kind==='promote'){const to=val('lc-to'),m=+val('lc-m'),from=des(e.desig).name;Object.assign(e,{desig:to,pos:val('lc-pos'),salary:+val('lc-s')});if(m){e.status='Promotion Probation';e.probEnd=addM(d,m)}logEvent(id,'Promoted',`${from} → ${des(to).name}${m?` (promotion probation ${m} months)`:''}`,'info',d);msg='Promoted to '+des(to).name}
  if(kind==='pip'){if(!val('lc-g')){toast('Add at least one goal','circle-alert');return}const n=+val('lc-m');e.prevStatus=e.status;e.status='PIP';e.pipEnd=addD(d,n);logEvent(id,'PIP started',`${n} days · Reviewer: ${ename(val('lc-rv'))} · ${val('lc-ci')} check-ins`,'bad',d);msg='PIP started'}
  if(kind==='closepip'){const o=val('lc-o');if(o.startsWith('Successful')){e.status=e.prevStatus&&e.prevStatus!=='PIP'?e.prevStatus:'Permanent';delete e.pipEnd}else if(o.startsWith('Extend'))e.pipEnd=addD(e.pipEnd,30);logEvent(id,'PIP review',o,o.startsWith('Successful')?'ok':'bad',d);msg='PIP updated'}
  closeModal();rerender();toast(msg);
}

   <section class="card flex flex-col">
     <div class="p-5 pb-3 flex items-start gap-3" style="border-bottom:1px solid var(--line)">
       <span class="w-10 h-10 grid place-items-center rounded-xl flex-none text-white" style="background:${dcol(t.dept)}">${ic('users-round','w-5 h-5')}</span>
       <div class="flex-1 min-w-0"><h3 class="font-bold text-base">${esc(t.name)}</h3><div class="text-xs muted">${esc(t.dept)} · ${t.members.length} members</div></div>
       ${hr?`<div class="actions">${ib('user-plus','Add / remove members',`editTeam('${t.id}')`)}${ib('trash-2','Delete team',`delTeam('${t.id}')`,'bad')}</div>`:''}
     </div>
     <ul class="p-3 flex flex-col gap-1">${t.members.map(m=>{const e=emp(m);if(!e)return'';const lead=t.lead===m;return `<li class="flex items-center gap-3 px-2 py-2 rounded-lg group" style="${lead?'background:color-mix(in srgb,var(--hi) 12%,transparent)':''}">
       ${av(e.name,32)}<div class="flex-1 min-w-0"><div class="text-sm font-semibold truncate flex items-center gap-1.5">${esc(e.name)}${lead?`<span style="color:var(--hi)">${ic('crown','w-4 h-4')}</span>`:''}</div><div class="text-xs muted truncate">${esc(e.pos)} · ${des(e.desig).name}${e.reports&&t.members.includes(e.reports)&&e.reports!==t.lead?` · under ${esc(ename(e.reports).split(' ')[0])}`:''}</div></div>
       ${lead?chip('PIC','hi'):hr?`<span class="actions opacity-40 group-hover:opacity-100">${ib('crown','Set as PIC',`setLead('${t.id}','${m}')`)}${ib('user-minus','Remove from team',`rmMember('${t.id}','${m}')`,'bad')}</span>`:''}</li>`}).join('')}</ul>
   </section>`).join('')}</div>`;
}
function setLead(t,m){DB.teams.find(x=>x.id===t).lead=m;rerender();toast(`${ename(m)} is now the PIC`,'crown')}
function rmMember(t,m){const tm=DB.teams.find(x=>x.id===t);tm.members=tm.members.filter(x=>x!==m);rerender();toast('Removed from team','user-minus')}
function delTeam(id){confirmBox('Delete team?','Members stay employed; only the team grouping is removed.','Delete',`DB.teams=DB.teams.filter(t=>t.id!=='${id}');closeModal();rerender();toast('Team deleted','trash-2')`)}
function editTeam(id){
  const t=id?DB.teams.find(x=>x.id===id):{name:'',dept:deptNames()[2],lead:'',members:[]};
  openModal({title:id?`Edit ${esc(t.name)}`:'New group',icon:'users-round',size:'lg',body:`<div class="grid sm:grid-cols-2 gap-4">${fld('Group name',inp('tm-n',t.name,'text','e.g. FE Developer'),'',true)}${fld('Department',sel('tm-d',deptNames(),t.dept))}</div>
  <div class="sec-h">${ic('users')}Members <span class="normal-case font-normal tracking-normal">· search, tick members, click a crown to set the PIC</span></div>${picker('tm',{selected:t.members,lead:t.lead||''})}`,
  foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveTeam('${id||''}')">${ic('check')}Save team</button>`});
}
function saveTeam(id){
  const members=picked('tm'),lead=pickedLead('tm')||members[0];
  if(!val('tm-n')||!members.length){toast('Name and at least one member required','circle-alert');return}
  if(!members.includes(lead))members.unshift(lead);
  const o={name:val('tm-n'),dept:val('tm-d'),members,lead};
  if(id)Object.assign(DB.teams.find(x=>x.id===id),o);else DB.teams.push({id:'T'+Date.now(),...o});
  closeModal();rerender();toast('Team saved','users-round');
}

/* =================== ORG CHART =================== */
function pgOrgChart(){
  const view=S.orgView||'dept';
  const tabs=`<div class="flex gap-1 mb-4">${[['dept','By department'],['tree','Reporting lines']].map(([k,l])=>`<button class="tab ${view===k?'on':''}" onclick="S.orgView='${k}';rerender()">${l}</button>`).join('')}</div>`;
  return tabs+(view==='dept'?orgBoard():orgTree());
}
function orgBoard(){
  const person=(id,t)=>{const e=emp(id);return e?`<div class="org-person">${av(e.display||e.name,40,e.photo||null)}<div><div class="font-bold text-base">${esc(e.name)}</div><div class="t">${t}</div></div></div>`:''};
  const depts=DB.departments.filter(d=>d.name!=='Management');
  const card=d=>{
    const staff=DB.employees.filter(e=>e.dept===d.name),groups=DB.teams.filter(t=>t.dept===d.name);
    const lvl=e=>`<span class="lv">${esc(des(e.desig).name)}</span>`;
    const showLabel=g=>groups.length>1||g.name!==d.name;
    const mem=id=>{const e=emp(id);if(!e)return'';const g=groups.find(t=>t.members.includes(id));return `<div class="mem">${av(e.display||e.name,26,e.photo||null)}<span class="font-medium">${esc(e.display||e.name)}</span>${g&&g.lead===id?'<span class="pic" data-tip="Person in charge of the group">PIC</span>':''}${lvl(e)}</div>`};
    return `<section class="dept-card"><header><b>${esc(d.name)}</b><span class="text-xs muted">${staff.length} ${staff.length===1?'person':'people'}</span></header>
      ${d.head&&emp(d.head)?`<div class="dept-hod">${av(ename(d.head),30)}<div><div class="font-bold text-sm">${esc(ename(d.head))}</div><div class="t">Head of department</div></div></div>`:''}
      ${groups.map(g=>(showLabel(g)?`<div class="grp-label">${esc(g.name)}</div>`:'')+g.members.map(mem).join('')).join('')}
    </section>`};
  return `<section class="card org-board">
    <div class="org-top">${person('E001','Chief Executive Officer')}<span class="stem"></span>${person('E002','General Manager')}</div>
    <div class="org-divider">${depts.length} departments</div>
    <div class="dept-cols">${depts.map(card).join('')}</div>
  </section><p class="text-xs muted mt-3">Each department shows its head (HOD), then its groups; PIC marks each group's person in charge. Built from departments and groups; switch to Reporting lines for the superior tree.</p>`;
}
function orgTree(){
  const kids=id=>DB.employees.filter(e=>e.reports===id).sort((a,b)=>des(b.desig).level-des(a.desig).level);
  const node=e=>{const k=kids(e.id),lead=DB.teams.some(t=>t.lead===e.id);return `<li><div class="org-node"><span class="strip" style="background:${dcol(e.dept)}"></span>${lead?`<span class="crown">${ic('crown')}</span>`:''}${av(e.name,40)}<div class="nm">${esc(e.name)}</div><div class="ps">${esc(e.pos)}</div><div class="mt-2 flex justify-center gap-1 flex-wrap">${chip(des(e.desig).name,'acc')}${e.status!=='Permanent'?chip(e.status,STATUS_TONE[e.status]):''}</div></div>${k.length?`<ul>${k.map(node).join('')}</ul>`:''}</li>`};
  return `<section class="card overflow-hidden">
    <div class="p-4 flex flex-wrap items-center gap-3" style="border-bottom:1px solid var(--line)">
      <div class="flex flex-wrap gap-3 flex-1 text-xs">${DB.departments.map(d=>`<span class="flex items-center gap-1.5"><i class="inline-block w-3 h-3 rounded-sm" style="background:${d.color}"></i>${esc(d.name)}</span>`).join('')}<span class="flex items-center gap-1.5" style="color:var(--hi)">${ic('crown','w-3.5 h-3.5')}<span style="color:var(--ink)">Team lead</span></span></div>
      <div class="flex items-center gap-1">${ib('zoom-out','Zoom out','zoomOrg(-.1)')}<span class="text-xs tnum w-10 text-center" id="zl">${Math.round(S.orgZoom*100)}%</span>${ib('zoom-in','Zoom in','zoomOrg(.1)')}${ib('maximize','Reset zoom','S.orgZoom=1;zoomOrg(0)')}</div>
      <button class="btn btn-primary" onclick="exportOrg()">${ic('image-down')}Export PNG</button>
    </div>
    <div class="org-scroll"><div class="tree" id="tree" style="transform:scale(${S.orgZoom})"><ul>${DB.employees.filter(e=>!e.reports).map(node).join('')}</ul></div></div>
  </section><p class="text-xs muted mt-3">Built from each employee's superior. Seniors who supervise juniors appear as their own branch. Export renders at 3× pixel density.</p>`;
}
function zoomOrg(d){S.orgZoom=Math.min(1.6,Math.max(.4,+(S.orgZoom+d).toFixed(2)));$('#tree').style.transform=`scale(${S.orgZoom})`;$('#zl').textContent=Math.round(S.orgZoom*100)+'%'}
async function exportOrg(){
  const el=$('#tree');if(!window.htmlToImage){toast('Export library not loaded','circle-alert');return}
  toast('Rendering high-resolution image…','loader');const prev=el.style.transform;el.style.transform='none';
  try{const url=await htmlToImage.toPng(el,{pixelRatio:3,backgroundColor:getComputedStyle(document.body).backgroundColor,skipFonts:true,width:el.scrollWidth,height:el.scrollHeight});el.style.transform=prev;
    openModal({title:'Org chart exported',icon:'image-down',size:'lg',body:`<img src="${url}" alt="Organization chart" class="w-full rounded-lg" style="border:1px solid var(--line)"><p class="text-xs muted mt-2">${el.scrollWidth*3} × ${el.scrollHeight*3}px. If the download is blocked in this preview, right-click the image and save it.</p>`,
      foot:`<button class="btn btn-ghost" onclick="closeModal()">Close</button><a class="btn btn-primary" href="${url}" download="org-chart-${TODAY}.png">${ic('download')}Download PNG</a>`});
  }catch(err){el.style.transform=prev;toast('Export failed: '+err.message,'circle-alert')}
}

/* =================== WORK: helpers =================== */
const effDue = t => t.due;
const myTasks = () => S.user.eid ? DB.tasks.filter(t=>t.who===S.user.eid) : DB.tasks;
const superiorOf = t => emp(t.who)?.reports;
const pmOf = t => t.project ? proj(t.project).pm : superiorOf(t);
function needsCheckin(t){
  if(!['In progress','Blocked'].includes(t.status))return false;
  const last=t.ci.at(-1)?.[0]||t.start;if(last>=TODAY)return false;
  return wdays(addD(last,1),TODAY)>=DB.settings.checkinEvery;
}
const overdue = t => t.status!=='Done' && t.due<TODAY;
const hoursOf = t => t.ci.reduce((a,c)=>a+(+c[2]||0),0);
function pendingApprovals(){
  const u=S.user,out=[];if(!u)return out;
  DB.tasks.forEach(t=>(t.ext||[]).forEach(x=>{if(x.status!=='Pending')return;
    if([x.sup,x.pm].some(s=>s.st==='Pending'&&(s.who===u.eid||u.roleKey==='sysadmin')))out.push({t,x})}));
  return out;
}
function projHealth(p){
  const ts=DB.tasks.filter(t=>t.project===p.id);
  if(p.phase>=4&&ts.every(t=>t.status==='Done'))return ['Live','ok'];
  if(ts.some(overdue))return ['Delayed','bad'];
  if(ts.some(t=>t.status==='Blocked')||DB.delays.some(d=>d.project===p.id&&d.status==='Open'))return ['At risk','warn'];
  return ['On track','ok'];
}
function projProgress(p){const ts=DB.tasks.filter(t=>t.project===p.id),w=ts.reduce((a,t)=>a+tpts(t),0);return w?Math.round(ts.reduce((a,t)=>a+tpts(t)*t.pct,0)/w):0}
const canManageProj = p => ['sysadmin','exec'].includes(S.user.roleKey)||p.pm===S.user.eid||(S.user.roleKey==='lead'&&p.members.includes(S.user.eid));

/* task table (shared) */
function taskTable(list,{compact=false,project=false}={}){
  if(!list.length)return `<p class="muted text-sm p-5">No tasks here.</p>`;
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Task</th><th>Tag</th>${compact?'':'<th>Assignee</th>'}<th>Due</th><th>Progress</th><th>Status</th><th class="text-right">Actions</th></tr></thead><tbody>
  ${list.map(t=>{const p=proj(t.project),od=overdue(t),pend=(t.ext||[]).some(x=>x.status==='Pending'),dl=DB.delays.filter(d=>d.task===t.id);return `<tr>
    <td><button class="text-left" onclick="viewTask('${t.id}')"><div class="font-semibold">${esc(t.title)}</div><div class="text-xs muted">${p&&!project?esc(p.name):p?'':'Standalone'}${t.deps.length?` · depends on ${t.deps.length}`:''}</div></button></td>
    <td>${tagc(t)}</td>${compact?'':`<td><span class="flex items-center gap-2">${av(ename(t.who),26)}<span class="text-sm">${esc(ename(t.who))}</span></span></td>`}
    <td class="tnum">${fmtS(t.due)}${t.origDue?`<div class="text-xs muted">was ${fmtS(t.origDue)}</div>`:''}${od?`<div class="text-xs" style="color:var(--bad)">${-days(t.due)}d overdue</div>`:''}</td>
    <td><div class="flex items-center gap-2"><div class="pct" style="width:70px"><i style="width:${t.pct}%"></i></div><span class="text-xs tnum">${t.pct}%</span></div></td>
    <td><div class="flex flex-col gap-1 items-start">${chip(t.status,TASK_TONE[t.status])}${needsCheckin(t)?chip('Check-in due','warn','message-square-warning'):''}${pend?chip('Ext. pending','hi','clock'):''}${dl.length?chip(dl.length+' delay','bad','flag'):''}</div></td>
    <td><div class="actions">${taskActions(t)}</div></td></tr>`}).join('')}
  </tbody></table></div>`;
}
function taskActions(t){
  const mine=t.who===S.user.eid||S.user.roleKey==='sysadmin',p=proj(t.project),mgr=p?canManageProj(p):isHR()||S.user.roleKey==='lead';
  let h=ib('eye','Open task',`viewTask('${t.id}')`);
  if(t.status!=='Done'){
    if(mine)h+=ib('message-square-plus','Check in / update status',`checkin('${t.id}')`,needsCheckin(t)?'acc':'');

}

const ACT_IC={checkin:['message-square-text','info'],ext:['clock','hi'],delay:['flag','bad'],done:['circle-check','ok'],phase:['skip-forward','accent'],task:['plus','accent'],meeting:['presentation','info']};
const actList = l => l.length?`<div class="flex flex-col">${l.slice(0,12).map(a=>`<div class="log-i"><span class="dot" style="--t:var(--${ACT_IC[a.k][1]})">${ic(ACT_IC[a.k][0])}</span><div class="text-sm flex-1 min-w-0"><b>${esc(ename(a.who))}</b> ${esc(a.x)}<div class="text-xs muted">${fmt(a.d)}, ${a.t}</div></div></div>`).join('')}</div>`:'<p class="text-sm muted">No activity yet.</p>';
function gantt(p,ts){
  const total=days(p.end,p.start)+1,pos=d=>Math.max(0,Math.min(100,days(d,p.start)/total*100));
  let grid='',lbl='';for(let d=p.start;d<=p.end;d=addD(d,1)){if(new Date(d+'T12:00:00').getDay()===1){grid+=`<span class="g-grid" style="left:${pos(d)}%"></span>`;lbl+=`<span class="absolute text-[10px] muted" style="left:calc(${pos(d)}% + 3px);top:-16px">${fmtS(d)}</span>`}}
  const inR=TODAY>=p.start&&TODAY<=p.end,today=inR?`<span class="g-today" style="left:${pos(TODAY)}%"></span>`:'',todayL=inR?`<span class="g-today g-today-l" style="left:${pos(TODAY)}%"></span>`:'';
  const col={Done:'var(--ok)','In progress':'var(--accent)',Blocked:'var(--bad)','To do':'var(--line-strong)',Review:'var(--warn)'};
  const phaseRow=`<div class="g-row"><div class="g-label text-xs font-bold muted uppercase">Phases</div><div class="g-track">${grid}${lbl}${todayL}${p.phases.map((ph,i)=>`<span class="g-phase" style="left:${pos(ph[1])}%;width:${(days(ph[2],ph[1])+1)/total*100}%;background:color-mix(in srgb,var(--accent) ${i===p.phase?28:10}%,transparent);color:var(--ink)">${ph[0]}</span>`).join('')}</div></div>`;
  return `<div class="gantt">${phaseRow}${ts.sort((a,b)=>a.start.localeCompare(b.start)).map(t=>{
    const l=pos(t.start),w=(days(t.due,t.start)+1)/total*100,over=overdue(t)?`<span class="g-over" style="left:${l+w}%;width:${pos(TODAY)-l-w}%"></span>`:'';
    const late=t.status==='Done'&&t.done>(t.origDue||t.due)?`<span class="g-over" style="left:${l+(days(t.origDue||t.due,t.start)+1)/total*100}%;width:${days(t.done,t.origDue||t.due)/total*100}%" data-tip="Finished ${days(t.done,t.origDue||t.due)}d late"></span>`:'';
    const ext=t.origDue?`<span class="absolute" style="left:${l+(days(t.origDue,t.start)+1)/total*100}%;top:10px;bottom:10px;border-left:2px dashed var(--hi)" data-tip="Original due ${fmtS(t.origDue)} (extension approved)"></span>`:'';
    return `<div class="g-row"><div class="g-label">${tagc(t)}<button class="text-left min-w-0 flex-1" onclick="viewTask('${t.id}')"><div class="text-sm font-semibold truncate">${esc(t.title)}</div><div class="text-xs muted truncate">${esc(ename(t.who))}${t.deps.length?' · after '+t.deps.join(', '):''}</div></button></div>
      <div class="g-track">${grid}${today}<span class="g-bar" style="left:${l}%;width:${w}%;background:${col[t.status]}" onclick="viewTask('${t.id}')" data-tip="${esc(t.title)} · ${fmtS(t.start)}–${fmtS(t.due)} · ${t.pct}%"><span class="fill" style="width:${t.pct}%"></span><span>${t.pct}%</span></span>${over}${late}${ext}</div></div>`}).join('')}</div>`;
}

function saveProject(){
  const s=val('np-s'),e=val('np-e'),pm=val('np-pm');if(!val('np-n')||!s||!e||e<=s){toast('Name and a valid date range are required','circle-alert');return}
  const tot=days(e,s),cut=[0,.1,.7,.78,.95,1].map(f=>addD(s,Math.round(tot*f)));
  const names=['Preparation','Development','Staging','UAT','Production'],phases=names.map((n,i)=>[n,i?addD(cut[i],1):cut[0],cut[i+1]]);
  const members=[...new Set([pm,...picked('np')])],id='P'+String(DB.projects.length+1).padStart(3,'0');
  DB.projects.push({id,name:val('np-n'),client:val('np-c')||'Internal',pm,start:s,end:e,phase:0,desc:val('np-d'),phases,members,prereq:picked('np-pre').map(x=>({item:x,owner:pm,due:addD(s,3),status:'Pending'}))});
  act(id,'task',`created the project with ${members.length} members.`);closeModal();location.hash='project-'+id.toLowerCase();toast('Project created · invites sent','folder-plus');
}

function approveExt(tid,xid,dec){
  const t=task(tid),x=t.ext.find(e=>e.id===xid),u=S.user;
  [x.sup,x.pm].filter(s=>s.st==='Pending'&&(s.who===u.eid||u.roleKey==='sysadmin')).slice(0,u.roleKey==='sysadmin'?1:2).forEach(s=>s.st=dec);

  act(t.project,'ext',`${dec.toLowerCase()} +${x.days} days on “${t.title}”${x.status==='Approved'?` (new due ${fmtS(t.due)})`:''}.`,u.eid);
  rerender();toast(x.status==='Pending'?`${dec}. Waiting for the other approver.`:`Extension ${x.status.toLowerCase()}`,dec==='Approved'?'check':'x');

  const t=tid?task(tid):null,p=proj(t?.project||pid),tasks=p?DB.tasks.filter(x=>x.project===p.id):[t];

  openModal({title:'Record delay / blocker',icon:'flag',size:'lg',body:`<p class="text-sm muted mb-4">Use this when someone's late, incomplete or inaccurate work holds up others. It stays on the project trace and affects the responsible person's KPI (except external parties).</p>
  <div class="grid sm:grid-cols-2 gap-4">
    ${fld('Related task',sel('dl-t',tasks.map(x=>[x.id,`${x.title} (${ename(x.who)})`]),t?.id),'sm:col-span-2')}
    ${fld('Responsible (caused the delay)',sel('dl-r',[...ppl.map(m=>[m,ename(m)]),['ext:Client','Client / external party']],t?(t.deps[0]?task(t.deps[0]).who:t.who):ppl[0]),'',true)}${fld('Cause',sel('dl-c',DELAY_CAUSES))}
    ${fld('Date it happened',inp('dl-d',TODAY,'date'))}${fld('Working days lost',inp('dl-n',1,'number','','min="0"'))}

  <div class="sec-h">${ic('users')}Who was affected</div>${picker('dl-a',{selected:t&&t.who!==S.user.eid?[t.who]:t?[t.who]:[],pool:ppl,quick:false})}`,
  foot:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="saveDelay()">${ic('flag')}Record delay</button>`});
}
function saveDelay(){
  if(!val('dl-x')){toast('Describe what happened','circle-alert');return}
  const t=task(val('dl-t')),d={id:'DL'+(DB.delays.length+1),task:t.id,project:t.project,date:val('dl-d'),resp:val('dl-r'),affected:picked('dl-a'),cause:val('dl-c'),days:+val('dl-n')||0,note:val('dl-x'),by:S.user.eid||'E002',status:'Open'};

const TARGET=[40,70,90,110,130,110,90,70,40];          // points per quarter by designation level (L0 Intern … L8 C-Level)
const QTR={label:'Q4 2026',start:'2026-10-01',end:'2026-12-31'};
const elapsed=()=>Math.min(1,(days(TODAY,QTR.start)+1)/(days(QTR.end,QTR.start)+1));
const KPI_PARTS=[['delivery','Delivery points','Points earned vs pro-rated target for the designation'],['ontime','On-time rate','Tasks finished by the (approved) due date'],['delay','Delay accountability','−12 per working day of delay caused to others'],['checkin','Check-in compliance','Check-ins made vs required'],['quality','Quality','−15 per task reopened for rework'],['rating','Superior rating','1–5 rating from superior / team lead'],['meeting','Meeting attendance','Present = 1, late = 0.5, absent = 0']];
DB.extScore={};
function kpiOf(id){
  const e=emp(id);if(!e)return null;
  const b=DB.kpiBase[id]||{pts:0,tasks:0,ontime:0,ce:0,cd:0,rw:0,rating:3,src:'Hajimi'};
  const ts=DB.tasks.filter(t=>t.who===id),done=ts.filter(t=>t.status==='Done'&&t.done>=QTR.start),ext=DB.ext.filter(x=>x.who===id);
  const pts=b.pts+done.reduce((a,t)=>a+tpts(t),0)+ext.reduce((a,x)=>a+x.pts,0);
  const ntask=b.tasks+done.length+ext.length,ontime=b.ontime+done.filter(t=>t.done<=t.due).length+ext.filter(x=>x.ontime).length;
  let ce=b.ce,cd=b.cd;
  ts.filter(t=>t.status!=='To do').forEach(t=>{const end=t.done||TODAY,exp=Math.max(1,Math.floor(wdays(t.start,end<t.start?t.start:end)/DB.settings.checkinEvery));ce+=exp;cd+=Math.min(exp,t.ci.length)});
  const delayDays=DB.delays.filter(d=>d.resp===id&&d.date>=QTR.start).reduce((a,d)=>a+d.days,0);
  const rw=b.rw+ts.reduce((a,t)=>a+(t.rework||0),0);
  const meets=DB.meetings.filter(m=>m.status==='Completed'&&mAtt(m).includes(id));
  const mInv=meets.length,mPres=meets.filter(m=>(m.att[id]||'present')==='present').length,mLate=meets.filter(m=>m.att[id]==='late').length;
  const target=Math.max(1,Math.round(TARGET[des(e.desig).level]*elapsed()));
  const parts={delivery:Math.min(100,pts/target*100),ontime:ntask?ontime/ntask*100:null,delay:Math.max(0,100-delayDays*12),checkin:ce?cd/ce*100:null,quality:Math.max(0,100-rw*15),rating:(b.rating||3)*20,meeting:mInv?(mPres+mLate*.5)/mInv*100:null};
  const W=DB.settings.weights;let ws=0,sum=0;for(const k in parts)if(parts[k]!==null){ws+=W[k];sum+=W[k]*parts[k]}
  let score=ws?sum/ws:0;
  const src=ext.length||((b.src==='ClickUp'||b.src==='Mixed')&&ts.length)?'Mixed':b.src;
  if(DB.settings.kpiMode==='external'&&DB.extScore[id]!=null)score=DB.extScore[id];
  return {id,pts,target,ntask,ontime,ce,cd,delayDays,rw,mInv,mPres,mLate,parts,score,grade:score>=85?'A':score>=70?'B':score>=55?'C':'D',src,ws,rating:b.rating||3,imported:ext.length+(b.src!=='Hajimi'?b.tasks:0)};
}
const GRADE_T={A:'ok',B:'info',C:'warn',D:'bad'};
const gradeBadge = k => `<span class="grade" style="background:color-mix(in srgb,var(--${GRADE_T[k.grade]}) 16%,transparent);color:var(--${GRADE_T[k.grade]})">${k.grade}</span>`;

}

  ${list.map(({e,k})=>`<tr><td><div class="flex items-center gap-2">${av(e.name,30)}<div class="min-w-0"><div class="font-semibold">${esc(e.name)}</div><div class="text-xs muted">${des(e.desig).name} · ${esc(e.dept)}</div></div></div></td>

    ${['ontime','delay','checkin','quality','rating','meeting'].map(p=>`<td class="text-center">${pc(k.parts[p])}</td>`).join('')}
    <td><div class="flex items-center gap-2">${gradeBadge(k)}<span class="score tnum">${k.score.toFixed(1)}</span></div></td>
    <td><div class="actions">${ib('chart-no-axes-column','Breakdown',`viewKpi('${e.id}')`)}${(isHR()||scope().includes(e.id))&&e.id!==S.user.eid?ib('star','Set superior rating',`rateEmp('${e.id}')`):''}</div></td></tr>`).join('')}
  </tbody></table></div></section>
  <p class="text-xs muted mt-3">Targets per quarter by level: ${DB.designations.filter(d=>d.level<9).map(d=>`${d.name} ${TARGET[d.level]}`).join(' · ')} points, pro-rated to today.</p>`;
}
