# Meridian Workforce: local dev site for XAMPP (Apache 2.4.47+).
# Included from C:\xampp\apache\conf\extra\httpd-vhosts.conf by tools/xampp/apply-config.ps1.
#
# http://meridian.localhost
#   /api, /sanctum, /healthz, /readyz  -> Laravel (backend/public)
#   everything else                    -> Next.js dev server on :3000 (with HMR websocket)
#
# Browsers resolve *.localhost to 127.0.0.1 on their own; no hosts-file entry is needed.
# For curl, use: curl --resolve meridian.localhost:80:127.0.0.1 http://meridian.localhost/healthz

Define MERIDIAN_ROOT "C:/xampp/htdocs/employee-management-system"

# Once any <VirtualHost> exists, the first one becomes Apache's default site.
# Keep plain http://localhost (dashboard, phpMyAdmin, other projects) working as before.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs"
</VirtualHost>

<VirtualHost *:80>
    ServerName meridian.localhost

    DocumentRoot "${MERIDIAN_ROOT}/backend/public"
    <Directory "${MERIDIAN_ROOT}/backend/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On

    # Served by Laravel. /index.php is excluded too: Laravel's .htaccess rewrites
    # /api/... to /index.php, and that internal request must not go to Next.js.
    ProxyPass /api !
    ProxyPass /sanctum !
    ProxyPass /healthz !
    ProxyPass /readyz !
    ProxyPass /index.php !

    # Everything else: Next.js dev server, including its HMR websocket.
    ProxyPass        / http://127.0.0.1:3000/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog "logs/meridian-error.log"
    CustomLog "logs/meridian-access.log" combined
</VirtualHost>
